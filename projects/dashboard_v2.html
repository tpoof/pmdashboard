<!--
  LEAF Project & Task Health - standalone report (loaded via report.php iframe).
  Separate document, so it links project_v20.css directly for tokens and pm- classes.
  Requires Chart.js 3+ (indexAxis / scales.x API).
-->
<link rel="stylesheet" href="./files/project_v20.css" />
<div id="pmAn" data-csrf="<!--{$CSRFToken}-->">
  <header class="pmAn-header">
    <div>
      <h1 class="pmAn-title">Project &amp; Task Health</h1>
      <p class="pm-muted pmAn-scope" id="pmAnScope">All fiscal years</p>
    </div>
    <div class="pmAn-controls">
      <div class="pmAn-field">
        <label class="pm-label" for="pmAnFy">Fiscal Year</label>
        <select id="pmAnFy" class="pm-select">
          <option value="">All</option>
        </select>
      </div>
      <div id="pmAnWindowWrap" class="pmAn-field">
        <label class="pm-label" for="pmAnWindow">Completed within</label>
        <select id="pmAnWindow" class="pm-select"></select>
      </div>
      <div class="pmAn-actions">
        <button type="button" id="pmAnRefresh" class="pm-ghostBtn">Refresh</button>
        <button type="button" id="pmAnDefaultsBtn" class="pm-ghostBtn pmAn-defaultsBtn" aria-expanded="false" aria-controls="pmAnDefaults">Defaults</button>
      </div>
    </div>
  </header>

  <div id="pmAnDefaults" class="pmAn-card pmAn-defaults" hidden>
    <p id="pmAnDefaultsSaved"></p>
    <div class="pmAn-defaultsActions">
      <button type="button" id="pmAnSaveDefault" class="pm-ghostBtn">Save as team default</button>
      <button type="button" id="pmAnResetDefault" class="pm-ghostBtn">Reset to team default</button>
    </div>
    <p id="pmAnDefaultsMsg" class="pm-muted pmAn-cap"></p>
  </div>

  <p id="pmAnStatus" class="pm-srOnly" role="status"></p>

  <p id="pmAnLoading" class="pmAn-loading" role="status"></p>

  <div id="pmAnError" class="pmAn-error" role="alert" hidden>
    <p id="pmAnErrorMsg"></p>
    <button type="button" id="pmAnRetry" class="pm-ghostBtn">Retry</button>
  </div>

  <div id="pmAnContent" hidden>
    <div class="pm-tabs pmAn-tabs" role="tablist" aria-label="Report views">
      <button type="button" class="pm-tab" role="tab" id="pmAnTabHealth" aria-controls="pmAnPanelHealth" aria-selected="true">Health</button>
      <button type="button" class="pm-tab" role="tab" id="pmAnTabMeeting" aria-controls="pmAnPanelMeeting" aria-selected="false" tabindex="-1">Team Meeting</button>
      <button type="button" class="pm-tab" role="tab" id="pmAnTabOkr" aria-controls="pmAnPanelOkr" aria-selected="false" tabindex="-1">OKRs</button>
      <button type="button" class="pm-tab" role="tab" id="pmAnTabRoadmap" aria-controls="pmAnPanelRoadmap" aria-selected="false" tabindex="-1">Roadmap</button>
    </div>

    <div id="pmAnPanelHealth" role="tabpanel" aria-labelledby="pmAnTabHealth">
    <p id="pmAnEmpty" class="pmAn-empty" hidden></p>

    <ul class="pmAn-kpis" id="pmAnKpis">
      <li class="pmAn-kpi" data-kpi="openProjects" data-color="inflight">
        <button type="button" class="pmAn-kpiBtn" aria-pressed="false" aria-controls="pmAnDrill">
          <span class="pmAn-kpiValue"></span>
          <span class="pmAn-kpiLabel">Open Projects</span>
        </button>
      </li>
      <li class="pmAn-kpi" data-kpi="openTasks" data-color="inflight">
        <button type="button" class="pmAn-kpiBtn" aria-pressed="false" aria-controls="pmAnDrill">
          <span class="pmAn-kpiValue"></span>
          <span class="pmAn-kpiLabel">Open Tasks</span>
        </button>
      </li>
      <li class="pmAn-kpi" data-kpi="overdue" data-color="overdue">
        <button type="button" class="pmAn-kpiBtn" aria-pressed="false" aria-controls="pmAnDrill">
          <span class="pmAn-kpiValue"></span>
          <span class="pmAn-kpiLabel">Overdue Tasks</span>
        </button>
      </li>
      <li class="pmAn-kpi" data-kpi="atrisk" data-color="atrisk">
        <button type="button" class="pmAn-kpiBtn" aria-pressed="false" aria-controls="pmAnDrill">
          <span class="pmAn-kpiValue"></span>
          <span class="pmAn-kpiLabel">At Risk Tasks</span>
        </button>
      </li>
      <li class="pmAn-kpi" data-kpi="blocked" data-color="neutral">
        <button type="button" class="pmAn-kpiBtn" aria-pressed="false" aria-controls="pmAnDrill">
          <span class="pmAn-kpiValue"></span>
          <span class="pmAn-kpiLabel">Blocked / On Hold Tasks</span>
        </button>
      </li>
      <li class="pmAn-kpi" data-kpi="complete" data-color="complete">
        <button type="button" class="pmAn-kpiBtn" aria-pressed="false" aria-controls="pmAnDrill">
          <span class="pmAn-kpiValue"></span>
          <span class="pmAn-kpiLabel">Completed Tasks</span>
        </button>
      </li>
    </ul>

    <section id="pmAnDrill" class="pmAn-card pmAn-drill" aria-labelledby="pmAnDrillTitle" hidden>
      <h2 id="pmAnDrillTitle"></h2>
      <p id="pmAnDrillEmpty" class="pmAn-empty" hidden>No records in this group.</p>
      <ul id="pmAnDrillList" class="pmAn-list"></ul>
      <button type="button" id="pmAnDrillMore" class="pm-ghostBtn pmAn-drillMore" hidden></button>
    </section>

    <div class="pmAn-charts" id="pmAnCharts">
      <section class="pmAn-card" aria-labelledby="pmAnTaskStatusTitle">
        <h2 id="pmAnTaskStatusTitle">Tasks by Status</h2>
        <div class="pmAn-chartBox">
          <canvas id="pmAnTaskStatusChart" role="img" aria-labelledby="pmAnTaskStatusSummary"></canvas>
        </div>
        <span id="pmAnTaskStatusSummary" hidden></span>
        <table id="pmAnTaskStatusTable" class="pm-srOnly"></table>
      </section>

      <section class="pmAn-card" aria-labelledby="pmAnProjectStatusTitle">
        <h2 id="pmAnProjectStatusTitle">Projects by Status</h2>
        <div class="pmAn-chartBox">
          <canvas id="pmAnProjectStatusChart" role="img" aria-labelledby="pmAnProjectStatusSummary"></canvas>
        </div>
        <span id="pmAnProjectStatusSummary" hidden></span>
        <table id="pmAnProjectStatusTable" class="pm-srOnly"></table>
      </section>

      <section class="pmAn-card" aria-labelledby="pmAnAssigneeTitle">
        <h2 id="pmAnAssigneeTitle">Open Tasks by Assignee</h2>
        <div class="pmAn-chartBox pmAn-chartBox--tall">
          <canvas id="pmAnAssigneeChart" role="img" aria-labelledby="pmAnAssigneeSummary"></canvas>
        </div>
        <span id="pmAnAssigneeSummary" hidden></span>
        <p id="pmAnAssigneeCap" class="pm-muted pmAn-cap" hidden></p>
        <table id="pmAnAssigneeTable" class="pm-srOnly"></table>
      </section>

      <section class="pmAn-card" aria-labelledby="pmAnCompletedTitle">
        <h2 id="pmAnCompletedTitle">Completed by Month</h2>
        <div class="pmAn-chartBox pmAn-chartBox--tall">
          <canvas id="pmAnCompletedChart" role="img" aria-labelledby="pmAnCompletedSummary"></canvas>
        </div>
        <span id="pmAnCompletedSummary" hidden></span>
        <table id="pmAnCompletedTable" class="pm-srOnly"></table>
      </section>
    </div>
    </div>

    <div id="pmAnPanelMeeting" role="tabpanel" aria-labelledby="pmAnTabMeeting" hidden>
      <p id="pmAnMeetEmpty" class="pmAn-empty" hidden>No tasks for this scope.</p>
      <div id="pmAnMeet" class="pmAn-meet">
        <nav class="pmAn-card pmAn-people" aria-label="Team members">
          <ul id="pmAnPeople" class="pmAn-list"></ul>
        </nav>
        <div class="pmAn-card" role="region" aria-labelledby="pmAnPersonName">
          <div class="pmAn-detailHead">
            <div>
              <h2 id="pmAnPersonName"></h2>
              <p id="pmAnPersonSummary" class="pm-muted pmAn-cap"></p>
            </div>
            <button type="button" id="pmAnToggleAll" class="pm-ghostBtn"></button>
          </div>
          <div id="pmAnGroups"></div>
        </div>
      </div>
      <p id="pmAnMeetStatus" class="pm-srOnly" role="status"></p>
    </div>

    <div id="pmAnPanelOkr" role="tabpanel" aria-labelledby="pmAnTabOkr" hidden>
      <p id="pmAnOkrEmpty" class="pmAn-empty" hidden>No objectives for this scope.</p>
      <div id="pmAnOkr">
        <div class="pmAn-card pmAn-strip">
          <p id="pmAnOkrTotals" class="pmAn-totals"></p>
          <p id="pmAnOkrHealth" class="pm-muted pmAn-cap"></p>
        </div>
        <div class="pmAn-card">
          <div class="pmAn-detailHead">
            <h2>Objectives</h2>
            <button type="button" id="pmAnOkrToggleAll" class="pm-ghostBtn"></button>
          </div>
          <div id="pmAnOkrList"></div>
        </div>
      </div>
    </div>

    <div id="pmAnPanelRoadmap" role="tabpanel" aria-labelledby="pmAnTabRoadmap" hidden>
      <p id="pmAnRoadEmpty" class="pmAn-empty" hidden>No roadmap items for this scope.</p>
      <div id="pmAnRoad">
        <div class="pmAn-card pmAn-strip">
          <p id="pmAnRoadTotals" class="pmAn-totals"></p>
          <div id="pmAnRoadFilter" class="pmAn-filters" role="group" aria-label="Filter by status"></div>
        </div>
        <div id="pmAnRoadSections"></div>
      </div>
      <p id="pmAnRoadStatus" class="pm-srOnly" role="status"></p>
    </div>

    <p id="pmAnFootnote" class="pm-muted pmAn-footnote" role="status" aria-live="polite"></p>
  </div>
</div>

<script src="./files/chart.js"></script>

<style>
  #pmAn {
    /* Same hexes as v20's .pm-overdueRed, .pm-completeMid and .pm-completeGreen. */
    --pmAn-overdue: #b00020;
    --pmAn-atrisk: #b26a00;
    --pmAn-complete: #2e7d32;
    --pmAn-text-xs: 0.75rem;
    --pmAn-text-sm: 0.8125rem;
    --pmAn-text-md: 0.875rem;
    --pmAn-text-base: 1rem;
    --pmAn-text-lg: 1.125rem;
    --pmAn-text-xl: 1.5rem;
    --pmAn-text-2xl: 1.75rem;
    --pmAn-bar: 4px;
    --pmAn-pill: 999px;
    --pmAn-control-h: 34px;
    --pmAn-sidebar-w: 300px;
    --pmAn-progress-w: 160px;
    --pmAn-chart-h: 260px;
    max-width: 1400px;
    margin: 0 auto;
    padding: var(--space-4);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    color: var(--text);
  }

  #pmAn *,
  #pmAn *::before,
  #pmAn *::after {
    box-sizing: border-box;
  }

  .pmAn-header {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: space-between;
    gap: var(--space-3);
    margin-bottom: var(--space-4);
  }

  .pmAn-title {
    margin: 0;
    font-size: var(--pmAn-text-xl);
    font-weight: 800;
  }

  .pmAn-scope {
    margin: var(--space-1) 0 0;
  }

  .pmAn-controls {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    gap: var(--space-3);
  }

  .pmAn-field {
    display: flex;
    flex-direction: column;
    gap: var(--space-1);
  }

  .pmAn-actions {
    display: flex;
    flex-wrap: wrap;
    gap: var(--space-2);
    margin-left: auto;
  }

  /* v20 fixes .pm-ghostBtn at 34px, which clips labels under text zoom. */
  .pmAn-actions .pm-ghostBtn,
  .pmAn-filterBtn {
    height: auto;
    min-height: var(--pmAn-control-h);
  }

  .pmAn-defaultsBtn,
  .pmAn-filterBtn {
    display: inline-flex;
    align-items: center;
    gap: var(--space-1);
  }

  .pmAn-icon {
    width: 1.25em;
    height: 1.25em;
    flex: none;
  }

  [aria-expanded="true"] .pmAn-icon--collapsed,
  [aria-expanded="false"] .pmAn-icon--expanded,
  .pmAn-icon--check {
    display: none;
  }

  [aria-pressed="true"] .pmAn-icon--check {
    display: inline;
  }

  #pmAn :is(button, a, select):focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }

  #pmAn :is(.pmAn-kpiBtn, .pmAn-groupBtn, .pmAn-linkBtn, .pm-ghostBtn:enabled:not([aria-pressed="true"]), .pmAn-person:not([aria-current="true"])):hover {
    background: var(--accent-soft);
  }

  #pmAn .pm-ghostBtn:disabled {
    opacity: 0.35;
    cursor: default;
  }

  .pmAn-defaults {
    margin-bottom: var(--space-4);
  }

  .pmAn-defaults p {
    margin: 0;
  }

  .pmAn-defaultsActions {
    display: flex;
    flex-wrap: wrap;
    gap: var(--space-2);
    margin: var(--space-3) 0 var(--space-2);
  }

  .pmAn-loading {
    margin: 0 0 var(--space-4);
    font-weight: 600;
  }

  .pmAn-loading:empty {
    margin: 0;
  }

  .pmAn-error {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: var(--space-3);
    margin-bottom: var(--space-4);
    padding: var(--space-3) var(--space-4);
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: var(--pmAn-bar) solid var(--pmAn-overdue);
    border-radius: var(--radius-md);
  }

  .pmAn-error p {
    margin: 0;
    font-weight: 600;
  }

  .pmAn-empty {
    margin: 0 0 var(--space-4);
    padding: var(--space-6) var(--space-4);
    background: var(--surface);
    border: 1px dashed var(--border);
    border-radius: var(--radius-lg);
    text-align: center;
    font-weight: 600;
  }

  .pmAn-kpis {
    display: grid;
    grid-template-columns: repeat(6, minmax(0, 1fr));
    gap: var(--space-3);
    margin: 0 0 var(--space-4);
    padding: 0;
    list-style: none;
  }

  .pmAn-kpi {
    min-width: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-left-width: var(--pmAn-bar);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-sm);
  }

  .pmAn-kpiBtn {
    display: flex;
    flex-direction: column;
    gap: var(--space-1);
    width: 100%;
    height: 100%;
    min-height: 24px;
    padding: var(--space-3);
    border: 0;
    border-radius: inherit;
    background: transparent;
    color: var(--text);
    font: inherit;
    text-align: left;
    cursor: pointer;
  }

  /* Outline survives forced colors. The focus rule outranks it; the check icon still marks pressed. */
  .pmAn-kpiBtn[aria-pressed="true"] {
    outline: 2px solid var(--text);
    outline-offset: -2px;
  }

  .pmAn-drill {
    margin-bottom: var(--space-4);
  }

  .pmAn-drillMore {
    margin-top: var(--space-3);
  }

  .pmAn-kpiValue {
    font-size: var(--pmAn-text-2xl);
    font-weight: 800;
    line-height: 1.1;
  }

  .pmAn-kpiLabel {
    display: flex;
    align-items: center;
    gap: var(--space-1);
    font-size: var(--pmAn-text-sm);
    font-weight: 700;
    color: var(--muted);
  }

  .pmAn-charts {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: var(--space-4);
  }

  /* Contains the absolutely positioned sr-only tables, which ignore width: 1px. */
  .pmAn-card {
    position: relative;
    overflow: hidden;
    min-width: 0;
    padding: var(--space-4);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm);
  }

  .pmAn-card h2 {
    margin: 0 0 var(--space-3);
    font-size: var(--pmAn-text-base);
    font-weight: 700;
  }

  .pmAn-chartBox {
    position: relative;
    height: var(--pmAn-chart-h);
  }

  .pmAn-chartBox--tall {
    --pmAn-chart-h: 360px;
  }

  .pmAn-cap {
    margin: var(--space-2) 0 0;
    font-size: var(--pmAn-text-sm);
  }

  .pmAn-footnote {
    margin: var(--space-4) 0 0;
    font-size: var(--pmAn-text-sm);
  }

  .pmAn-tabs {
    flex-wrap: wrap;
    margin-bottom: var(--space-4);
  }

  /* v20 marks the selected tab with background colors only, which forced colors removes. */
  @media (forced-colors: active) {
    .pmAn-tabs .pm-tab[aria-selected="true"] {
      text-decoration: underline 2px;
    }
  }

  .pmAn-meet {
    display: grid;
    grid-template-columns: var(--pmAn-sidebar-w) minmax(0, 1fr);
    gap: var(--space-4);
    align-items: start;
  }

  .pmAn-people {
    padding: var(--space-2);
  }

  .pmAn-list {
    margin: 0;
    padding: 0;
    list-style: none;
  }

  .pmAn-person {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: var(--space-1);
    width: 100%;
    min-height: var(--pmAn-control-h);
    padding: var(--space-2) var(--space-3);
    border: 0;
    border-left: var(--pmAn-bar) solid transparent;
    border-radius: var(--radius-sm);
    background: transparent;
    color: var(--text);
    font: inherit;
    text-align: left;
    cursor: pointer;
  }

  .pmAn-person[aria-current="true"] {
    border-left-color: var(--accent);
    background: var(--accent-soft);
  }

  .pmAn-personName,
  #pmAnPersonName {
    font-weight: 700;
    overflow-wrap: anywhere;
  }

  .pmAn-personMeta {
    display: flex;
    flex-wrap: wrap;
    gap: var(--space-1);
    font-size: var(--pmAn-text-sm);
    color: var(--muted);
  }

  .pmAn-badge {
    padding: 2px 10px;
    border: 1px solid var(--pmAn-badge, currentColor);
    border-radius: var(--pmAn-pill);
    color: var(--text);
    font-size: var(--pmAn-text-xs);
    font-weight: 700;
    white-space: nowrap;
  }

  /* With --pmAn-badge unset, var() is invalid and the background stays transparent. */
  @supports (background: color-mix(in srgb, red 1%, white)) {
    .pmAn-badge {
      background: color-mix(in srgb, var(--pmAn-badge) 12%, var(--surface));
    }
  }

  .pmAn-detailHead {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-start;
    justify-content: space-between;
    gap: var(--space-3);
    margin-bottom: var(--space-3);
  }

  .pmAn-detailHead h2 {
    margin: 0;
  }

  .pmAn-group + .pmAn-group,
  .pmAn-noOpen + .pmAn-group {
    margin-top: var(--space-3);
  }

  .pmAn-noOpen {
    margin: var(--space-3) 0 0;
  }

  .pmAn-groupTitle {
    margin: 0;
    font-size: var(--pmAn-text-md);
    font-weight: 700;
  }

  .pmAn-groupBtn {
    display: flex;
    align-items: center;
    gap: var(--space-2);
    width: 100%;
    min-height: var(--pmAn-control-h);
    padding: var(--space-2) var(--space-3);
    border: 1px solid var(--border);
    border-left-width: var(--pmAn-bar);
    border-radius: var(--radius-sm);
    background: var(--surface-alt);
    color: var(--text);
    font: inherit;
    font-weight: 700;
    text-align: left;
    cursor: pointer;
  }

  .pmAn-groupCount {
    margin-left: auto;
  }

  .pmAn-task {
    padding: var(--space-2) var(--space-3);
    border-bottom: 1px solid var(--border);
  }

  .pmAn-task:last-child {
    border-bottom: 0;
  }

  .pmAn-taskLink {
    display: inline-block;
    min-width: 24px;
    min-height: 24px;
    padding: 2px 0;
    color: var(--accent-strong);
    font-weight: 700;
    overflow-wrap: anywhere;
  }

  .pmAn-taskMeta {
    margin: var(--space-1) 0 0;
    font-size: var(--pmAn-text-sm);
    color: var(--muted);
    overflow-wrap: anywhere;
  }

  .pmAn-strip {
    margin-bottom: var(--space-4);
  }

  .pmAn-totals {
    margin: 0;
    font-size: var(--pmAn-text-lg);
    font-weight: 700;
  }

  .pmAn-objHead {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: var(--space-2);
  }

  .pmAn-objHead .pmAn-groupBtn {
    flex: 1 1 240px;
    flex-wrap: wrap;
    width: auto;
    min-width: 0;
  }

  /* The 10em basis makes the health label and % wrap below short widths instead of squeezing the text. */
  .pmAn-objText {
    flex: 1 1 10em;
    min-width: 0;
    overflow-wrap: anywhere;
  }

  .pmAn-kr {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: center;
    gap: var(--space-1) var(--space-3);
    padding: var(--space-2) var(--space-3);
    border-bottom: 1px solid var(--border);
  }

  .pmAn-kr:last-child {
    border-bottom: 0;
  }

  .pmAn-krLinks {
    grid-column: 1 / -1;
  }

  .pmAn-linkBtn {
    display: inline-flex;
    align-items: center;
    gap: var(--space-2);
    min-height: var(--pmAn-control-h);
    margin-left: calc(-1 * var(--space-2));
    padding: 2px var(--space-2);
    border: 0;
    border-radius: var(--radius-sm);
    background: transparent;
    color: var(--text);
    font: inherit;
    font-size: var(--pmAn-text-sm);
    font-weight: 700;
    cursor: pointer;
  }

  .pmAn-linkRow {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto;
    align-items: center;
    gap: var(--space-2);
    padding: var(--space-1) 0;
    font-size: var(--pmAn-text-sm);
  }

  .pmAn-kr .pmAn-taskMeta {
    grid-column: 1 / -1;
    margin: 0;
  }

  .pmAn-krHead {
    margin: 0;
    overflow-wrap: anywhere;
  }

  .pmAn-krBar {
    display: flex;
    align-items: center;
    gap: var(--space-2);
  }

  .pmAn-krBar progress {
    width: var(--pmAn-progress-w);
    height: 12px;
    accent-color: var(--accent);
  }

  .pmAn-filters {
    display: flex;
    flex-wrap: wrap;
    gap: var(--space-2);
    margin-top: var(--space-3);
  }

  /* Matches v20's .pm-dateRangeBtn; the 2px border and check icon carry the state in forced colors. */
  .pmAn-filterBtn[aria-pressed="true"] {

    function ingestOkrs(krRows, objectiveRows) {

            kr.cancelled++;
          });
          return;
        }
        if (!byCode[link] && hits.length > 1) notes.ambiguous++;
        hits.forEach(function (kr) {
          kr.links.push(rec);
        });
      });

      krs.forEach(function (kr) {
        Object.assign(kr, krProgress(kr));
        kr.objective.krs.push(kr);
      });
      objectives.forEach(function (o) {
        o.krs.sort(function (a, b) {
          return keyNumber(a.code) - keyNumber(b.code) || a.code.localeCompare(b.code);
        });
        o.stats = objectiveStats(o);
      });
      state.objectives = objectives.sort(function (a, b) {
        return keyNumber(a.key) - keyNumber(b.key) || a.key.localeCompare(b.key);
      });
      state.okrNotes = notes;
    }

    function formatNumber(n) {
      return n.toLocaleString("en-US");
    }

    function krProgress(kr) {
      if (kr.type === "Metric") {
        var missing = ["start", "current", "target"].filter(function (k) {
          return kr[k] === null;
        });
        if (missing.length) return { pct: 0, message: "Missing " + missing.join(" / ") };
        var pct =
          kr.target === kr.start
            ? kr.current >= kr.target ? 100 : 0
            : clampPct(Math.round(((kr.current - kr.start) / (kr.target - kr.start)) * 100));
        return {
          pct: pct,
          detail: formatNumber(kr.start) + " \u2192 " + formatNumber(kr.current) + " of " + formatNumber(kr.target),
        };
      }
      if (kr.type === "Binary") {
        return { pct: kr.complete ? 100 : 0, detail: kr.complete ? "Complete" : "Not complete" };
      }
      if (kr.type === "Milestone") {
        if (!kr.links.length) return { pct: 0, message: "No linked work" };
        var done = kr.links.filter(function (rec) {
          return linkedBucket(rec) === "complete";
        }).length;
        return {
          pct: Math.round((done / kr.links.length) * 100),
          detail: done + " of " + kr.links.length + " linked tasks and projects done",
        };
      }
      return { pct: 0, message: "No type" };
    }

    function objectiveStats(o) {
      if (!o.krs.length) return { progress: null, health: "" };
      var weights = 0;
      var sum = 0;
      o.krs.forEach(function (kr) {
        weights += kr.weight;
        sum += kr.pct * kr.weight;
      });
      var progress = Math.round(sum / weights);
      if (!o.start || !o.end) return { progress: progress, health: "" };
      var span = o.end - o.start;
      var timePct = span <= 0 ? 100 : clampPct(((state.today - o.start) / span) * 100);
      var gap = timePct - progress;
      var health = gap > OKR_GAP.offTrack ? "Off track" : gap > OKR_GAP.atRisk ? "At risk" : "On track";
      return { progress: progress, health: health };
    }

    function load() {
      var seq = ++state.seq;
      setView("loading");
      if (!window.Chart || parseInt(Chart.version, 10) < MIN_CHART_MAJOR) {
        setView("error", "Couldn't load analytics data (Chart.js " + MIN_CHART_MAJOR + "+ not found).");
        return;
      }
      Chart.defaults.font.family = getComputedStyle(root).fontFamily;
      Chart.defaults.color = getComputedStyle(root).getPropertyValue("--text").trim();
      Promise.all([
        fetchAll(FORM.project, values(IND.project)),
        fetchAll(FORM.task, values(IND.task)),
        fetchAll(FORM.keyResult, values(IND.keyResult)),
        fetchAll(FORM.objective, values(IND.objective)),
        fetchAll(null, values(IND.roadmap), ROADMAP_SCOPE),
        // Re-read only when nothing loaded yet or the panel is open; a failed read never fails the report.
        !state.defaultsLoaded || !els.defaults.hidden ? fetchTeamDefault().catch(function () { return false; }) : null,
      ])
        .then(function (res) {
          if (seq !== state.seq) return;
          ingest(res[0], res[1], res[2], res[3], res[4]);
          populateFyOptions();
          if (res[5] !== null) {
            state.defaultsError = res[5] === false;
            if (res[5]) {
              state.defaultsLoaded = true;
              state.teamDefault = res[5].saved ? res[5] : null;
              if (!state.filtersTouched && state.teamDefault) applyFilters(state.teamDefault);
            }
          }
          renderDefaults();
          setView("ready");
          render();
        })
        .catch(function (err) {
          if (seq !== state.seq) return;
          console.error("pmAn: load failed", err);
          var detail = err.status
            ? "HTTP " + err.status
            : err instanceof SyntaxError
              ? "unexpected response"
              : "network error";
          setView("error", "Couldn't load analytics data (" + detail + ").");
        });
    }

    /* ---- view ---- */

    function setView(view, message) {
      els.loading.textContent = view === "loading" ? "Loading project data\u2026" : "";
      els.error.hidden = view !== "error";
      els.errorMsg.textContent = view === "error" ? message : "";
      els.content.hidden = view !== "ready";
    }

    function populateFyOptions() {
      var current = els.fy.value;
      var seen = {};
      state.projects.concat(state.objectives, state.roadmap).forEach(function (x) {
        if (x.fy) seen[x.fy] = true;
      });
      var fys = Object.keys(seen).sort(function (a, b) {
        return b.localeCompare(a, undefined, { numeric: true });
      });
      els.fy.length = 1;
      fys.forEach(function (fy) {
        els.fy.add(new Option(fy, fy));
      });
      els.fy.value = seen[current] ? current : "";
    }

    function render() {
      var fy = els.fy.value;
      var inScope = function (x) {
        return !fy || x.fy === fy;
      };
      var c = { projects: 0, tasks: 0, cancelled: 0, missingDate: 0, orphans: 0 };
      // Tile counts are these arrays' lengths, so a tile and its list can't disagree.
      var groups = { openProjects: [], openTasks: [], overdue: [], atrisk: [], blocked: [], complete: [] };
      var byBucket = {};
      TASK_BUCKETS.forEach(function (b) {
        byBucket[b.id] = 0;
      });
      var byProjectStatus = {};
      var byAssignee = {};
      var live = [];
      var now = state.loadedAt;
      var monthStart = new Date(now.getFullYear(), now.getMonth() - (MONTHS_SHOWN - 1), 1);
      var byMonth = [];
      for (var i = 0; i < MONTHS_SHOWN; i++) byMonth.push(0);

      state.projects.filter(inScope).forEach(function (p) {
        if (isCancelled(p.status)) {
          c.cancelled++;
          return;
        }
        c.projects++;
        if (isOpenProject(p)) groups.openProjects.push(p);
        var known = PROJECT_STATUSES.filter(function (s) {
          return norm(s.label) === norm(p.status);
        })[0];
        var label = (known || UNRECOGNIZED_STATUS).label;
        byProjectStatus[label] = (byProjectStatus[label] || 0) + 1;
      });

      state.tasks.filter(inScope).forEach(function (t) {
        if (t.bucket === "cancelled") {
          c.cancelled++;
          return;
        }
        if (t.bucket === "complete" && !t.completedOn) c.missingDate++;
        if (!inWindow(t)) return;
        c.tasks++;
        live.push(t);
        byBucket[t.bucket]++;
        if (groups[t.bucket]) groups[t.bucket].push(t);
        if (!t.hasProject) c.orphans++;
        if (OPEN_BUCKETS.indexOf(t.bucket) !== -1) {
          groups.openTasks.push(t);
          var a = byAssignee[t.assignee] || (byAssignee[t.assignee] = { onTime: 0, overdue: 0 });
          if (t.bucket === "overdue") a.overdue++;
          else a.onTime++;
        }
        if (t.bucket === "complete" && t.completedOn) {
          var idx =
            (t.completedOn.getFullYear() - monthStart.getFullYear()) * 12 +
            t.completedOn.getMonth() - monthStart.getMonth();
          if (idx >= 0 && idx < MONTHS_SHOWN) byMonth[idx]++;
        }
      });

      els.scope.textContent =
        (fy || "All fiscal years") + " \u00b7 Updated " + TIME_FMT.format(state.loadedAt);
      state.footnote = {
        base: plural(c.projects, "project") + ", " + plural(c.tasks, "task"),
        task: [
          c.cancelled + " cancelled excluded",
          plural(c.missingDate, "completed task") + " missing a completion date",
          plural(c.orphans, "task") + " with no matching project",
        ],
      };
      renderMeeting(live);
      renderOkrs(fy);
      renderRoadmap(fy);
      renderFootnote();

      var isEmpty = c.projects + c.tasks === 0;
      els.empty.hidden = !isEmpty;
      els.empty.textContent = fy ? "No records for this fiscal year." : "No records found.";
      els.kpis.hidden = isEmpty;
      els.charts.hidden = isEmpty;
      state.healthGroups = groups;
      if (isEmpty) {
        state.drill = null;
        renderDrill(false);
        return;
      }

      var counts = {};
      Object.keys(groups).forEach(function (key) {
        counts[key] = groups[key].length;
      });
      renderKpis(counts);
      renderDrill(false);

      updateChart("taskStatus", pluck(TASK_BUCKETS, "label"), [
        {
          label: "Tasks",
          data: TASK_BUCKETS.map(function (b) {
            return byBucket[b.id];
          }),
          backgroundColor: TASK_BUCKETS.map(function (b) {
            return cssColor(b.color);
          }),
        },
      ]);

      var projectStatuses = PROJECT_STATUSES.concat(
        byProjectStatus[UNRECOGNIZED_STATUS.label] ? [UNRECOGNIZED_STATUS] : [],
      );
      updateChart("projectStatus", pluck(projectStatuses, "label"), [
        {
          label: "Projects",
          data: projectStatuses.map(function (s) {
            return byProjectStatus[s.label] || 0;
          }),
          backgroundColor: projectStatuses.map(function (s) {
            return cssColor(s.color);
          }),
        },
      ]);

      var assignees = Object.keys(byAssignee).sort(function (x, y) {
        var dx = byAssignee[x].onTime + byAssignee[x].overdue;
        var dy = byAssignee[y].onTime + byAssignee[y].overdue;
        return dy - dx || x.localeCompare(y);
      });
      var top = assignees.slice(0, TOP_ASSIGNEES);
      els.assigneeCap.hidden = assignees.length <= TOP_ASSIGNEES;
      els.assigneeCap.textContent =
        "Showing top " + TOP_ASSIGNEES + " of " + assignees.length;
      updateChart("assignee", top, [
        {
          label: "On time",
          data: top.map(function (n) {
            return byAssignee[n].onTime;
          }),
          backgroundColor: cssColor("inflight"),
        },
        {
          label: "Overdue",
          data: top.map(function (n) {
            return byAssignee[n].overdue;
          }),
          backgroundColor: cssColor("overdue"),
        },
      ]);

      updateChart(
        "completed",
        byMonth.map(function (_, i) {
          return MONTH_FMT.format(new Date(monthStart.getFullYear(), monthStart.getMonth() + i, 1));
        }),
        [{ label: "Completed tasks", data: byMonth, backgroundColor: cssColor("complete") }],
      );
    }

    function pluck(list, key) {
      return list.map(function (item) {
        return item[key];
      });
    }

    function renderKpis(counts) {
      Array.prototype.forEach.call(els.kpis.children, function (li) {
        li.querySelector(".pmAn-kpiValue").textContent = counts[li.getAttribute("data-kpi")];
      });
    }

    function renderDrill(announce) {
      var kpi = state.drill;
      Array.prototype.forEach.call(els.kpis.children, function (li) {
        li.firstElementChild.setAttribute("aria-pressed", String(li.getAttribute("data-kpi") === kpi));
      });
      els.drill.hidden = !kpi;
      if (!kpi) return;

      var isProject = kpi === "openProjects";
      var rows = isProject
        ? state.healthGroups[kpi].slice().sort(function (a, b) {
            return (a.name || a.key).localeCompare(b.name || b.key);
          })
        : sortTasks(state.healthGroups[kpi], "due");
      var label = els.kpis.querySelector('[data-kpi="' + kpi + '"] .pmAn-kpiLabel').textContent;
      els.drillTitle.textContent = label.charAt(0) + label.slice(1).toLowerCase() + " (" + rows.length + ")";
      els.drillEmpty.hidden = rows.length > 0;
      var shown = state.drillAll ? rows : rows.slice(0, DRILL_LIMIT);
      els.drillList.textContent = "";
      shown.forEach(function (row) {
        els.drillList.appendChild(buildDrillRow(row, isProject));
      });
      els.drillMore.hidden = shown.length === rows.length;
      els.drillMore.textContent = "Show all " + rows.length;
      if (announce) {
        var phrase = label.toLowerCase();
        els.status.textContent =
          "Showing " + rows.length + " " + (rows.length === 1 ? phrase.replace(/s$/, "") : phrase) + ".";
      }
    }

    function buildDrillRow(row, isProject) {
      var li = el("li", "pmAn-task");
      var title = isProject ? row.name || row.key || "Untitled project" : row.title || "Untitled task";
      li.appendChild(newTabLink(title, row.recordID));
      var parts = isProject
        ? [row.owner || "No owner", row.status || "No status", row.end ? "Ends " + DATE_FMT.format(row.end) : "No end date"]
        : [
            row.projectName || row.projectKey || "No project",
            row.assignee,
            row.due ? "Due " + DATE_FMT.format(row.due) : "No due date",
          ];
      li.appendChild(el("p", "pmAn-taskMeta", parts.join(" \u00b7 ")));
      return li;
    }

    function chartOptions(cfg) {
      var valueAxis = { beginAtZero: true, stacked: !!cfg.stacked, ticks: { precision: 0 } };
      var categoryAxis = { stacked: !!cfg.stacked, grid: { display: false } };
      return {
        indexAxis: cfg.horizontal ? "y" : "x",
        animation: false,
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: !!cfg.stacked } },
        scales: cfg.horizontal
          ? { x: valueAxis, y: categoryAxis }
          : { x: categoryAxis, y: valueAxis },
      };
    }

    function updateChart(name, labels, datasets) {
      var cfg = CHARTS[name];
      var chart = charts[name];
      if (!chart) {
        chart = charts[name] = new Chart(byId(cfg.id + "Chart"), {
          type: "bar",
          data: { labels: [], datasets: [] },
          options: chartOptions(cfg),
        });
      }
      chart.data.labels = labels;
      chart.data.datasets = datasets;
      chart.update();

      var title = byId(cfg.id + "Title").textContent;
      byId(cfg.id + "Summary").textContent = summarize(title, labels, datasets);
      fillTable(byId(cfg.id + "Table"), title, cfg.rowHeader, labels, datasets);
    }

    // One-sentence takeaway used as the canvas's accessible name.
    function summarize(title, labels, datasets) {
      var parts = labels.map(function (label, i) {
        if (datasets.length === 1) return label + " " + datasets[0].data[i];
        return (
          label +
          ": " +
          datasets
            .map(function (ds) {
              return ds.data[i] + " " + ds.label.toLowerCase();
            })
            .join(", ")
        );
      });
      return title + ": " + (parts.length ? parts.join(datasets.length === 1 ? ", " : "; ") : "none") + ".";
    }

    function fillTable(table, caption, rowHeader, labels, datasets) {
      table.textContent = "";
      table.createCaption().textContent = caption;
      var head = table.createTHead().insertRow();
      [rowHeader].concat(pluck(datasets, "label")).forEach(function (text) {
        var th = document.createElement("th");
        th.scope = "col";
        th.textContent = text;
        head.appendChild(th);
      });
      var body = table.createTBody();
      labels.forEach(function (label, i) {
        var tr = body.insertRow();
        var th = document.createElement("th");
        th.scope = "row";
        th.textContent = label;
        tr.appendChild(th);
        datasets.forEach(function (ds) {
          tr.insertCell().textContent = ds.data[i];
        });
      });
    }

    /* ---- team meeting ---- */

    function el(tag, className, text) {
      var node = document.createElement(tag);
      if (className) node.className = className;
      if (text != null) node.textContent = text;
      return node;
    }

    // Unlike Health's OPEN_BUCKETS, the meeting view counts Blocked / On Hold as open.
    function openCount(counts) {
      return MEETING_GROUPS.reduce(function (sum, id) {
        return id === "complete" ? sum : sum + counts[id];
      }, 0);
    }

    function bucketPhrase(id, n) {
      return n + " " + BUCKET[id].label.toLowerCase();
    }

    function renderMeeting(tasks) {
      var byName = {};
      tasks.forEach(function (t) {
        var person = byName[t.assignee];
        if (!person) {
          person = byName[t.assignee] = { name: t.assignee, tasks: [], counts: {} };
          TASK_BUCKETS.forEach(function (b) {
            person.counts[b.id] = 0;
          });
        }
        person.tasks.push(t);
        person.counts[t.bucket]++;
      });
      state.people = values(byName).sort(function (a, b) {
        return (
          (a.name === UNASSIGNED) - (b.name === UNASSIGNED) ||
          b.counts.overdue - a.counts.overdue ||
          b.counts.atrisk - a.counts.atrisk ||
          a.name.localeCompare(b.name)
        );
      });

      els.meetEmpty.hidden = state.people.length > 0;
      els.meet.hidden = state.people.length === 0;
      els.people.textContent = "";
      state.people.forEach(function (person) {
        var btn = el("button", "pmAn-person");
        btn.type = "button";
        btn.setAttribute("data-person", person.name);
        btn.appendChild(el("span", "pmAn-personName", person.name));
        btn.appendChild(document.createTextNode(" "));
        var meta = el("span", "pmAn-personMeta", openCount(person.counts) + " open");
        ["overdue", "atrisk"].forEach(function (id) {
          if (!person.counts[id]) return;
          var badge = el("span", "pmAn-badge", bucketPhrase(id, person.counts[id]));
          badge.style.setProperty("--pmAn-badge", STATUS_COLORS[BUCKET[id].color]);
          meta.appendChild(document.createTextNode(" "));
          meta.appendChild(badge);
        });
        btn.appendChild(meta);
        var li = el("li");
        li.appendChild(btn);
        els.people.appendChild(li);
      });

      var kept = state.people.filter(function (p) {
        return p.name === state.person;
      })[0];
      selectPerson(kept || state.people[0]);
    }

    function selectPerson(person) {
      var changed = !!person && person.name !== state.person;
      state.person = person ? person.name : null;
      Array.prototype.forEach.call(els.people.querySelectorAll("button"), function (btn) {
        if (btn.getAttribute("data-person") === state.person) btn.setAttribute("aria-current", "true");
        else btn.removeAttribute("aria-current");
      });
      if (!person) return;
      renderDetail(person);
      if (changed) {
        els.meetStatus.textContent =
          "Showing " + plural(person.tasks.length, "task") + " for " + person.name + ".";
      }
    }

    function renderDetail(person) {
      els.personName.textContent = person.name;
      els.personSummary.textContent = MEETING_GROUPS.filter(function (id) {
        return person.counts[id];
      })
        .map(function (id) {
          return bucketPhrase(id, person.counts[id]);
        })
        .join(" \u00b7 ");

      els.groups.textContent = "";
      MEETING_GROUPS.forEach(function (id) {
        var tasks = person.tasks.filter(function (t) {
          return t.bucket === id;
        });
        if (tasks.length) els.groups.appendChild(buildGroup(id, tasks));
      });
      if (!openCount(person.counts)) {
        els.groups.insertBefore(
          el("p", "pm-muted pmAn-noOpen", "No open tasks."),
          els.groups.querySelector('[data-group="complete"]'),
        );
      }
      updateToggleAll(els.groups, els.toggleAll);
    }

    function buildGroup(id, tasks) {
      var group = el("div", "pmAn-group");
      group.setAttribute("data-group", id);
      var btn = el("button", "pmAn-groupBtn");
      btn.type = "button";
      btn.setAttribute("aria-controls", "pmAnGroup-" + id);
      btn.style.borderLeftColor = STATUS_COLORS[BUCKET[id].color];
      btn.prepend(icon("collapsed"), icon("expanded"));
      btn.appendChild(el("span", null, BUCKET[id].label));
      btn.appendChild(document.createTextNode(" "));
      btn.appendChild(el("span", "pmAn-groupCount", String(tasks.length)));
      var heading = el("h3", "pmAn-groupTitle");
      heading.appendChild(btn);
      var list = el("ul", "pmAn-list");
      list.id = "pmAnGroup-" + id;
      sortTasks(tasks, id).forEach(function (t) {
        list.appendChild(buildTask(t));
      });
      group.appendChild(heading);
      group.appendChild(list);
      setGroupOpen(group, !!state.expanded[id], state.expanded);
      return group;
    }

    // Shared by Team Meeting groups, OKR objectives and Key Result links: toggle first, disclosed body last.
    function setGroupOpen(group, open, store) {
      store[group.getAttribute("data-group")] = open;
      group.querySelector("button").setAttribute("aria-expanded", String(open));
      group.lastElementChild.hidden = !open;
    }

    function updateToggleAll(container, button) {
      var allOpen = Array.prototype.every.call(container.querySelectorAll(".pmAn-groupBtn"), function (btn) {
        return btn.getAttribute("aria-expanded") === "true";
      });
      button.textContent = allOpen ? "Collapse all" : "Expand all";
    }

    function bindDisclosures(container, toggleAll, store) {
      container.addEventListener("click", function (e) {
        var btn = e.target.closest(".pmAn-groupBtn");
        if (!btn) return;
        setGroupOpen(btn.closest(".pmAn-group"), btn.getAttribute("aria-expanded") !== "true", store);
        updateToggleAll(container, toggleAll);
      });
      toggleAll.addEventListener("click", function () {
        var open = toggleAll.textContent === "Expand all";
        Array.prototype.forEach.call(container.querySelectorAll(".pmAn-group"), function (group) {
          setGroupOpen(group, open, store);
        });
        updateToggleAll(container, toggleAll);
      });
    }

    // Completed sorts by completion date, newest first; everything else by due date. Undated last.
    function sortTasks(tasks, id) {
      var key = id === "complete" ? "completedOn" : "due";
      var dir = id === "complete" ? -1 : 1;
      return tasks.slice().sort(function (a, b) {
        var x = a[key];
        var y = b[key];
        var byDate = x && y ? dir * (x - y) : !x - !y;
        return byDate || a.title.localeCompare(b.title);
      });
    }

    function buildTask(t) {
      var li = el("li", "pmAn-task");
      li.appendChild(newTabLink(t.title || "Untitled task", t.recordID));
      var project = t.projectKey
        ? t.projectKey + (t.projectName ? " \u00b7 " + t.projectName : "")
        : "No project";
      li.appendChild(el("p", "pmAn-taskMeta", project));
      li.appendChild(el("p", "pmAn-taskMeta", dateText(t)));
      return li;
    }

    function dateText(t) {
      if (t.bucket === "complete") {
        return t.completedOn ? "Completed " + DATE_FMT.format(t.completedOn) : "Completed (no date)";
      }
      if (!t.due) return "No due date";
      var text = "Due " + DATE_FMT.format(t.due);
      if (t.due < state.today) {
        text += " \u00b7 " + plural(Math.round((state.today - t.due) / MS_PER_DAY), "day") + " overdue";
      }
      return text;
    }

    /* ---- OKRs ---- */

    function newTabLink(text, recordID) {
      var link = el("a", "pmAn-taskLink", text);
      link.href = PRINTVIEW_URL + encodeURIComponent(recordID);
      link.target = "_blank";
      link.rel = "noopener";
      link.appendChild(el("span", "pm-srOnly", " (opens in a new tab)"));
      return link;
    }

    function healthColor(label) {
      var match = OKR_HEALTH.filter(function (h) {
        return h.label === label;
      })[0];
      return STATUS_COLORS[match ? match.color : "neutral"];
    }

    function nonZeroNotes(notes) {
      return notes
        .filter(function (note) {
          return note[0];
        })
        .map(function (note) {
          return note[1];
        });
    }

    function okrFootnotes() {
      var n = state.okrNotes;
      return nonZeroNotes([
        [n.excludedKrs, plural(n.excludedKrs, "Key Result") + " excluded (no objective or code)"],
        [n.unmatched, plural(n.unmatched, "linked record") + (n.unmatched === 1 ? " matches" : " match") + " no Key Result"],
        [n.ambiguous, plural(n.ambiguous, "link") + (n.ambiguous === 1 ? " matches" : " match") + " more than one Key Result name"],
        [n.noFy, plural(n.noFy, "objective") + " with no fiscal year"],
      ]);
    }

    function roadmapFootnotes() {
      var n = state.roadmapNotes;
      return nonZeroNotes([
        [n.noFy, plural(n.noFy, "item") + " with no fiscal year"],
        [n.noTheme, plural(n.noTheme, "item") + " with no theme"],
      ]);
    }

    // Only the active tab's notes; skipping identical text keeps the live region from re-announcing.
    function renderFootnote() {
      var notesByTab = { pmAnTabOkr: okrFootnotes, pmAnTabRoadmap: roadmapFootnotes };
      var active = els.tabs.filter(function (t) {
        return t.getAttribute("aria-selected") === "true";
      })[0];
      var text = [state.footnote.base]
        .concat(notesByTab[active.id] ? notesByTab[active.id]() : state.footnote.task)
        .concat(state.defaultsError ? ["Team defaults could not be loaded."] : [])
        .join(" \u00b7 ");
      if (els.footnote.textContent !== text) els.footnote.textContent = text;
    }

    function renderOkrs(fy) {
      var objectives = state.objectives.filter(function (o) {
        return !fy || o.fy === fy;
      });
      els.okrEmpty.hidden = objectives.length > 0;
      els.okr.hidden = objectives.length === 0;

      var scored = objectives.filter(function (o) {
        return o.stats.progress !== null;
      });
      var overall = scored.length
        ? Math.round(
            scored.reduce(function (sum, o) {
              return sum + o.stats.progress;
            }, 0) / scored.length,
          )
        : null;
      els.okrTotals.textContent =
        plural(objectives.length, "objective") +
        " \u00b7 " +
        (overall === null ? "Overall: no Key Results" : "Overall " + overall + "%");
      var byHealth = {};
      objectives.forEach(function (o) {
        var label = o.stats.health || "no label";
        byHealth[label] = (byHealth[label] || 0) + 1;
      });
      els.okrHealth.textContent = pluck(OKR_HEALTH, "label")
        .concat("no label")
        .filter(function (label) {
          return byHealth[label];
        })
        .map(function (label) {
          return byHealth[label] + " " + label.toLowerCase();
        })
        .join(" \u00b7 ");

      els.okrList.textContent = "";
      objectives.forEach(function (o) {
        els.okrList.appendChild(buildObjective(o));
      });
      updateToggleAll(els.okrList, els.okrToggleAll);
    }

    function buildObjective(o) {
      var group = el("div", "pmAn-group");
      group.setAttribute("data-group", o.recordID);
      var btn = el("button", "pmAn-groupBtn");
      btn.type = "button";
      btn.setAttribute("aria-controls", "pmAnObj-" + o.recordID);
      btn.style.borderLeftColor = healthColor(o.stats.health);
      btn.prepend(icon("collapsed"), icon("expanded"));
      btn.appendChild(el("span", "pmAn-objText", o.text || "Untitled objective"));
      if (o.stats.health) {
        var badge = el("span", "pmAn-badge", o.stats.health);
        badge.style.setProperty("--pmAn-badge", healthColor(o.stats.health));
        btn.appendChild(document.createTextNode(" "));
        btn.appendChild(badge);
      }
      btn.appendChild(document.createTextNode(" "));
      btn.appendChild(
        el("span", "pmAn-groupCount", o.stats.progress === null ? "No Key Results" : o.stats.progress + "%"),
      );
      var heading = el("h3", "pmAn-groupTitle pmAn-objHead");
      heading.appendChild(btn);
      heading.appendChild(newTabLink(o.key || "Objective", o.recordID));

      var body;
      if (o.krs.length) {
        body = el("ul", "pmAn-list");
        o.krs.forEach(function (kr) {
          body.appendChild(buildKr(kr));
        });
      } else {
        body = el("p", "pm-muted pmAn-noOpen", "No Key Results");
      }
      body.id = "pmAnObj-" + o.recordID;
      group.appendChild(heading);
      group.appendChild(body);
      setGroupOpen(group, !!state.okrExpanded[o.recordID], state.okrExpanded);
      return group;
    }

    function buildKr(kr) {
      var li = el("li", "pmAn-kr");
      var head = el("p", "pmAn-krHead");
      head.appendChild(el("strong", null, kr.code));
      head.appendChild(document.createTextNode(" " + (kr.name || "Untitled Key Result")));
      if (kr.type) {
        head.appendChild(document.createTextNode(" "));
        head.appendChild(el("span", "pmAn-badge", kr.type));
      }
      var bar = el("div", "pmAn-krBar");
      var progress = el("progress");
      progress.max = 100;
      progress.value = kr.pct;
      progress.setAttribute("aria-label", (kr.name || kr.code) + " progress");
      bar.appendChild(progress);
      bar.appendChild(el("span", null, kr.pct + "%"));
      li.appendChild(head);
      li.appendChild(bar);
      [kr.detail, kr.owner && "Owner: " + kr.owner, kr.message].forEach(function (text) {
        if (text) li.appendChild(el("p", "pmAn-taskMeta", text));
      });
      if (kr.links.length) li.appendChild(buildKrLinks(kr));
      return li;
    }

    // Projects have no due-date bucket, so their status maps onto the task bucket labels.
    function linkedBucket(rec) {
      if (rec.bucket) return rec.bucket;
      var s = norm(rec.status);
      if (s === "completed") return "complete";
      if (s === "on hold") return "blocked";
      return s === "" || s === "not started" ? "notstarted" : "inprogress";
    }

    function buildKrLinks(kr) {
      var wrap = el("div", "pmAn-krLinks");
      wrap.setAttribute("data-group", kr.recordID);
      var btn = el("button", "pmAn-linkBtn", "Linked work (" + kr.links.length + ")");
      btn.prepend(icon("collapsed"), icon("expanded"));
      btn.appendChild(el("span", "pm-srOnly", " for " + kr.code));
      btn.type = "button";
      btn.setAttribute("aria-controls", "pmAnKrLinks-" + kr.recordID);
      var body = el("div");
      body.id = "pmAnKrLinks-" + kr.recordID;
      var list = el("ul", "pmAn-list");
      kr.links
        .map(function (rec) {
          return { rec: rec, bucket: linkedBucket(rec), title: rec.bucket ? rec.title : rec.name || rec.key };
        })
        .sort(function (a, b) {
          return LINKED_ORDER.indexOf(a.bucket) - LINKED_ORDER.indexOf(b.bucket) || a.title.localeCompare(b.title);
        })
        .forEach(function (item) {
          var row = el("li", "pmAn-linkRow");
          row.appendChild(el("span", "pmAn-badge", item.rec.bucket ? "Task" : "Project"));
          row.appendChild(newTabLink(item.title || "Untitled", item.rec.recordID));
          var status = el("span", "pmAn-badge", BUCKET[item.bucket].label);
          status.style.setProperty("--pmAn-badge", STATUS_COLORS[BUCKET[item.bucket].color]);
          row.appendChild(status);
          list.appendChild(row);
        });
      body.appendChild(list);
      if (kr.cancelled) body.appendChild(el("p", "pmAn-taskMeta", kr.cancelled + " cancelled, not counted"));
      wrap.appendChild(btn);
      wrap.appendChild(body);
      setGroupOpen(wrap, !!state.krExpanded[kr.recordID], state.krExpanded);
      return wrap;
    }

    /* ---- Roadmap ---- */

    function renderRoadmap(fy) {
      var items = state.roadmap.filter(function (item) {
        return !fy || item.fy === fy;
      });
      var counts = {};
      items.forEach(function (item) {
        counts[item.status] = (counts[item.status] || 0) + 1;
      });
      var statuses = Object.keys(counts).sort(roadmapStatusOrder);
      state.roadmapStatus =
        statuses.filter(function (s) {
          return norm(s) === norm(state.roadmapStatus);
        })[0] || "";
      state.roadmapScope = items;

      els.roadEmpty.hidden = items.length > 0;
      els.road.hidden = items.length === 0;
      els.roadTotals.textContent = [items.length + (items.length === 1 ? " capability" : " capabilities")]
        .concat(
          statuses.map(function (s) {
            return counts[s] + " " + s.toLowerCase();
          }),
        )
        .join(" \u00b7 ");
      els.roadFilter.textContent = "";
      [""].concat(statuses).forEach(function (s) {
        var btn = el("button", "pm-ghostBtn pmAn-filterBtn", (s || "All") + " " + (s ? counts[s] : items.length));
        btn.prepend(icon("check"));
        btn.type = "button";
        btn.setAttribute("data-status", s);
        els.roadFilter.appendChild(btn);
      });
      renderRoadmapItems();
    }

    function renderRoadmapItems() {
      var status = state.roadmapStatus;
      Array.prototype.forEach.call(els.roadFilter.children, function (btn) {
        btn.setAttribute("aria-pressed", String(btn.getAttribute("data-status") === status));
      });
      var items = state.roadmapScope.filter(function (item) {
        return !status || item.status === status;
      });
      var years = [];
      items.forEach(function (item) {
        if (years.indexOf(item.fy) === -1) years.push(item.fy);
      });
      years.sort(function (a, b) {
        return !a - !b || a.localeCompare(b, undefined, { numeric: true });
      });

      els.roadSections.textContent = "";
      years.forEach(function (fy) {
        var inYear = items.filter(function (item) {
          return item.fy === fy;
        });
        var section = el("section", "pmAn-card pmAn-roadYear");
        var heading = el("h2", null, (fy || "No fiscal year") + " \u00b7 " + plural(inYear.length, "item"));
        heading.id = "pmAnRoadYear-" + (fy || "none");
        section.setAttribute("aria-labelledby", heading.id);
        section.appendChild(heading);
        state.roadmapThemes.forEach(function (theme) {
          var cards = inYear.filter(function (item) {
            return item.theme === theme;
          });
          if (!cards.length) return;
          var group = el("div", "pmAn-roadTheme");
          group.appendChild(el("h3", "pmAn-groupTitle", theme));
          var list = el("ul", "pmAn-list pmAn-roadGrid");
          cards.forEach(function (item) {
            list.appendChild(buildRoadCard(item));
          });
          group.appendChild(list);
          section.appendChild(group);
        });
        els.roadSections.appendChild(section);
      });
      return items.length;
    }

    function buildRoadCard(item) {
      var li = el("li", "pmAn-roadCard");
      li.style.borderLeftColor = roadmapColor(item.status);
      li.appendChild(newTabLink(item.capability, item.recordID));
      if (item.description) li.appendChild(el("p", "pmAn-taskMeta", item.description));
      var tag = el("span", "pmAn-badge", item.status);
      tag.style.setProperty("--pmAn-badge", roadmapColor(item.status));
      var status = el("p");
      status.appendChild(tag);
      li.appendChild(status);
      return li;
    }

    function activateTab(tab) {
      els.tabs.forEach(function (t) {
        var on = t === tab;
        t.setAttribute("aria-selected", String(on));
        t.tabIndex = on ? 0 : -1;
        byId(t.getAttribute("aria-controls")).hidden = !on;
      });
      els.windowWrap.hidden = tab.id === "pmAnTabOkr" || tab.id === "pmAnTabRoadmap";
      renderFootnote();
      // Charts sized while their panel was hidden collapse to zero.
      if (tab.id === "pmAnTabHealth") {
        values(charts).forEach(function (chart) {
          chart.resize();
        });
      }
    }

    /* ---- Completed within + team defaults ---- */

    function windowDays() {
      var w = COMPLETED_WINDOWS.filter(function (x) {
        return x.label === els.window.value;
      })[0];
      return w ? w.days : null;
    }

    // Only completed tasks are limited; undated ones drop out once a window is set.
    function inWindow(t) {
      var days = windowDays();
      if (t.bucket !== "complete" || days === null) return true;
      return !!t.completedOn && t.completedOn >= addDays(state.today, -days);
    }

    function windowPhrase() {
      var days = windowDays();
      return days === null ? "all time" : "the last " + days + " days";
    }

    function fetchTeamDefault() {
      var inds = values(IND.settings);
      var form = { id: "categoryID", operator: "=", match: FORM.settings, gate: "AND" };
      var record = { id: "recordID", operator: "=", match: String(SETTINGS_RECORD_ID), gate: "AND" };
      return fetchAll(FORM.settings, inds, [form, record])
        .catch(function () {
          return fetchAll(FORM.settings, inds, form);
        })
        .then(function (rows) {
          var row = rows.filter(function (x) {
            return String(x.recordID) === String(SETTINGS_RECORD_ID);
          })[0];
          var fy = row ? clean(field(row, IND.settings.fy)) : "";
          var win = row ? clean(field(row, IND.settings.window)) : "";
          var known = COMPLETED_WINDOWS.filter(function (x) {
            return norm(x.label) === norm(win);
          })[0];
          return {
            saved: !!(fy || win),
            fy: norm(fy) === "all" ? "" : normalizeFy(fy),
            window: (known || COMPLETED_WINDOWS[0]).label,
          };
        });
    }

    function applyFilters(d) {
      els.fy.value = d.fy;
      if (els.fy.value !== d.fy) els.fy.value = "";
      els.window.value = d.window;
    }

    function csrfToken() {
      var raw = (root.getAttribute("data-csrf") || "").replace(/<!--|-->/g, "").trim();
      // An unrendered template tag means the page was not served through LEAF.
      return raw.indexOf("{") === -1 ? raw : "";
    }

    function renderDefaults(message) {
      var d = state.teamDefault;
      els.defaultsSaved.textContent = state.defaultsError
        ? "Team defaults could not be loaded."
        : d
          ? "Team default: " + (d.fy || "All") + " \u00b7 " + d.window
          : "No team default saved.";
      els.resetDefault.disabled = !d;
      els.saveDefault.disabled = !csrfToken();
      els.defaultsMsg.textContent = csrfToken() ? message || "" : "Saving is not available here.";
    }

    function saveDefault() {
      var sent = { fy: els.fy.value, window: els.window.value };
      var body = new URLSearchParams();
      body.append("CSRFToken", csrfToken());
      body.append(String(IND.settings.fy), sent.fy || "All");
      body.append(String(IND.settings.window), sent.window);
      els.saveDefault.disabled = true;
      els.resetDefault.disabled = true;
      els.status.textContent = "Saving\u2026";
      els.defaultsMsg.textContent = "Saving\u2026";
      fetch("api/form/" + SETTINGS_RECORD_ID, {
        method: "POST",
        credentials: "same-origin",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: body.toString(),
      })
        .then(function (res) {
          if (res.status === 401 || res.status === 403) throw new Error("forbidden");
          if (!res.ok) throw new Error("HTTP " + res.status);
          return res.text();
        })
        .then(function (text) {
          // LEAF answers a successful write with 1.
          if (text.replace(/"/g, "").trim() !== "1") throw new Error("Unexpected response");
          state.teamDefault = { saved: true, fy: sent.fy, window: sent.window };
          state.defaultsLoaded = true;
          state.defaultsError = false;
          return "Team default saved.";
        })
        .catch(function (err) {
          return err.message === "forbidden"
            ? "You do not have permission to save the team default."
            : "Could not save team default.";
        })
        .then(function (message) {
          renderDefaults(message);
          renderFootnote();
          els.status.textContent = message;
        });
    }

    /* ---- init ---- */

    Array.prototype.forEach.call(els.kpis.children, function (li) {
      li.style.borderLeftColor = STATUS_COLORS[li.getAttribute("data-color")];
      li.querySelector(".pmAn-kpiLabel").prepend(icon("check"));
    });
    els.defaultsBtn.prepend(icon("collapsed"), icon("expanded"));
    els.tabs.forEach(function (tab, i) {
      tab.addEventListener("click", function () {
        activateTab(tab);
      });
      tab.addEventListener("keydown", function (e) {
        var last = els.tabs.length - 1;
        var next = { ArrowLeft: i - 1, ArrowRight: i + 1, Home: 0, End: last }[e.key];
        if (next === undefined) return;
        e.preventDefault();
        var target = els.tabs[(next + els.tabs.length) % els.tabs.length];
        target.focus();
        activateTab(target);
      });
    });
    els.people.addEventListener("click", function (e) {
      var btn = e.target.closest(".pmAn-person");
      if (!btn) return;
      selectPerson(
        state.people.filter(function (p) {
          return p.name === btn.getAttribute("data-person");
        })[0],
      );
    });
    bindDisclosures(els.groups, els.toggleAll, state.expanded);
    bindDisclosures(els.okrList, els.okrToggleAll, state.okrExpanded);
    els.okrList.addEventListener("click", function (e) {
      var btn = e.target.closest(".pmAn-linkBtn");
      if (btn) setGroupOpen(btn.parentNode, btn.getAttribute("aria-expanded") !== "true", state.krExpanded);
    });
    els.roadFilter.addEventListener("click", function (e) {
      var btn = e.target.closest(".pmAn-filterBtn");
      if (!btn) return;
      state.roadmapStatus = btn.getAttribute("data-status");
      var shown = renderRoadmapItems();
      els.roadStatus.textContent =
        "Showing " + shown + " of " + plural(state.roadmapScope.length, "item") + ".";
    });
    els.kpis.addEventListener("click", function (e) {
      var btn = e.target.closest(".pmAn-kpiBtn");
      if (!btn) return;
      var kpi = btn.parentNode.getAttribute("data-kpi");
      state.drill = state.drill === kpi ? null : kpi;
      state.drillAll = false;
      if (!state.drill) els.status.textContent = "";
      renderDrill(true);
    });
    els.drillMore.addEventListener("click", function () {
      state.drillAll = true;
      renderDrill(false);
      // The button disappears; move focus to the first newly shown row.
      els.drillList.children[DRILL_LIMIT].querySelector("a").focus();
    });
    COMPLETED_WINDOWS.forEach(function (w) {
      els.window.add(new Option(w.label, w.label));
    });
    els.fy.addEventListener("change", function () {
      state.filtersTouched = true;
      render();
    });
    els.window.addEventListener("change", function () {
      state.filtersTouched = true;
      render();
      els.status.textContent = "Showing completed tasks from " + windowPhrase() + ".";
    });
    els.defaultsBtn.addEventListener("click", function () {
      var open = els.defaultsBtn.getAttribute("aria-expanded") !== "true";
      els.defaultsBtn.setAttribute("aria-expanded", String(open));
      els.defaults.hidden = !open;
    });
    els.saveDefault.addEventListener("click", saveDefault);
    els.resetDefault.addEventListener("click", function () {
      applyFilters(state.teamDefault);
      render();
      els.status.textContent = "Team default applied: " + (els.fy.value || "All") + ", " + els.window.value + ".";
    });
    els.refresh.addEventListener("click", load);
    els.retry.addEventListener("click", function () {
      els.refresh.focus(); // Retry is about to be hidden; keep focus on a visible control.
      load();
    });
    load();
  })();
</script>
