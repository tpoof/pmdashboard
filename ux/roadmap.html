<!--
    UX ROADMAP — LEAF Programmer Page
    ===================================
    This page queries a LEAF form to display UX roadmap themes
    organized into Now / Next / Future time horizons.
-->

<style>
  /* ============================================================
   UX ROADMAP STYLES
   ============================================================ */

  #uxRoadmap * {
    box-sizing: border-box;
  }

  #uxRoadmap {
    font-family:
      -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial,
      sans-serif;
    max-width: 1200px;
    margin: 0 auto;
    padding: 16px;
    color: #1a1a1a;
  }

  /* Header */
  .rm-header {
    border-bottom: 2px solid #e0e0e0;
    padding-bottom: 16px;
    margin-bottom: 20px;
  }
  .rm-title {
    font-size: 22px;
    font-weight: 600;
    margin: 0 0 6px 0;
  }
  .rm-meta {
    font-size: 13px;
    color: #666;
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    margin-bottom: 10px;
  }
  .rm-vision {
    font-size: 13px;
    color: #444;
    padding: 10px 14px;
    background: #f5f5f0;
    border-left: 3px solid #003f72;
    margin-top: 10px;
    font-style: italic;
  }

  /* Toolbar */
  .rm-toolbar {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    flex-wrap: wrap;
    align-items: center;
  }
  .rm-toolbar label {
    font-size: 13px;
    color: #555;
    font-weight: 600;
  }
  .rm-filter-btn {
    font-size: 12px;
    padding: 5px 14px;
    border-radius: 20px;
    border: 1px solid #ccc;
    background: #fff;
    color: #555;
    cursor: pointer;
    transition: all 0.15s;
  }
  .rm-filter-btn:hover {
    background: #f0f0f0;
    border-color: #aaa;
  }
  .rm-filter-btn.active {
    background: #003f72;
    color: #fff;
    border-color: #003f72;
  }
  .rm-spacer {
    flex: 1;
  }
  .rm-add-btn {
    font-size: 13px;
    padding: 5px 16px;
    border-radius: 4px;
    border: 1px solid #003f72;
    background: #fff;
    color: #003f72;
    cursor: pointer;
    font-weight: 600;
  }
  .rm-add-btn:hover {
    background: #003f72;
    color: #fff;
  }

  /* Loading */
  .rm-loading {
    text-align: center;
    padding: 60px 20px;
    font-size: 16px;
    color: #888;
  }

  /* Error */
  .rm-error {
    text-align: center;
    padding: 40px 20px;
    color: #b00;
    font-size: 14px;
  }

  /* Empty state */
  .rm-empty {
    text-align: center;
    padding: 40px 20px;
    color: #888;
    font-size: 14px;
    border: 1px dashed #ccc;
    border-radius: 8px;
    margin: 8px 0;
  }

  /* Three columns */
  .rm-columns {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 16px;
    align-items: start;
  }
  @media (max-width: 900px) {
    .rm-columns {
      grid-template-columns: 1fr;
    }
  }

  /* Column header */
  .rm-col-header {
    font-size: 13px;
    font-weight: 700;
    color: #555;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 8px 0;
    border-bottom: 3px solid #ccc;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .rm-col-header .rm-count {
    font-size: 11px;
    font-weight: 400;
    background: #eee;
    padding: 2px 10px;
    border-radius: 12px;
    color: #666;
  }
  .rm-col-now .rm-col-header {
    border-bottom-color: #2e8540;
  }
  .rm-col-next .rm-col-header {
    border-bottom-color: #0071bc;
  }
  .rm-col-future .rm-col-header {
    border-bottom-color: #6b3a9e;
  }

  /* Theme cards */
  .rm-card {
    background: #fff;
    border: 1px solid #d6d7d9;
    border-radius: 6px;
    padding: 14px 16px;
    margin-bottom: 10px;
    cursor: pointer;
    transition:
      border-color 0.15s,
      box-shadow 0.15s;
  }
  .rm-card:hover {
    border-color: #aeb0b5;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
  }
  .rm-card.expanded {
    border-color: #003f72;
    box-shadow: 0 2px 8px rgba(0, 63, 114, 0.1);
  }

  .rm-card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
  }
  .rm-card-title {
    font-size: 14px;
    font-weight: 600;
    color: #1a1a1a;
    line-height: 1.4;
  }
  .rm-card-title a {
    color: #003f72;
    text-decoration: none;
  }
  .rm-card-title a:hover {
    text-decoration: underline;
  }

  /* Confidence badges */
  .rm-badge {
    font-size: 11px;
    padding: 2px 10px;
    border-radius: 12px;
    white-space: nowrap;
    flex-shrink: 0;
    font-weight: 600;
  }
  .rm-badge-high {
    background: #e7f4e4;
    color: #2e8540;
  }
  .rm-badge-medium {
    background: #fff1d2;
    color: #8b6914;
  }
  .rm-badge-low {
    background: #f9dede;
    color: #981b1e;
  }

  /* Beneficiary line */
  .rm-card-beneficiary {
    font-size: 12px;
    color: #555;
    margin-top: 6px;
    line-height: 1.5;
  }
  .rm-card-beneficiary strong {
    font-weight: 600;
    color: #1a1a1a;
  }

  /* Product area tag */
  .rm-area-tag {
    display: inline-block;
    font-size: 11px;
    padding: 2px 10px;
    border-radius: 12px;
    margin-top: 8px;
    background: #f1f1f1;
    color: #555;
    border: 1px solid #e0e0e0;
  }

  /* Expandable details */
  .rm-card-details {
    overflow: hidden;
    max-height: 0;
    transition: max-height 0.3s ease;
  }
  .rm-card.expanded .rm-card-details {
    max-height: 500px;
  }

  .rm-detail-section {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid #e8e8e8;
  }
  .rm-detail-label {
    font-size: 11px;
    font-weight: 700;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 4px;
  }
  .rm-detail-value {
    font-size: 13px;
    color: #444;
    line-height: 1.5;
  }

  /* Owner */
  .rm-owner {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: #555;
    margin-top: 8px;
  }
  .rm-owner-dot {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #003f72;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 9px;
    font-weight: 700;
    color: #fff;
  }

  /* Legend */
  .rm-legend {
    display: flex;
    gap: 20px;
    margin-top: 20px;
    padding-top: 14px;
    border-top: 1px solid #e0e0e0;
    font-size: 12px;
    color: #888;
    flex-wrap: wrap;
  }
  .rm-legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .rm-legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
  }

  /* Record link */
  .rm-record-link {
    display: inline-block;
    margin-top: 8px;
    font-size: 12px;
    color: #003f72;
    text-decoration: none;
  }
  .rm-record-link:hover {
    text-decoration: underline;
  }
</style>

<div id="uxRoadmap">
  <div class="rm-header">
    <div class="rm-title" id="rmTitle">UX Roadmap</div>
    <div class="rm-meta">
      <span id="rmOwner"></span>
    </div>
    <div class="rm-vision" id="rmVision">
      Edit the title, owner, date, and vision text in the CONFIGURATION section
      of this page's source code.
    </div>
  </div>

  <div class="rm-toolbar" id="rmToolbar">
    <label>Filter:</label>
    <button
      class="rm-filter-btn active"
      onclick="roadmap.filterCards('all', this)"
    >
      All
    </button>
    <!-- dynamic filter buttons injected here -->
    <span class="rm-spacer"></span>
    <button
      class="rm-add-btn"
      id="rmAddBtn"
      style="display: none"
      onclick="roadmap.createNewTheme()"
    >
      + New Theme
    </button>
  </div>

  <div class="rm-loading" id="rmLoading">
    <img src="images/indicator.gif" alt="" style="vertical-align: middle" />
    Loading roadmap...
  </div>

  <div class="rm-columns" id="rmColumns" style="display: none">
    <div class="rm-col-now">
      <div class="rm-col-header">
        Now <span class="rm-count" id="rmCountNow">0</span>
      </div>
      <div id="rmCardsNow"></div>
    </div>
    <div class="rm-col-next">
      <div class="rm-col-header">
        Next <span class="rm-count" id="rmCountNext">0</span>
      </div>
      <div id="rmCardsNext"></div>
    </div>
    <div class="rm-col-future">
      <div class="rm-col-header">
        Future <span class="rm-count" id="rmCountFuture">0</span>
      </div>
      <div id="rmCardsFuture"></div>
    </div>
  </div>

  <div class="rm-error" id="rmError" style="display: none"></div>

  <div class="rm-legend" id="rmLegend" style="display: none">
    <div class="rm-legend-item">
      <div class="rm-legend-dot" style="background: #2e8540"></div>
      Now — in progress
    </div>
    <div class="rm-legend-item">
      <div class="rm-legend-dot" style="background: #0071bc"></div>
      Next — near future
    </div>
    <div class="rm-legend-item">
      <div class="rm-legend-dot" style="background: #6b3a9e"></div>
      Future — 6+ months
    </div>
    <span class="rm-spacer"></span>
    <div class="rm-legend-item">Confidence:</div>
    <div class="rm-legend-item">
      <span class="rm-badge rm-badge-high">High</span>
    </div>
    <div class="rm-legend-item">
      <span class="rm-badge rm-badge-medium">Medium</span>
    </div>
    <div class="rm-legend-item">
      <span class="rm-badge rm-badge-low">Low</span>
    </div>
  </div>
</div>

<script>
  /* ============================================================
   CONFIGURATION — UPDATE THESE VALUES FOR YOUR LEAF SITE
   ============================================================ */
  var ROADMAP_CONFIG = {
    // The categoryID of your UX Roadmap form (numeric ID only, e.g. 50725)
    // NOTE: LeafFormQuery addTerm for categoryID expects the NUMERIC id,
    //       not the prefixed "form_XXXXX" string.
    categoryID: "form_50725",

    // Indicator IDs — update these after creating the form
    INDICATOR_TITLE: 10, // Theme Title (text)
    INDICATOR_BENEFICIARY: 11, // Beneficiary (text)
    INDICATOR_NEED: 12, // User Need (textarea)
    INDICATOR_OUTCOME: 13, // Business Outcome (textarea)
    INDICATOR_OWNER: 14, // Owner / Team (text)
    INDICATOR_WORK: 15, // Work Type (textarea)
    INDICATOR_HORIZON: 16, // Time Horizon (dropdown: Now, Next, Future)
    INDICATOR_PRIORITY: 17, // Priority (number)
    INDICATOR_AREA: 18, // Product Area (dropdown)
    INDICATOR_CONFIDENCE: 19, // Confidence (dropdown: High, Medium, Low)
    INDICATOR_SUBTHEMES: 20, // Subthemes (textarea)

    // Page display settings
    pageTitle: "UX Roadmap",
    owner: "Sarah Sherman",
    vision:
      "Prioritize and communicate UX work to align developers and stakeholders around a shared vision.",

    // Set to the categoryID number to enable "New Theme" button.
    // Leave as '' to hide the button.
    newFormCategoryID: "",

    // Workflow step that means "completed" — records at this step are
    // removed from the board. Set to '' to show all non-deleted records.
    completedStepID: "4",

    // Set to true to see raw API response data in the browser console
    debug: true,
  };

  /* ============================================================
   ROADMAP APPLICATION
   ============================================================ */
  var roadmap = (function () {
    var themes = [];
    var productAreas = [];
    var currentFilter = "all";

    /**
     * Initialize the roadmap
     */
    function init() {
      // Set header info
      $("#rmTitle").text(ROADMAP_CONFIG.pageTitle);
      $("#rmOwner").text("Owner: " + ROADMAP_CONFIG.owner);
      $("#rmVision").text(ROADMAP_CONFIG.vision);

      // Show "New Theme" button if configured
      if (ROADMAP_CONFIG.newFormCategoryID) {
        $("#rmAddBtn").show();
      }

      // Validate config
      if (!ROADMAP_CONFIG.categoryID) {
        showError(
          "Configuration needed: Set the categoryID and indicator IDs in the ROADMAP_CONFIG section of this page. See source code comments for setup instructions.",
        );
        return;
      }

      if (ROADMAP_CONFIG.debug) {
        runDiagnostics();
      } else {
        loadData();
      }
    }

    /**
     * Run diagnostic queries to find why data isn't appearing
     */
    function runDiagnostics() {
      console.log("=== ROADMAP DIAGNOSTICS ===");
      console.log("Config categoryID: '" + ROADMAP_CONFIG.categoryID + "'");
      console.log("Indicator IDs:", {
        title: ROADMAP_CONFIG.INDICATOR_TITLE,
        horizon: ROADMAP_CONFIG.INDICATOR_HORIZON,
        area: ROADMAP_CONFIG.INDICATOR_AREA,
      });

      // Step 1: Check what forms/categories exist via the API
      console.log("\n--- STEP 1: Fetching available forms via API ---");
      $.ajax({
        type: "GET",
        url: "./api/form/categories",
        success: function (categories) {
          console.log("Available form categories on this site:");
          if (categories && typeof categories === "object") {
            for (var catID in categories) {
              if (categories.hasOwnProperty(catID)) {
                var cat = categories[catID];
                var name =
                  cat.categoryName ||
                  cat.name ||
                  cat.categoryDescription ||
                  JSON.stringify(cat);
                console.log("  categoryID: " + catID + " => " + name);
              }
            }
          } else {
            console.log("  (could not parse categories response)");
            console.log("  Raw response:", categories);
          }
        },
        error: function (err) {
          console.log(
            "  Could not fetch categories (api/form/categories). Trying alternative...",
          );
          // Try the workflow categories endpoint
          $.ajax({
            type: "GET",
            url: "./api/workflow/categoriesUnabridged",
            success: function (cats) {
              console.log(
                "Available form categories (from workflow endpoint):",
              );
              if (Array.isArray(cats)) {
                cats.forEach(function (c) {
                  console.log(
                    "  categoryID: " +
                      c.categoryID +
                      " => " +
                      c.categoryName +
                      (c.visible === -1 ? " [UNPUBLISHED]" : ""),
                  );
                });
              } else {
                console.log("  Raw:", JSON.stringify(cats).substring(0, 500));
              }
            },
            error: function () {
              console.log("  Both category endpoints failed.");
            },
          });
        },
      });

      // Step 2: Try the configured categoryID
      console.log(
        "\n--- STEP 2: Querying with categoryID = '" +
          ROADMAP_CONFIG.categoryID +
          "' ---",
      );
      var q1 = new LeafFormQuery();
      q1.addTerm("categoryID", "=", ROADMAP_CONFIG.categoryID);
      q1.addTerm("stepID", "=", "notDeleted");
      q1.join("categoryName");
      q1.join("status");
      q1.setLimit(5);
      q1.execute()
        .then(function (res) {
          var count = Object.keys(res).length;
          console.log(
            "  Result: " +
              count +
              " records found with categoryID='" +
              ROADMAP_CONFIG.categoryID +
              "'",
          );
          if (count > 0) {
            var firstKey = Object.keys(res)[0];
            console.log("  First record keys:", Object.keys(res[firstKey]));
            console.log(
              "  First record categoryNames:",
              res[firstKey].categoryNames ||
                res[firstKey].categoryName ||
                "N/A",
            );
            console.log(
              "  First record status:",
              res[firstKey].stepID || res[firstKey].lastStatus || "N/A",
            );
          }
        })
        .catch(function (e) {
          console.log("  Query failed:", e);
        });

      // Step 3: Try without any category filter to see if ANY records exist
      console.log(
        "\n--- STEP 3: Querying ALL recent records (no category filter) ---",
      );
      var q2 = new LeafFormQuery();
      q2.addTerm("stepID", "=", "notDeleted");
      q2.join("categoryName");
      q2.setLimit(10);
      q2.execute()
        .then(function (res) {
          var count = Object.keys(res).length;
          console.log(
            "  Found " + count + " total non-deleted records on this site",
          );
          if (count > 0) {
            console.log("  Showing up to 10 records with their category info:");
            var i = 0;
            for (var rid in res) {
              if (!res.hasOwnProperty(rid) || i >= 10) break;
              var rec = res[rid];
              console.log(
                "    Record #" +
                  rid +
                  " | title: " +
                  (rec.title || "(no title)") +
                  " | categoryNames: " +
                  JSON.stringify(
                    rec.categoryNames || rec.categoryName || "N/A",
                  ) +
                  " | categoryIDs: " +
                  JSON.stringify(rec.categoryIDs || "N/A"),
              );
              i++;
            }
          } else {
            console.log(
              "  No records found at all — the site may have no submitted forms.",
            );
          }
        })
        .catch(function (e) {
          console.log("  Query failed:", e);
        });

      // Step 4: Try with the form_ prefix
      var altID = "form_" + ROADMAP_CONFIG.categoryID;
      console.log(
        "\n--- STEP 4: Trying categoryID = '" +
          altID +
          "' (with form_ prefix) ---",
      );
      var q3 = new LeafFormQuery();
      q3.addTerm("categoryID", "=", altID);
      q3.addTerm("stepID", "=", "notDeleted");
      q3.setLimit(5);
      q3.execute()
        .then(function (res) {
          var count = Object.keys(res).length;
          console.log(
            "  Result: " +
              count +
              " records found with categoryID='" +
              altID +
              "'",
          );
          if (count > 0) {
            console.log(
              "  >>> FIX: Change ROADMAP_CONFIG.categoryID to '" + altID + "'",
            );
          }
        })
        .catch(function (e) {
          console.log("  Query failed:", e);
        });

      // Step 5: Try including not-yet-submitted records
      console.log(
        "\n--- STEP 5: Including un-submitted records (stepID=notSubmitted) ---",
      );
      var q4 = new LeafFormQuery();
      q4.addTerm("categoryID", "=", ROADMAP_CONFIG.categoryID);
      q4.addTerm("stepID", "=", "notSubmitted");
      q4.setLimit(5);
      q4.execute()
        .then(function (res) {
          var count = Object.keys(res).length;
          console.log("  Result: " + count + " un-submitted records found");
          if (count > 0) {
            console.log(
              "  >>> Your records exist but have NOT been submitted yet!",
            );
            console.log(
              "  >>> Either submit them, or change the query to include unsubmitted records.",
            );
          }
        })
        .catch(function (e) {
          console.log("  Query failed:", e);
        });

      // Step 6: Discover actual indicator IDs from the form structure
      console.log(
        "\n--- STEP 6: Discovering actual indicator IDs for this form ---",
      );

      // 6a: Fetch the form structure to find real indicator IDs and names
      $.ajax({
        type: "GET",
        url:
          "./api/formEditor/indicator/list/category/" +
          ROADMAP_CONFIG.categoryID.replace("form_", ""),
        success: function (indicators) {
          console.log("  Form field structure (indicator list):");
          if (indicators && typeof indicators === "object") {
            for (var indID in indicators) {
              if (indicators.hasOwnProperty(indID)) {
                var ind = indicators[indID];
                var name = ind.name || ind.description || "";
                var format = ind.format || ind.input_type || "";
                var parentID = ind.parentID || "";
                console.log(
                  "    indicatorID: " +
                    indID +
                    " | name: " +
                    name +
                    " | format: " +
                    format +
                    " | parentID: " +
                    parentID,
                );
              }
            }
          } else {
            console.log("  (Could not parse indicator list)");
            console.log("  Raw:", JSON.stringify(indicators).substring(0, 500));
          }
        },
        error: function () {
          console.log(
            "  Could not fetch indicator list via formEditor API. Trying form/[recordID] approach...",
          );
        },
      });

      // 6b: Fetch a known record (#3) directly to see its full data
      console.log(
        "\n--- STEP 6b: Fetching Record #3 directly (the 'Test' record) ---",
      );
      $.ajax({
        type: "GET",
        url: "./api/form/3",
        success: function (formData) {
          console.log("  Record #3 full structure:");
          console.log(JSON.stringify(formData, null, 2));

          // Also try getting the data for this record
          $.ajax({
            type: "GET",
            url: "./api/form/3/data",
            success: function (dataRes) {
              console.log("  Record #3 /data endpoint:");
              console.log(JSON.stringify(dataRes, null, 2));
              if (dataRes && typeof dataRes === "object") {
                console.log("\n  >>> YOUR ACTUAL INDICATOR IDs ARE:");
                for (var indKey in dataRes) {
                  if (dataRes.hasOwnProperty(indKey)) {
                    var d = dataRes[indKey];
                    if (d && typeof d === "object") {
                      var series = Object.keys(d)[0] || "1";
                      var entry = d[series] || d;
                      console.log(
                        "    indicatorID: " +
                          (entry.indicatorID || indKey) +
                          " | name: " +
                          (entry.name || "?") +
                          " | format: " +
                          (entry.format || "?") +
                          " | value: " +
                          JSON.stringify(entry.value || "").substring(0, 80),
                      );
                    }
                  }
                }
                console.log(
                  "\n  >>> UPDATE your ROADMAP_CONFIG indicator IDs to match the above!",
                );
              }
            },
            error: function () {
              console.log("  Could not fetch /data for record #3");
            },
          });
        },
        error: function () {
          console.log("  Could not fetch record #3 directly.");
        },
      });

      // 6c: Try query with getData but using the CORRECT categoryID now
      var q5 = new LeafFormQuery();
      q5.addTerm("categoryID", "=", "form_50725");
      q5.getData([
        ROADMAP_CONFIG.INDICATOR_TITLE,
        ROADMAP_CONFIG.INDICATOR_HORIZON,
      ]);
      q5.setLimit(3);
      q5.execute()
        .then(function (res) {
          var count = Object.keys(res).length;
          console.log(
            "\n--- STEP 6c: Query with form_50725 + getData [" +
              ROADMAP_CONFIG.INDICATOR_TITLE +
              "," +
              ROADMAP_CONFIG.INDICATOR_HORIZON +
              "] ---",
          );
          console.log("  Result: " + count + " records");
          if (count > 0) {
            var firstKey = Object.keys(res)[0];
            console.log("  Full first record:");
            console.log(JSON.stringify(res[firstKey], null, 2));
          } else {
            console.log(
              "  0 records — the indicator IDs [" +
                ROADMAP_CONFIG.INDICATOR_TITLE +
                ", " +
                ROADMAP_CONFIG.INDICATOR_HORIZON +
                "] likely do not exist on this form.",
            );
            console.log(
              "  Check the output from Step 6b above for the real IDs.",
            );
          }

          console.log("\n=== END DIAGNOSTICS ===");
          console.log("=== Now running the real query... ===\n");
          loadData();
        })
        .catch(function (e) {
          console.log("  Query failed:", e);
          console.log("\n=== END DIAGNOSTICS ===");
          loadData();
        });
    }

    /**
     * Query LEAF for all roadmap theme records
     */
    function loadData() {
      var indicatorIDs = [
        ROADMAP_CONFIG.INDICATOR_TITLE,
        ROADMAP_CONFIG.INDICATOR_BENEFICIARY,
        ROADMAP_CONFIG.INDICATOR_NEED,
        ROADMAP_CONFIG.INDICATOR_OUTCOME,
        ROADMAP_CONFIG.INDICATOR_OWNER,
        ROADMAP_CONFIG.INDICATOR_WORK,
        ROADMAP_CONFIG.INDICATOR_HORIZON,
        ROADMAP_CONFIG.INDICATOR_PRIORITY,
        ROADMAP_CONFIG.INDICATOR_AREA,
        ROADMAP_CONFIG.INDICATOR_CONFIDENCE,
        ROADMAP_CONFIG.INDICATOR_SUBTHEMES,
      ];

      var query = new LeafFormQuery();
      query.addTerm("categoryID", "=", ROADMAP_CONFIG.categoryID);
      query.addTerm("stepID", "=", "notDeleted");
      if (ROADMAP_CONFIG.completedStepID) {
        query.addTerm("stepID", "!=", ROADMAP_CONFIG.completedStepID);
      }
      query.getData(indicatorIDs);
      query.join("status");

      query
        .execute()
        .then(function (results) {
          processResults(results);
        })
        .catch(function (err) {
          console.error("Roadmap query error:", err);
          showError(
            "Error loading roadmap data. Check the browser console (F12) for details.",
          );
        });
    }

    /**
     * Process query results into theme objects
     */
    function processResults(results) {
      themes = [];
      var areaSet = {};
      var recordCount = 0;
      var skippedCount = 0;

      for (var recordID in results) {
        if (!results.hasOwnProperty(recordID)) continue;
        recordCount++;
        var r = results[recordID];

        // -------------------------------------------------------
        // FIX 1: Resolve the data series object.
        //
        // LeafFormQuery response structure can vary:
        //   - Newer LEAF (Go backend): data is under r.s1.idXX.value
        //   - Some versions:           data is under r.s1.idXX  (value is the direct content)
        //   - PHP legacy fallback:     data may be at r[indicatorID].value
        //                              or r[indicatorID] directly
        //
        // We try s1 first, then fall back to the record root.
        // -------------------------------------------------------
        var s1 = r.s1 || r;

        var theme = {
          recordID: recordID,
          title: getVal(s1, ROADMAP_CONFIG.INDICATOR_TITLE),
          beneficiary: getVal(s1, ROADMAP_CONFIG.INDICATOR_BENEFICIARY),
          need: getVal(s1, ROADMAP_CONFIG.INDICATOR_NEED),
          outcome: getVal(s1, ROADMAP_CONFIG.INDICATOR_OUTCOME),
          owner: getVal(s1, ROADMAP_CONFIG.INDICATOR_OWNER),
          work: getVal(s1, ROADMAP_CONFIG.INDICATOR_WORK),
          horizon: normalizeHorizon(
            getVal(s1, ROADMAP_CONFIG.INDICATOR_HORIZON),
          ),
          priority:
            parseInt(getVal(s1, ROADMAP_CONFIG.INDICATOR_PRIORITY)) || 99,
          area: getVal(s1, ROADMAP_CONFIG.INDICATOR_AREA),
          confidence: normalizeConfidence(
            getVal(s1, ROADMAP_CONFIG.INDICATOR_CONFIDENCE),
          ),
          subthemes: getVal(s1, ROADMAP_CONFIG.INDICATOR_SUBTHEMES),
        };

        if (ROADMAP_CONFIG.debug && recordCount <= 3) {
          console.log("--- Record #" + recordID + " parsed theme ---");
          console.log("  title: '" + theme.title + "'");
          console.log(
            "  horizon: '" +
              theme.horizon +
              "' (raw: '" +
              getVal(s1, ROADMAP_CONFIG.INDICATOR_HORIZON) +
              "')",
          );
          console.log("  confidence: '" + theme.confidence + "'");
          console.log("  area: '" + theme.area + "'");
        }

        // -------------------------------------------------------
        // FIX 2: Relaxed inclusion filter.
        //
        // Previously required BOTH title AND horizon to be valid.
        // If either field's indicatorID is wrong, ALL records are
        // silently dropped and the board shows "No themes".
        //
        // Now: include if we have a title OR a horizon. If horizon
        // is missing, default to "now" so it still appears.
        // -------------------------------------------------------
        if (theme.title || theme.horizon) {
          if (!theme.horizon) {
            theme.horizon = "now"; // default so card isn't lost
            if (ROADMAP_CONFIG.debug) {
              console.log(
                "  -> Horizon missing for record " +
                  recordID +
                  ", defaulting to 'now'",
              );
            }
          }
          if (!theme.title) {
            theme.title = "(Untitled — Record #" + recordID + ")";
          }
          themes.push(theme);
          if (theme.area) {
            areaSet[theme.area] = true;
          }
        } else {
          skippedCount++;
          if (ROADMAP_CONFIG.debug) {
            console.log(
              "  -> SKIPPED record " +
                recordID +
                " (no title and no horizon found)",
            );
          }
        }
      }

      if (ROADMAP_CONFIG.debug) {
        console.log("=== PROCESSING SUMMARY ===");
        console.log("  Total records from query: " + recordCount);
        console.log("  Themes added to board: " + themes.length);
        console.log("  Records skipped: " + skippedCount);
        if (skippedCount > 0 && themes.length === 0) {
          console.log("  !!! ALL RECORDS SKIPPED — likely cause:");
          console.log(
            "  !!! Your indicator IDs in ROADMAP_CONFIG don't match the actual form field IDs.",
          );
          console.log(
            "  !!! Go to Report Builder, build a report with this form,",
          );
          console.log(
            "  !!! click JSON > JavaScript Template to see the correct indicator IDs.",
          );
        }
      }

      // Sort by priority within each horizon
      themes.sort(function (a, b) {
        return a.priority - b.priority;
      });

      // Build filter buttons for product areas
      productAreas = Object.keys(areaSet).sort();
      buildFilterButtons();

      // Render
      $("#rmLoading").hide();
      $("#rmColumns").show();
      $("#rmLegend").show();
      renderCards(currentFilter);
    }

    /**
     * Extract a value from the query result by indicatorID
     *
     * Handles multiple LEAF response formats:
     *   Format A (Go backend):  s1.id16.value = "Now"
     *   Format B (legacy PHP):  s1.id16 = "Now"  (value is directly the string)
     *   Format C (numeric key): s1["16"].value = "Now"
     */
    function getVal(series, indicatorID) {
      if (!indicatorID) return "";

      var val = null;

      // Try "id" + indicatorID (e.g. "id16") — most common format
      var key = "id" + indicatorID;
      if (series[key] !== undefined) {
        if (typeof series[key] === "object" && series[key] !== null) {
          // Format A: { value: "...", ... }
          val = series[key].value;
        } else {
          // Format B: direct string/number value
          val = series[key];
        }
      }

      // Fallback: try bare numeric key (e.g. "16")
      if (val === null || val === undefined) {
        var numKey = String(indicatorID);
        if (series[numKey] !== undefined) {
          if (typeof series[numKey] === "object" && series[numKey] !== null) {
            val = series[numKey].value;
          } else {
            val = series[numKey];
          }
        }
      }

      if (val === null || val === undefined) return "";

      // Handle array values (multiselect, checkboxes)
      if (Array.isArray(val)) {
        return val
          .filter(function (v) {
            return v && v !== "no";
          })
          .join(", ");
      }
      return val.toString().trim();
    }

    /**
     * Normalize horizon value to lowercase
     */
    function normalizeHorizon(val) {
      if (!val) return "";
      var v = val.toLowerCase().trim();
      if (v === "now" || v === "next" || v === "future") return v;
      // Handle partial matches or common variations
      if (v.indexOf("now") !== -1) return "now";
      if (v.indexOf("next") !== -1) return "next";
      if (v.indexOf("future") !== -1 || v.indexOf("later") !== -1)
        return "future";
      if (ROADMAP_CONFIG.debug) {
        console.log(
          "  WARNING: Unrecognized horizon value: '" +
            val +
            "' — must be Now, Next, or Future",
        );
      }
      return "";
    }

    /**
     * Normalize confidence value
     */
    function normalizeConfidence(val) {
      if (!val) return "medium";
      var v = val.toLowerCase().trim();
      if (v === "high" || v === "medium" || v === "low") return v;
      if (v.indexOf("high") !== -1) return "high";
      if (v.indexOf("low") !== -1) return "low";
      return "medium";
    }

    /**
     * Build dynamic filter buttons from product areas
     */
    function buildFilterButtons() {
      var toolbar = $("#rmToolbar");
      // Remove old dynamic buttons (keep the "All" button and label)
      toolbar.find(".rm-filter-dynamic").remove();

      var spacer = toolbar.find(".rm-spacer");
      for (var i = 0; i < productAreas.length; i++) {
        var area = productAreas[i];
        var btn = $("<button>")
          .addClass("rm-filter-btn rm-filter-dynamic")
          .text(area)
          .attr("data-area", area)
          .on("click", function () {
            roadmap.filterCards($(this).attr("data-area"), this);
          });
        btn.insertBefore(spacer);
      }
    }

    /**
     * Render theme cards into the three columns
     */
    function renderCards(filter) {
      currentFilter = filter;
      var horizons = ["now", "next", "future"];

      for (var h = 0; h < horizons.length; h++) {
        var horizon = horizons[h];
        var containerId =
          "#rmCards" + horizon.charAt(0).toUpperCase() + horizon.slice(1);
        var countId =
          "#rmCount" + horizon.charAt(0).toUpperCase() + horizon.slice(1);
        var container = $(containerId);
        container.empty();

        var filtered = themes.filter(function (t) {
          return (
            t.horizon === horizon && (filter === "all" || t.area === filter)
          );
        });

        $(countId).text(filtered.length);

        if (filtered.length === 0) {
          container.append('<div class="rm-empty">No themes</div>');
          continue;
        }

        for (var i = 0; i < filtered.length; i++) {
          container.append(buildCard(filtered[i]));
        }
      }
    }

    /**
     * Build a single theme card HTML
     */
    function buildCard(theme) {
      var confClass = "rm-badge-" + theme.confidence;
      var confLabel =
        theme.confidence.charAt(0).toUpperCase() + theme.confidence.slice(1);
      var initials = getInitials(theme.owner);

      var html = '<div class="rm-card" onclick="roadmap.toggleCard(this)">';

      // Top row: title + confidence badge
      html += '<div class="rm-card-top">';
      html +=
        '<div class="rm-card-title">' + escapeHtml(theme.title) + "</div>";
      html +=
        '<span class="rm-badge ' + confClass + '">' + confLabel + "</span>";
      html += "</div>";

      // Beneficiary + need
      if (theme.beneficiary || theme.need) {
        html += '<div class="rm-card-beneficiary">';
        if (theme.beneficiary) {
          html += "<strong>" + escapeHtml(theme.beneficiary) + "</strong>";
        }
        if (theme.need) {
          html += (theme.beneficiary ? " — " : "") + escapeHtml(theme.need);
        }
        html += "</div>";
      }

      // Product area tag
      if (theme.area) {
        html +=
          '<span class="rm-area-tag">' + escapeHtml(theme.area) + "</span>";
      }

      // Expandable details
      html += '<div class="rm-card-details">';

      // Business outcome
      if (theme.outcome) {
        html += '<div class="rm-detail-section">';
        html += '<div class="rm-detail-label">Business Outcome</div>';
        html +=
          '<div class="rm-detail-value">' +
          escapeHtml(theme.outcome) +
          "</div>";
        html += "</div>";
      }

      // Work involved
      if (theme.work) {
        html += '<div class="rm-detail-section">';
        html += '<div class="rm-detail-label">Work Involved</div>';
        html +=
          '<div class="rm-detail-value">' + escapeHtml(theme.work) + "</div>";
        html += "</div>";
      }

      // Subthemes
      if (theme.subthemes) {
        html += '<div class="rm-detail-section">';
        html += '<div class="rm-detail-label">Subthemes</div>';
        html +=
          '<div class="rm-detail-value">' +
          escapeHtml(theme.subthemes) +
          "</div>";
        html += "</div>";
      }

      // Owner
      if (theme.owner) {
        html += '<div class="rm-owner">';
        html +=
          '<span class="rm-owner-dot">' + escapeHtml(initials) + "</span>";
        html += escapeHtml(theme.owner);
        html += "</div>";
      }

      // Link to LEAF record (on its own line)
      html +=
        '<a class="rm-record-link" style="display:block; margin-top:10px" href="index.php?a=printview&recordID=' +
        theme.recordID +
        '" ';
      html += 'onclick="event.stopPropagation()" target="_blank">';
      html += "Open record #" + theme.recordID + " →</a>";

      html += "</div>"; // end details
      html += "</div>"; // end card

      return html;
    }

    /**
     * Toggle card expanded state
     */
    function toggleCard(el) {
      $(el).toggleClass("expanded");
    }

    /**
     * Filter cards by product area
     */
    function filterCards(area, btnEl) {
      $(".rm-filter-btn").removeClass("active");
      $(btnEl).addClass("active");
      renderCards(area);
    }

    /**
     * Create a new roadmap theme via LEAF form
     */
    function createNewTheme() {
      if (!ROADMAP_CONFIG.newFormCategoryID) return;
      // Navigate to new form creation
      window.location.href =
        "index.php?a=newform&formID=" + ROADMAP_CONFIG.newFormCategoryID;
    }

    /**
     * Get initials from a name/team string
     */
    function getInitials(name) {
      if (!name) return "?";
      var parts = name.trim().split(/\s+/);
      if (parts.length >= 2) {
        return (parts[0][0] + parts[1][0]).toUpperCase();
      }
      return parts[0].substring(0, 2).toUpperCase();
    }

    /**
     * Basic HTML escaping
     */
    function escapeHtml(str) {
      if (!str) return "";
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    /**
     * Show error message
     */
    function showError(msg) {
      $("#rmLoading").hide();
      $("#rmError").html(msg).show();
    }

    // Public API
    return {
      init: init,
      toggleCard: toggleCard,
      filterCards: filterCards,
      createNewTheme: createNewTheme,
    };
  })();

  /* Initialize when DOM is ready */
  $(function () {
    roadmap.init();
  });
</script>
