<style>
  /* ============================================================
   CustomerOverview v3 — LEAF Programmer Page
   All styles scoped to #customerOverview.

   v3 changes (on top of v2):
     - Removed: print button, record ID display, last-updated display
     - POC rendered as mailto: link (opens email client to POC address)
       TODO: set CONFIG.indicators.pocEmail once you know the indicator ID
     - Per-phase file + image attachments fetched via
       ajaxIndex.php?a=getprintindicator and rendered below phase text
     - Image thumbnails open in a lightbox overlay (keyboard + focus trap)
     - File attachments render as styled download links
   ============================================================ */

  #customerOverview *,
  #customerOverview *::before,
  #customerOverview *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  #customerOverview {
    font-family:
      -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    max-width: 900px;
    margin: 0 auto;
    padding: 24px;
    color: #1b1b1b;
    line-height: 1.5;
    position: relative;
  }

  /* ---- Skip link ---- */
  #customerOverview .co-skip-link {
    position: absolute;
    left: -9999px;
    top: 0;
    width: 1px;
    height: 1px;
    overflow: hidden;
    z-index: -999;
    background: #003f72;
    color: #ffffff;
    padding: 10px 20px;
    text-decoration: underline;
    font-weight: 600;
    font-size: 0.9375rem;
    border-radius: 0 0 4px 0;
    white-space: nowrap;
  }

  #customerOverview .co-skip-link:focus {
    position: absolute;
    left: 0;
    top: 0;
    width: auto;
    height: auto;
    overflow: visible;
    z-index: 9999;
    outline: 3px solid #ffffff;
    outline-offset: 2px;
  }

  #customerOverview .co-sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  /* ============================================================
   Loading / error states
   ============================================================ */
  #customerOverview .co-loading {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 64px 24px;
    gap: 16px;
    color: #3d4551;
    font-size: 1rem;
  }

  #customerOverview .co-spinner {
    width: 44px;
    height: 44px;
    border: 4px solid #d6d7d9;
    border-top-color: #0071bb;
    border-radius: 50%;
    animation: co-spin 0.75s linear infinite;
  }

  @keyframes co-spin {
    to {
      transform: rotate(360deg);
    }
  }

  #customerOverview .co-error {
    background: #fff3f3;
    border: 1px solid #b51d1d;
    border-left: 5px solid #b51d1d;
    border-radius: 4px;
    padding: 20px 24px;
    color: #4a0101;
    font-size: 1rem;
    font-weight: 500;
    line-height: 1.5;
  }

  /* ============================================================
   Fade-in
   ============================================================ */
  @keyframes co-fade-in {
    from {
      opacity: 0;
      transform: translateY(8px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  #customerOverview .co-content-visible {
    animation: co-fade-in 0.3s ease both;
  }

  /* ============================================================
   Page header
   ============================================================ */
  #customerOverview .co-header {
    margin-bottom: 36px;
    padding-bottom: 24px;
    border-bottom: 2px solid #dfe1e2;
  }

  /* v3: Welcome banner — sits above the project name */
  #customerOverview .co-welcome-banner {
    background: linear-gradient(135deg, #003f72 0%, #0071bb 100%);
    border-radius: 8px;
    padding: 20px 24px;
    margin-bottom: 24px;
    display: flex;
    align-items: flex-start;
    gap: 16px;
  }

  #customerOverview .co-welcome-icon {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    align-self: center;
  }

  #customerOverview .co-welcome-icon svg {
    width: 48px;
    height: 48px;
    color: #ffffff;
    filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.2));
  }

  #customerOverview .co-welcome-text {
    flex: 1;
    min-width: 0;
  }

  #customerOverview .co-welcome-headline {
    font-size: 1rem;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.85);
    line-height: 1.3;
    margin-bottom: 4px;
    text-transform: none;
    letter-spacing: 0;
  }

  /* Project title — large, bold, white, inside the banner */
  #customerOverview .co-welcome-project-title {
    font-size: 2rem;
    font-weight: 700;
    color: #ffffff;
    line-height: 1.15;
    margin-bottom: 10px;
  }

  #customerOverview .co-welcome-sub {
    font-size: 0.9375rem;
    color: rgba(255, 255, 255, 0.8);
    line-height: 1.5;
  }

  /* Share button */
  #customerOverview .co-share-wrap {
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    align-self: stretch;
  }

  #customerOverview .co-share-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, 0.5);
    background: rgba(255, 255, 255, 0.1);
    color: #ffffff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition:
      background 0.15s,
      border-color 0.15s;
    flex-shrink: 0;
  }

  #customerOverview .co-share-btn svg {
    width: 18px;
    height: 18px;
  }

  #customerOverview .co-share-btn:hover {
    background: rgba(255, 255, 255, 0.25);
    border-color: rgba(255, 255, 255, 0.9);
  }

  #customerOverview .co-share-btn:focus-visible {
    outline: 3px solid #ffffff;
    outline-offset: 3px;
  }

  #customerOverview .co-share-toast {
    font-size: 0.7rem;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.9);
    text-align: center;
    white-space: nowrap;
    min-height: 1em;
    letter-spacing: 0.02em;
  }

  #customerOverview .co-project-type {
    font-size: 1rem;
    color: #3d4551;
    margin-bottom: 4px;
  }

  /* v3: italicized project type blurb */
  #customerOverview .co-project-type-blurb {
    font-size: 0.9rem;
    font-style: italic;
    color: #71767a;
    line-height: 1.55;
    margin-bottom: 10px;
    padding-left: 2px;
  }

  /* objective line */
  #customerOverview .co-project-objective {
    font-size: 1rem;
    color: #3d4551;
    margin-bottom: 6px;
    line-height: 1.5;
  }

  #customerOverview .co-project-poc {
    font-size: 1rem;
    color: #3d4551;
    margin-bottom: 4px;
  }

  #customerOverview .co-project-label {
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  /* v3: POC mailto link */
  #customerOverview .co-poc-link {
    color: #0071bb;
    text-decoration: underline;
    text-underline-offset: 2px;
    font-weight: 500;
  }

  #customerOverview .co-poc-link:hover {
    color: #003f72;
  }

  #customerOverview .co-poc-link:focus-visible {
    outline: 3px solid #0071bb;
    outline-offset: 3px;
    border-radius: 2px;
  }

  /* ============================================================
   Progress bar
   ============================================================ */
  #customerOverview .co-progress-section {
    margin-bottom: 40px;
  }

  #customerOverview .co-progress-heading {
    font-size: 1.25rem;
    font-weight: 700;
    color: #003f72;
    margin-bottom: 28px;
  }

  #customerOverview .co-progress-nav {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }

  #customerOverview .co-progress-track {
    position: relative;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    list-style: none;
    min-width: 320px;
    padding-bottom: 4px;
  }

  /* Grey base connector line */
  #customerOverview .co-progress-track::before {
    content: "";
    position: absolute;
    top: 20px;
    left: 10%;
    right: 10%;
    height: 3px;
    background: #a9aeb1;
    z-index: 0;
  }

  /* Green completed-segment overlay */
  #customerOverview .co-progress-track::after {
    content: "";
    position: absolute;
    top: 20px;
    left: 10%;
    height: 3px;
    width: calc(var(--co-progress-pct, 0%) * 0.8);
    background: #1a7a4a;
    z-index: 0;
    transition: width 0.4s ease;
  }

  #customerOverview .co-step {
    display: flex;
    flex-direction: column;
    align-items: center;
    flex: 1;
    position: relative;
    z-index: 1;
    gap: 6px;
  }

  #customerOverview .co-step-circle {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 3px solid #a9aeb1;
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    font-weight: 700;
    color: #3d4551;
    flex-shrink: 0;
  }

  #customerOverview .co-step-label {
    font-size: 0.75rem;
    font-weight: 500;
    color: #3d4551;
    text-align: center;
    max-width: 80px;
    line-height: 1.3;
  }

  #customerOverview .co-step--complete .co-step-circle {
    background: #1a7a4a;
    border-color: #1a7a4a;
    color: #ffffff !important;
  }
  #customerOverview .co-step--complete .co-step-circle span {
    color: #ffffff !important;
  }
  #customerOverview .co-step--complete .co-step-label {
    color: #1b1b1b;
  }

  #customerOverview .co-step--active .co-step-circle {
    background: #003f72 !important;
    border-color: #003f72 !important;
    color: #ffffff !important;
    box-shadow: 0 0 0 4px #cce0f5;
  }
  #customerOverview .co-step--active .co-step-circle span {
    color: #ffffff !important;
  }
  #customerOverview .co-step--active .co-step-label {
    font-weight: 700;
    color: #003f72;
  }

  #customerOverview .co-step--upcoming .co-step-circle {
    background: #f0f0f0;
    border-color: #a9aeb1;
    color: #3d4551;
  }
  #customerOverview .co-step--upcoming .co-step-label {
    color: #71767a;
  }

  /* ============================================================
   Phase detail cards
   ============================================================ */
  #customerOverview .co-phases-section {
    margin-top: 8px;
  }

  #customerOverview .co-phases-heading {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  #customerOverview .co-phases-toolbar {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 12px;
  }

  #customerOverview .co-toggle-completed-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: none;
    border: none;
    padding: 4px 0;
    font-size: 0.875rem;
    font-weight: 600;
    color: #0071bb;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  #customerOverview .co-toggle-completed-btn:hover {
    color: #003f72;
  }
  #customerOverview .co-toggle-completed-btn:focus-visible {
    outline: 3px solid #0071bb;
    outline-offset: 3px;
    border-radius: 2px;
  }

  #customerOverview .co-phases {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  #customerOverview .co-phase {
    background: #ffffff;
    border: 1px solid #dfe1e2;
    border-radius: 6px;
    padding: 20px 24px;
  }

  #customerOverview .co-phase--complete {
    border-color: #d6d7d9;
    background: #fafafa;
  }
  #customerOverview .co-phase--complete.co-phase--collapsed .co-phase-body {
    display: none;
  }
  #customerOverview .co-phase--complete.co-phase--collapsed .co-phase-header {
    margin-bottom: 0;
  }
  #customerOverview .co-phase--active {
    border-left: 5px solid #0071bb;
    background: #f0f7ff;
    border-color: #b5d0eb;
    padding-left: 20px;
  }
  #customerOverview .co-phase--upcoming {
    background: #fafafa;
    border-color: #e6e6e6;
  }

  #customerOverview .co-phase-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
  }

  #customerOverview .co-phase--complete .co-phase-header {
    cursor: pointer;
    user-select: none;
  }

  #customerOverview .co-phase-number {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    font-size: 0.875rem;
    font-weight: 700;
    flex-shrink: 0;
  }

  #customerOverview .co-phase--complete .co-phase-number {
    background: #1a7a4a;
    color: #ffffff !important;
  }
  #customerOverview .co-phase--complete .co-phase-number span {
    color: #ffffff !important;
  }
  #customerOverview .co-phase--active .co-phase-number {
    background: #003f72;
    color: #ffffff !important;
  }
  #customerOverview .co-phase--active .co-phase-number span {
    color: #ffffff !important;
  }
  #customerOverview .co-phase--upcoming .co-phase-number {
    background: #71767a;
    color: #ffffff !important;
  }
  #customerOverview .co-phase--upcoming .co-phase-number span {
    color: #ffffff !important;
  }

  #customerOverview .co-phase-title {
    font-size: 1.075rem;
    font-weight: 600;
    color: #1b1b1b;
    flex: 1;
  }
  #customerOverview .co-phase--upcoming .co-phase-title {
    color: #3d4551;
  }

  #customerOverview .co-phase-badge {
    font-size: 0.725rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 3px 10px;
    border-radius: 20px;
    flex-shrink: 0;
  }
  #customerOverview .co-phase--complete .co-phase-badge {
    background: #e5f5ed;
    color: #1a7a4a;
    border: 1px solid #1a7a4a;
  }
  #customerOverview .co-phase--active .co-phase-badge {
    background: #ddeeff;
    color: #003f72;
    border: 1px solid #0071bb;
  }

  #customerOverview .co-phase-chevron {
    flex-shrink: 0;
    width: 18px;
    height: 18px;
    color: #71767a;
    transition: transform 0.2s ease;
    display: none;
  }
  #customerOverview .co-phase--complete .co-phase-chevron {
    display: block;
  }
  #customerOverview .co-phase--complete.co-phase--collapsed .co-phase-chevron {
    transform: rotate(-90deg);
  }

  /* v3: phase body wraps both text content and attachments */
  #customerOverview .co-phase-body {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  #customerOverview .co-phase-content {
    font-size: 0.9375rem;
    color: #1b1b1b;
    line-height: 1.65;
    white-space: pre-wrap;
    word-break: break-word;
  }
  #customerOverview .co-phase--complete .co-phase-content {
    color: #3d4551;
  }
  #customerOverview .co-phase--upcoming .co-phase-content {
    color: #3d4551;
  }

  #customerOverview .co-phase-placeholder {
    font-style: italic;
    color: #71767a;
    font-size: 0.9375rem;
  }

  /* ============================================================
   v3: Attachment area
   ============================================================ */
  #customerOverview .co-attachments {
    border-top: 1px solid #dfe1e2;
    padding-top: 14px;
  }

  #customerOverview .co-attachments-label {
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #71767a;
    margin-bottom: 10px;
  }

  /* Loading shimmer for attachments */
  #customerOverview .co-attach-loading {
    font-size: 0.875rem;
    color: #71767a;
    font-style: italic;
  }

  /* Image grid */
  #customerOverview .co-img-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 10px;
  }

  #customerOverview .co-img-thumb-btn {
    display: block;
    padding: 0;
    background: none;
    border: 2px solid #dfe1e2;
    border-radius: 6px;
    cursor: pointer;
    line-height: 0;
    transition:
      border-color 0.15s,
      box-shadow 0.15s;
  }

  #customerOverview .co-img-thumb-btn:hover,
  #customerOverview .co-img-thumb-btn:focus {
    border-color: #0071bb;
  }

  #customerOverview .co-img-thumb-btn:focus-visible {
    outline: 3px solid #0071bb;
    outline-offset: 3px;
  }

  #customerOverview .co-img-thumb {
    width: 120px;
    height: 90px;
    object-fit: cover;
    border-radius: 4px;
    display: block;
  }

  #customerOverview .co-img-caption {
    font-size: 0.7rem;
    color: #71767a;
    text-align: center;
    max-width: 120px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    margin-top: 4px;
  }

  #customerOverview .co-img-figure {
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* File list */
  #customerOverview .co-file-list {
    list-style: none;
    padding: 0;
    margin: 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  #customerOverview .co-file-item {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  #customerOverview .co-file-icon {
    flex-shrink: 0;
    width: 28px;
    height: 28px;
    background: #ddeeff;
    border: 1px solid #b5d0eb;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #customerOverview .co-file-icon svg {
    width: 14px;
    height: 14px;
    color: #003f72;
  }

  #customerOverview .co-file-link {
    font-size: 0.9rem;
    font-weight: 600;
    color: #0071bb;
    text-decoration: underline;
    text-underline-offset: 2px;
  }

  #customerOverview .co-file-link:hover {
    color: #003f72;
  }
  #customerOverview .co-file-link:focus-visible {
    outline: 3px solid #0071bb;
    outline-offset: 3px;
    border-radius: 2px;
  }

  /* ============================================================
   v3: Lightbox overlay
   ============================================================ */
  #co-lightbox {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: rgba(0, 0, 0, 0.88);
    align-items: center;
    justify-content: center;
  }

  #co-lightbox.co-lightbox--open {
    display: flex;
  }

  #co-lightbox-inner {
    position: relative;
    max-width: 92vw;
    max-height: 92vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #co-lightbox-img {
    display: block;
    max-width: 90vw;
    max-height: 88vh;
    border-radius: 4px;
    box-shadow: 0 8px 48px rgba(0, 0, 0, 0.6);
    object-fit: contain;
  }

  #co-lightbox-close {
    position: absolute;
    top: -40px;
    right: 0;
    background: none;
    border: 2px solid rgba(255, 255, 255, 0.6);
    border-radius: 50%;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: #ffffff;
    font-size: 1.25rem;
    line-height: 1;
    transition: background 0.15s;
  }

  #co-lightbox-close:hover {
    background: rgba(255, 255, 255, 0.2);
  }
  #co-lightbox-close:focus-visible {
    outline: 3px solid #ffffff;
    outline-offset: 3px;
  }

  #co-lightbox-caption {
    position: absolute;
    bottom: -32px;
    left: 0;
    right: 0;
    text-align: center;
    color: rgba(255, 255, 255, 0.8);
    font-size: 0.875rem;
    pointer-events: none;
  }

  /* ============================================================
   Focus styles
   ============================================================ */
  #customerOverview a:focus-visible {
    outline: 3px solid #0071bb;
    outline-offset: 3px;
    border-radius: 2px;
  }

  /* ============================================================
   Responsive
   ============================================================ */
  @media (max-width: 640px) {
    #customerOverview {
      padding: 16px;
    }
    #customerOverview .co-welcome-project-title {
      font-size: 1.5rem;
    }
    #customerOverview .co-welcome-banner {
      padding: 16px;
      gap: 12px;
    }
    #customerOverview .co-welcome-headline {
      font-size: 1rem;
    }
    #customerOverview .co-welcome-icon svg {
      width: 36px;
      height: 36px;
    }
    #customerOverview .co-step-circle {
      width: 34px;
      height: 34px;
      font-size: 0.875rem;
    }
    #customerOverview .co-progress-track::before,
    #customerOverview .co-progress-track::after {
      top: 17px;
    }
    #customerOverview .co-step-label {
      font-size: 0.65rem;
      max-width: 60px;
    }
    #customerOverview .co-phase {
      padding: 14px 16px;
    }
    #customerOverview .co-phase--active {
      padding-left: 14px;
    }
    #customerOverview .co-phase-title {
      font-size: 1rem;
    }
    #customerOverview .co-phase-badge {
      display: none;
    }
    #customerOverview .co-img-thumb {
      width: 90px;
      height: 68px;
    }
    #customerOverview .co-img-thumb-btn {
      border-width: 1px;
    }
    #customerOverview .co-img-caption {
      max-width: 90px;
    }
  }

  /* ============================================================
   Print styles
   ============================================================ */
  @media print {
    #customerOverview .co-phases-toolbar,
    #customerOverview .co-phase-chevron {
      display: none !important;
    }
    #customerOverview .co-phase--collapsed .co-phase-body {
      display: flex !important;
    }
    #customerOverview .co-phase--collapsed .co-phase-header {
      margin-bottom: 14px !important;
    }
    #co-lightbox {
      display: none !important;
    }
    #customerOverview .co-img-thumb-btn {
      border: 1px solid #ccc;
    }
    #customerOverview .co-welcome-banner {
      background: none !important;
      border: 1px solid #dfe1e2;
      padding: 14px 16px;
    }

<script>
  (function () {
    "use strict";

    /* ============================================================
     CONFIG
     ============================================================ */
    var CONFIG = {
      debug: false,

      categoryID: "55445",

      indicators: {
        projectName: 59,
        projectType: 60,
        /*
         * Indicators 67 and 74 are orgchart_employee fields.
         * LEAF stores the empUID as the raw value and populates
         * s1["id{N}_orgchart"] with { empUID, userName, … }.
         * We call /platform/orgchart/api/employee/{empUID} to resolve
         * the full name and email for the mailto: link.
         */
        poc: 67, // LEAF POC
        servicePoc: 74, // Service POC
        objective: 86, // Project Objective

        currentPhase: 61,
        phase1: 62,
        phase2: 63,
        phase3: 64,
        phase4: 65,
        phase5: 66,
      },

      phases: [
        {
          step: 1,
          label: "Discovery",
          key: "phase1",
          fileInd: 76,
          imageInd: 77,
        },
        {
          step: 2,
          label: "Planning",
          key: "phase2",
          fileInd: 78,
          imageInd: 79,
        },
        {
          step: 3,
          label: "Execution",
          key: "phase3",
          fileInd: 80,
          imageInd: 81,
        },
        { step: 4, label: "Launch", key: "phase4", fileInd: 82, imageInd: 83 },
        {
          step: 5,
          label: "Monitoring",
          key: "phase5",
          fileInd: 84,
          imageInd: 85,
        },
      ],

      phaseValueMap: {
        discovery: 1,
        planning: 2,
        execution: 3,
        launch: 4,
        monitoring: 5,
      },

      /*
       * Italicized blurbs rendered beneath the project type label.
       * Keys are lowercased, trimmed versions of the raw LEAF dropdown value.
       * Unrecognised types render no blurb (silently omitted).
       */
      PROJECT_TYPE_BLURBS: {
        "national project":
          "A National Project is a structured, full-service engagement where the LEAF team guides your agency through every phase - from discovery to launch - with dedicated support along the way.",
        "managed services":
          "With Managed Services, the LEAF team remains a dedicated resource for your organization - available to help with questions, changes, and ongoing needs as your environment evolves.",
      },
    };

    /* ============================================================
     DOM helpers
     ============================================================ */
    function byId(id) {
      return document.getElementById(id);
    }

    function esc(str) {
      if (str == null) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function announce(message, assertive) {
      var node = byId(assertive ? "co-live-assertive" : "co-live-polite");
      if (!node) return;
      node.textContent = "";
      setTimeout(function () {
        node.textContent = message;
      }, 60);
    }

    function decodeEntities(str) {
      if (!str || typeof str !== "string") return str;
      return str
        .replace(/&amp;/g, "&")
        .replace(/&lt;/g, "<")
        .replace(/&gt;/g, ">")
        .replace(/&quot;/g, '"')
        .replace(/&#039;/g, "'")
        .replace(/&#39;/g, "'")
        .replace(/&#x27;/g, "'")
        .replace(/&apos;/g, "'");
    }

    /* ============================================================
     getRecordIDFromURL
     Tries multiple sources in order — LEAF programmer pages may
     surface the record ID in different places depending on context:
       1. ?a= on the current window (standard programmer page URL)
       2. ?a= on the parent frame URL (when embedded in an iframe)
       3. ?recordID= on either window
     Logs each attempt when debug is on so the source is visible.
     ============================================================ */
    function getRecordIDFromURL() {
      function fromSearch(search, label) {
        try {
          var params = new URLSearchParams(search);
          var v = params.get("a") || params.get("recordID") || "";
          if (CONFIG.debug && v)
            console.log("[CustomerOverview] recordID from " + label + ":", v);
          return v;
        } catch (e) {
          var match = search.match(/[?&](?:a|recordID)=([^&]+)/);
          var v2 = match ? decodeURIComponent(match[1]) : "";
          if (CONFIG.debug && v2)
            console.log(
              "[CustomerOverview] recordID (regex) from " + label + ":",
              v2,
            );
          return v2;
        }
      }

      /* 1. Current window */
      var id = fromSearch(window.location.search, "window.location");
      if (id) return id;

      /* 2. Parent frame (if embedded in iframe) */
      try {
        if (window.parent && window.parent !== window) {
          id = fromSearch(window.parent.location.search, "parent.location");
          if (id) return id;
        }
      } catch (e) {
        /* Cross-origin parent — silently skip */
        if (CONFIG.debug)
          console.log(
            "[CustomerOverview] parent.location inaccessible (cross-origin)",
          );
      }

      if (CONFIG.debug) {
        console.warn(
          "[CustomerOverview] Could not find recordID in any URL source.",
        );
        console.log(
          "[CustomerOverview] window.location.href:",
          window.location.href,
        );
        try {
          console.log(
            "[CustomerOverview] parent.location.href:",
            window.parent.location.href,
          );
        } catch (e) {}
      }

      return "";
    }

    /* ============================================================
     getAPIBase
     Returns the base URL for LEAF API calls, e.g.
       "https://yoursite.gov/platform/projects"
     Derived from the current page href so it works regardless of
     iframe nesting depth or server path configuration.
     ============================================================ */
    function getAPIBase() {
      /* Try current window first; fall back to parent if cross-origin access fails */
      var href = "";
      try {
        href = window.location.href;
      } catch (e) {}

      /* Strip everything after the last "/" before any query string */
      var base = href.replace(/\/[^\/]*(\?.*)?$/, "");

      if (CONFIG.debug) console.log("[CustomerOverview] API base:", base);
      return base;
    }

    function showEl(id) {
      var el = byId(id);
      if (el) el.style.display = "";
    }
    function hideEl(id) {
      var el = byId(id);
      if (el) el.style.display = "none";
    }

    /* ============================================================
     dbg — write a line to the on-page debug panel (debug mode only)
     ============================================================ */
    function dbg(msg) {
      if (!CONFIG.debug) return;
      console.log("[CustomerOverview] " + msg);
      var panel = byId("co-debug-panel");
      if (!panel) return;
      panel.style.display = "block";
      panel.textContent += msg + "\n";
    }

    function showLoading() {
      showEl("co-loading");
      hideEl("co-error");
      hideEl("co-content");
    }

    function showError(message) {
      hideEl("co-loading");
      hideEl("co-content");
      var errEl = byId("co-error");
      errEl.textContent = message;
      showEl("co-error");
      announce(message, true);
    }

    function showContent() {
      hideEl("co-loading");
      hideEl("co-error");
      var contentEl = byId("co-content");
      contentEl.style.display = "";
      contentEl.classList.add("co-content-visible");
      announce("Project data loaded.", false);
    }

    function getField(s1, indicatorID) {
      if (!s1) return "";
      var key = "id" + String(indicatorID);
      var v = s1[key];
      if (v == null) return "";
      return decodeEntities(String(v).trim());
    }

    function stepState(stepNumber, activeStep) {
      if (stepNumber < activeStep) return "complete";
      if (stepNumber === activeStep) return "active";
      return "upcoming";
    }

    function resolveActiveStep(raw) {
      if (!raw) return 1;
      var norm = String(raw).toLowerCase().trim();
      if (Object.prototype.hasOwnProperty.call(CONFIG.phaseValueMap, norm)) {
        return CONFIG.phaseValueMap[norm];
      }
      var keys = Object.keys(CONFIG.phaseValueMap);
      for (var i = 0; i < keys.length; i++) {
        if (norm.indexOf(keys[i]) !== -1 || keys[i].indexOf(norm) !== -1) {
          return CONFIG.phaseValueMap[keys[i]];
        }
      }
      if (CONFIG.debug) {
        console.warn(
          "[CustomerOverview] Unrecognized phase value:",
          JSON.stringify(raw),
        );
      }
      return 1;
    }

    /* ============================================================
     fetchOrgchartEmployee
     Resolves an empUID to { displayName, email } via the orgchart API.
     Always resolves — never rejects — so callers can fall back safely.
     ============================================================ */
    function fetchOrgchartEmployee(empUID) {
      if (!empUID) return Promise.resolve({ displayName: "", email: "" });

      return fetch(
        "/platform/orgchart/api/employee/" + encodeURIComponent(empUID),
        {
          credentials: "include",
          headers: { "x-requested-with": "XMLHttpRequest" },
        },
      )
        .then(function (r) {
          if (!r.ok) throw new Error("Orgchart API HTTP " + r.status);
          return r.json();
        })
        .then(function (data) {
          var emp = data && data.employee;
          if (!emp) return { displayName: "", email: "" };

          /* Build display name: "First [Middle] Last" */
          var parts = [emp.firstName, emp.middleName, emp.lastName]
            .map(function (p) {
              return (p || "").trim();
            })
            .filter(Boolean);
          var displayName = parts.join(" ");

          /* email field may be "email" or "Email" depending on orgchart version */
          var email = (emp.email || emp.Email || "").trim();

          if (CONFIG.debug) {
            console.log("[CustomerOverview] orgchart employee:", {
              empUID: empUID,
              displayName: displayName,
              email: email,
            });
          }

          return { displayName: displayName, email: email };
        })
        .catch(function (err) {
          if (CONFIG.debug)
            console.warn("[CustomerOverview] orgchart lookup failed:", err);
          return { displayName: "", email: "" };
        });
    }

    /* ============================================================
     Lightbox
     ============================================================ */
    var lightbox = {
      el: null,
      imgEl: null,
      captionEl: null,
      closeBtn: null,
      prevFocus: null,

      init: function () {
        this.el = byId("co-lightbox");
        this.imgEl = byId("co-lightbox-img");
        this.captionEl = byId("co-lightbox-caption");
        this.closeBtn = byId("co-lightbox-close");
        if (!this.el) return;

        var self = this;

        /* Close on backdrop click */
        this.el.addEventListener("click", function (e) {
          if (e.target === self.el) self.close();
        });

        /* Close button */
        this.closeBtn.addEventListener("click", function () {
          self.close();
        });

        /* Keyboard: Escape closes, Tab stays trapped inside */
        this.el.addEventListener("keydown", function (e) {
          if (e.key === "Escape") {
            self.close();
            return;
          }
          if (e.key === "Tab") {
            /* Only focusable element inside is the close button */
            e.preventDefault();
            self.closeBtn.focus();
          }
        });
      },

      open: function (src, caption) {
        if (!this.el) return;
        this.prevFocus = document.activeElement;
        this.imgEl.setAttribute("src", src);
        this.imgEl.setAttribute("alt", caption || "");
        this.captionEl.textContent = caption || "";
        this.el.classList.add("co-lightbox--open");
        this.closeBtn.focus();
      },

      close: function () {
        if (!this.el) return;
        this.el.classList.remove("co-lightbox--open");
        this.imgEl.setAttribute("src", "");
        if (this.prevFocus && typeof this.prevFocus.focus === "function") {
          this.prevFocus.focus();
        }
      },
    };

    /* ============================================================
     Attachment renderer
     Calls ajaxIndex.php?a=getprintindicator for both file and image
     indicators of a phase, then builds the attachment section.
     ============================================================ */
    function fetchIndicatorHTML(recordID, indicatorID) {
      return fetch(
        getAPIBase() +
          "/ajaxIndex.php?a=getprintindicator" +
          "&recordID=" +
          encodeURIComponent(recordID) +
          "&indicatorID=" +
          encodeURIComponent(indicatorID) +
          "&series=1",
        {
          credentials: "include",
          headers: { "x-requested-with": "XMLHttpRequest" },
        },
      )
        .then(function (r) {
          return r.text();
        })
        .catch(function () {
          return "";
        });
    }

    function parseAttachmentsFromHTML(html) {
      var tmp = document.createElement("div");
      tmp.innerHTML = html;
      return {
        images: Array.prototype.slice.call(
          tmp.querySelectorAll('img[src*="image.php"]'),
        ),
        files: Array.prototype.slice.call(
          tmp.querySelectorAll('a[href*="file.php"]'),
        ),
      };
    }

    function buildAttachmentSection(attachEl, images, files) {
      /* Nothing at all */
      if (images.length === 0 && files.length === 0) {
        attachEl.style.display = "none";
        return;
      }

      var html = '<p class="co-attachments-label">Attachments</p>';

      /* Image grid */
      if (images.length > 0) {
        html +=
          '<div class="co-img-grid" role="list" aria-label="Image attachments">';
        images.forEach(function (img, i) {
          var src = img.getAttribute("src") || "";
          var altRaw = img.getAttribute("alt") || "";
          var caption =
            altRaw.replace(/^image upload:\s*/i, "").trim() ||
            "Image " + (i + 1);
          var safeCaption = esc(caption);

          html += '<figure class="co-img-figure" role="listitem">';
          html +=
            '<button type="button" class="co-img-thumb-btn"' +
            ' data-src="' +
            esc(src) +
            '"' +
            ' data-caption="' +
            safeCaption +
            '"' +
            ' aria-label="View full size: ' +
            safeCaption +
            '">';
          html +=
            '<img src="' +
            esc(src) +
            '"' +
            ' alt="' +
            safeCaption +
            '"' +
            ' class="co-img-thumb"' +
            ' loading="lazy"' +
            "/>";
          html += "</button>";
          html +=
            '<span class="co-img-caption" aria-hidden="true" title="' +
            safeCaption +
            '">' +
            caption +
            "</span>";
          html += "</figure>";
        });
        html += "</div>";
      }

      /* File list */
      if (files.length > 0) {
        html += '<ul class="co-file-list" aria-label="File attachments">';
        files.forEach(function (a) {
          var href = a.getAttribute("href") || "#";
          var filename = (a.textContent || "").trim() || "Download file";
          html += '<li class="co-file-item">';
          html +=
            '<span class="co-file-icon" aria-hidden="true">' +
            '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true" focusable="false">' +
            '<path d="M9 2H4a1 1 0 00-1 1v10a1 1 0 001 1h8a1 1 0 001-1V6L9 2z"/>' +
            '<path d="M9 2v4h4"/>' +
            "</svg>" +
            "</span>";
          html +=
            '<a href="' +
            esc(href) +
            '" target="_blank" rel="noopener noreferrer"' +
            ' class="co-file-link"' +
            ' aria-label="Download ' +
            esc(filename) +
            ' (opens in new tab)">' +
            esc(filename) +
            "</a>";
          html += "</li>";
        });
        html += "</ul>";
      }

      attachEl.innerHTML = html;
      attachEl.style.display = "";

      /* Wire lightbox buttons */
      var btns = attachEl.querySelectorAll(".co-img-thumb-btn");
      Array.prototype.slice.call(btns).forEach(function (btn) {
        btn.addEventListener("click", function () {
          lightbox.open(
            btn.getAttribute("data-src"),
            btn.getAttribute("data-caption"),
          );
        });
      });
    }

    function loadPhaseAttachments(recordID, phase, attachEl) {
      Promise.all([
        fetchIndicatorHTML(recordID, phase.fileInd),
        fetchIndicatorHTML(recordID, phase.imageInd),
      ])
        .then(function (results) {
          var fileData = parseAttachmentsFromHTML(results[0]);
          var imageData = parseAttachmentsFromHTML(results[1]);

          var combined = {
            images: imageData.images,
            files: fileData.files,
          };

          buildAttachmentSection(attachEl, combined.images, combined.files);
        })
        .catch(function () {
          attachEl.style.display = "none";
        });
    }

    /* ============================================================
     renderProgressBar
     ============================================================ */
    function renderProgressBar(activeStep) {
      var track = byId("co-progress-track");
      track.innerHTML = "";

      var total = CONFIG.phases.length;
      var fraction = total > 1 ? (activeStep - 1) / (total - 1) : 0;
      track.style.setProperty("--co-progress-pct", fraction * 100 + "%");

      CONFIG.phases.forEach(function (phase) {
        var state = stepState(phase.step, activeStep);
        var stateWord = {
          complete: "Completed",
          active: "Current phase",
          upcoming: "Upcoming",
        }[state];

        var li = document.createElement("li");
        li.className = "co-step co-step--" + state;
        li.setAttribute("aria-label", phase.label + " \u2014 " + stateWord);
        if (state === "active") li.setAttribute("aria-current", "step");

        var circleInner =
          state === "complete"
            ? '<span aria-hidden="true">&#10003;</span>'
            : '<span aria-hidden="true">' + phase.step + "</span>";

        li.innerHTML =
          '<div class="co-step-circle" aria-hidden="true">' +
          circleInner +
          "</div>" +
          '<span class="co-step-label" aria-hidden="true">' +
          esc(phase.label) +
          "</span>";

        track.appendChild(li);
      });
    }

    /* ============================================================
     renderPhaseDetails
     ============================================================ */
    function renderPhaseDetails(recordID, activeStep, contents) {
      var container = byId("co-phase-details");
      container.innerHTML = "";

      var completedWithContentCount = 0;

      CONFIG.phases.forEach(function (phase) {
        var state = stepState(phase.step, activeStep);
        var content = contents[phase.key] || "";

        var article = document.createElement("article");
        article.className = "co-phase co-phase--" + state;

        var numberInner =
          state === "complete"
            ? '<span aria-hidden="true">&#10003;</span>'
            : '<span aria-hidden="true">' + phase.step + "</span>";

        var badgeHtml = "";
        if (state === "complete") {
          badgeHtml =
            '<span class="co-phase-badge" aria-hidden="true">Complete</span>';
        } else if (state === "active") {
          badgeHtml =
            '<span class="co-phase-badge" aria-hidden="true">In Progress</span>';
        }

        var chevronHtml =
          '<svg class="co-phase-chevron" viewBox="0 0 18 18" fill="none" aria-hidden="true" focusable="false">' +
          '<path d="M4.5 6.75L9 11.25L13.5 6.75" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>' +
          "</svg>";

        var contentHtml = content.trim()
          ? '<p class="co-phase-content"></p>'
          : '<p class="co-phase-content co-phase-placeholder" aria-label="' +
            esc(phase.label) +
            ' phase: Details coming soon">' +
            '<span aria-hidden="true">Details coming soon</span></p>';

        /* v3: phase-body wraps both text and attachment placeholder */
        article.innerHTML =
          '<div class="co-phase-header">' +
          '<div class="co-phase-number" aria-hidden="true">' +
          numberInner +
          "</div>" +
          '<h3 class="co-phase-title">Phase ' +
          phase.step +
          " \u2014 " +
          esc(phase.label) +
          "</h3>" +
          badgeHtml +
          chevronHtml +
          "</div>" +
          '<div class="co-phase-body">' +
          contentHtml +
          '<div class="co-attachments" style="display:none">' +
          '<p class="co-attach-loading">Loading attachments\u2026</p>' +
          "</div>" +
          "</div>";

        if (content.trim()) {
          var contentEl = article.querySelector(".co-phase-content");
          if (contentEl) contentEl.textContent = decodeEntities(content);
        }

        /* Start completed phases collapsed when they have content */
        if (state === "complete" && content.trim()) {
          article.classList.add("co-phase--collapsed");
          completedWithContentCount++;
        }

        /* Wire toggle on completed phase headers */
        if (state === "complete") {
          var header = article.querySelector(".co-phase-header");
          if (header) {
            header.setAttribute("role", "button");
            header.setAttribute("tabindex", "0");
            header.setAttribute(
              "aria-expanded",
              article.classList.contains("co-phase--collapsed")
                ? "false"
                : "true",
            );
            header.setAttribute(
              "aria-label",
              "Phase " +
                phase.step +
                " \u2014 " +
                phase.label +
                ": click to expand",
            );

            (function (art, hdr) {
              hdr.addEventListener("click", function () {
                togglePhase(art, hdr);
              });
              hdr.addEventListener("keydown", function (e) {
                if (e.key === "Enter" || e.key === " ") {
                  e.preventDefault();
                  togglePhase(art, hdr);
                }
              });
            })(article, header);
          }
        }

        container.appendChild(article);

        /* v3: kick off attachment loading for this phase */
        var attachEl = article.querySelector(".co-attachments");
        loadPhaseAttachments(recordID, phase, attachEl);
      });

      if (completedWithContentCount > 0) {
        showEl("co-phases-toolbar");
        syncToggleAllLabel();
        wireToggleAllButton(container);
      }
    }

    /* ============================================================
     Collapse / expand helpers
     ============================================================ */
    function togglePhase(article, header) {
      var isCollapsed = article.classList.contains("co-phase--collapsed");
      var titleEl = article.querySelector(".co-phase-title");
      var label = titleEl ? titleEl.textContent : "Phase";

      if (isCollapsed) {
        article.classList.remove("co-phase--collapsed");
        header.setAttribute("aria-expanded", "true");
        header.setAttribute("aria-label", label + ": click to collapse");
      } else {
        article.classList.add("co-phase--collapsed");
        header.setAttribute("aria-expanded", "false");
        header.setAttribute("aria-label", label + ": click to expand");
      }

      syncToggleAllLabel();
    }

    function wireToggleAllButton(container) {
      var btn = byId("co-toggle-completed-btn");
      if (!btn) return;

      btn.addEventListener("click", function () {
        var completedPhases = container.querySelectorAll(".co-phase--complete");
        var anyExpanded = false;
        completedPhases.forEach(function (p) {
          if (!p.classList.contains("co-phase--collapsed")) anyExpanded = true;
        });

        completedPhases.forEach(function (p) {
          var hdr = p.querySelector(".co-phase-header");
          var titleEl = p.querySelector(".co-phase-title");
          var lbl = titleEl ? titleEl.textContent : "Phase";

          if (anyExpanded) {
            p.classList.add("co-phase--collapsed");
            if (hdr) {
              hdr.setAttribute("aria-expanded", "false");
              hdr.setAttribute("aria-label", lbl + ": click to expand");
            }
          } else {
            p.classList.remove("co-phase--collapsed");
            if (hdr) {
              hdr.setAttribute("aria-expanded", "true");
              hdr.setAttribute("aria-label", lbl + ": click to collapse");
            }
          }
        });

        syncToggleAllLabel();
      });
    }

    function syncToggleAllLabel() {
      var btn = byId("co-toggle-completed-btn");
      var labelEl = byId("co-toggle-completed-label");
      if (!btn || !labelEl) return;

      var container = byId("co-phase-details");
      if (!container) return;

      var anyExpanded = false;
      container.querySelectorAll(".co-phase--complete").forEach(function (p) {
        if (!p.classList.contains("co-phase--collapsed")) anyExpanded = true;
      });

      if (anyExpanded) {
        labelEl.textContent = "Hide completed phases";
        btn.setAttribute("aria-expanded", "true");
      } else {
        labelEl.textContent = "Show completed phases";
        btn.setAttribute("aria-expanded", "false");
      }
    }

    /* ============================================================
     fetchProjectData
     ============================================================ */
    function fetchProjectData(recordID) {
      var inds = CONFIG.indicators;
      var getData = [
        String(inds.projectName),
        String(inds.projectType),
        String(inds.objective),
        String(inds.poc),
        String(inds.servicePoc),
        String(inds.currentPhase),
        String(inds.phase1),
        String(inds.phase2),
        String(inds.phase3),
        String(inds.phase4),
        String(inds.phase5),
      ];

      var q = JSON.stringify({
        terms: [
          {
            id: "recordIDs",
            operator: "=",
            match: String(recordID),
            gate: "AND",
          },
        ],
        joins: [],
        sort: {},
        getData: getData,
      });

      return fetch(
        getAPIBase() +
          "/api/form/query?q=" +
          encodeURIComponent(q) +
          "&x-filterData=recordID",
        {
          credentials: "include",
          headers: {
            Accept: "application/json",
            "x-requested-with": "XMLHttpRequest",
          },
        },
      )
        .then(function (r) {
          if (!r.ok) throw new Error("Query failed HTTP " + r.status);
          return r.json();
        })
        .then(function (data) {
          if (CONFIG.debug) {
            dbg("API response keys: " + Object.keys(data || {}).join(", "));
            dbg("Full response: " + JSON.stringify(data).slice(0, 500));
          }
          var rec = data && data[String(recordID)];
          if (!rec) {
            if (CONFIG.debug)
              dbg(
                "ERROR: No record found for ID " +
                  recordID +
                  ". Keys in response: " +
                  Object.keys(data || {}).join(", "),
              );
            throw new Error("No record found for ID " + recordID);
          }
          var s1 = rec.s1 || rec;
          if (CONFIG.debug) dbg("s1 keys: " + Object.keys(s1).join(", "));
          return { s1: s1 };
        });
    }

    /* ============================================================
     Main
     ============================================================ */
    function init() {
      var recordID = getRecordIDFromURL();

      if (CONFIG.debug) {
        dbg("=== CustomerOverview v3 Debug ===");
        dbg("window.location.href: " + window.location.href);
        try {
          dbg("parent.location.href: " + window.parent.location.href);
        } catch (e) {
          dbg("parent.location.href: (cross-origin)");
        }
        dbg("recordID resolved to: " + (recordID || "(empty)"));
        dbg("API base: " + getAPIBase());
      }

      if (!recordID) {
        showError(
          "No project specified. Please check the link — it should include a record ID (e.g., ?a=1234).",
        );
        return;
      }

      lightbox.init();
      wireShareButton();
      showLoading();

      fetchProjectData(recordID)
        .then(function (result) {
          var s1 = result.s1;
          var inds = CONFIG.indicators;

          var projectName = getField(s1, inds.projectName);
          var projectType = getField(s1, inds.projectType);
          var currentPhase = getField(s1, inds.currentPhase);
          var phaseContents = {
            phase1: getField(s1, inds.phase1),
            phase2: getField(s1, inds.phase2),
            phase3: getField(s1, inds.phase3),
            phase4: getField(s1, inds.phase4),
            phase5: getField(s1, inds.phase5),
          };

          var activeStep = resolveActiveStep(currentPhase);

          /* ---- Header: name + type + blurb ---- */
          byId("co-project-name").textContent =
            projectName || "Project Details";

          var typeEl = byId("co-project-type");
          if (projectType) {
            typeEl.innerHTML =
              '<strong class="co-project-label">Project Type:</strong> ' +
              esc(projectType);
            typeEl.style.display = "";
          } else {
            typeEl.style.display = "none";
          }

          /* v3: italicized project type blurb — only for known types */
          var blurbEl = byId("co-project-type-blurb");
          var blurbKey = projectType ? projectType.toLowerCase().trim() : "";
          var blurbText = CONFIG.PROJECT_TYPE_BLURBS[blurbKey] || "";
          if (blurbText && blurbEl) {
            blurbEl.textContent = blurbText;
            blurbEl.style.display = "";
          } else if (blurbEl) {
            blurbEl.style.display = "none";
          }

          /* objective line — indicatorID 86 */
          var objective = getField(s1, inds.objective);
          var objectiveEl = byId("co-project-objective");
          if (objective && objectiveEl) {
            objectiveEl.innerHTML =
              '<strong class="co-project-label">Objective:</strong> ' +
              esc(objective);
            objectiveEl.style.display = "";
          } else if (objectiveEl) {
            objectiveEl.style.display = "none";
          }

          /* ---- Helper: render a POC row from _orgchart metadata ---- */
          function renderPocEl(el, indID, label) {
            var rawVal = s1["id" + String(indID)];
            var orgMeta = s1["id" + String(indID) + "_orgchart"];

            if (CONFIG.debug) {
              dbg(label + " raw (id" + indID + "): " + JSON.stringify(rawVal));
              dbg(label + " orgchart meta: " + JSON.stringify(orgMeta));
            }

            /*
             * All data we need is already in _orgchart:
             * { empUID, email, firstName, middleName, lastName, userName }
             * No secondary fetch required.
             */
            var displayName = "";
            var email = "";

            if (orgMeta) {
              var parts = [orgMeta.firstName, orgMeta.lastName]
                .map(function (p) {
                  return (p || "").trim();
                })
                .filter(Boolean);
              displayName = parts.join(" ");
              email = (orgMeta.email || "").trim();
            }

            /* Fall back to the plain stored value if orgchart gave us nothing */
            if (!displayName)
              displayName = decodeEntities(String(rawVal || "").trim());

            if (!displayName) {
              el.style.display = "none";
              return;
            }

            var pocContent;
            if (email) {
              pocContent =
                '<strong class="co-project-label">' +
                label +
                ":</strong> " +
                '<a class="co-poc-link"' +
                '   href="mailto:' +
                esc(email) +
                '"' +
                '   aria-label="Email ' +
                esc(displayName) +
                " at " +
                esc(email) +
                '">' +
                esc(displayName) +
                "</a>";
            } else {
              pocContent =
                '<strong class="co-project-label">' +
                label +
                ":</strong> " +
                esc(displayName);
            }

            el.innerHTML = pocContent;
            el.style.display = "";
          }

          /* ---- Render progress bar + phase cards + reveal page ---- */
          renderProgressBar(activeStep);
          renderPhaseDetails(recordID, activeStep, phaseContents);
          showContent();

          /* ---- LEAF POC (indicator 67) ---- */
          var pocEl = byId("co-project-poc");
          if (pocEl) renderPocEl(pocEl, inds.poc, "LEAF POC");

          /* ---- Service POC (indicator 74) ---- */
          var servicePocEl = byId("co-service-poc");
          if (servicePocEl)
            renderPocEl(servicePocEl, inds.servicePoc, "Service POC");
        })
        .catch(function (err) {
          console.error("[CustomerOverview] Error loading project data:", err);
          if (CONFIG.debug) dbg("FETCH ERROR: " + err.message);
          showError(
            "Unable to load project data. Please try again later or contact support." +
              (CONFIG.debug ? "\n\nDebug: " + err.message : ""),
          );
        });
    }

    /* ============================================================
     wireShareButton
     Copies the current page URL to the clipboard on click and
     shows a brief "Copied!" confirmation toast beneath the button.
     ============================================================ */
    function wireShareButton() {
      var btn = document.getElementById("co-share-btn");
      var toast = document.getElementById("co-share-toast");
      if (!btn || !toast) return;

      var toastTimer = null;

      btn.addEventListener("click", function () {
        var url = window.location.href;

        function showToast(msg) {
          toast.textContent = msg;
          if (toastTimer) clearTimeout(toastTimer);
          toastTimer = setTimeout(function () {
            toast.textContent = "";
          }, 2500);
        }

        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard
            .writeText(url)
            .then(function () {
              showToast("Copied!");
            })
            .catch(function () {
              fallbackCopy(url, showToast);
            });
        } else {
          fallbackCopy(url, showToast);
        }
      });

      function fallbackCopy(url, showToast) {
        try {
          var ta = document.createElement("textarea");
          ta.value = url;
          ta.style.cssText =
            "position:fixed;top:-9999px;left:-9999px;opacity:0;";
          document.body.appendChild(ta);
          ta.focus();
          ta.select();
          var ok = document.execCommand("copy");
          document.body.removeChild(ta);
          showToast(ok ? "Copied!" : "Copy failed");
        } catch (e) {
          showToast("Copy failed");
        }
      }
    }

    /* ============================================================
     wireJumpToTop
     Mirrors the dashboard pattern — shows the button only when the
     page is scrollable AND the user has scrolled down > 120px.
     ============================================================ */
    function wireJumpToTop() {
      var btn = document.getElementById("co-jump-top");
      if (!btn) return;

      function setVisible(visible) {
        btn.classList.toggle("is-visible", visible);
        btn.setAttribute("aria-hidden", String(!visible));
        btn.tabIndex = visible ? 0 : -1;
      }

      function updateVisibility() {
        var scrollTop =
          window.pageYOffset || document.documentElement.scrollTop;
        var scrollHeight = Math.max(
          document.body.scrollHeight,
          document.documentElement.scrollHeight,
        );
        var clientHeight =
          window.innerHeight || document.documentElement.clientHeight;
        var needsScroll = scrollHeight - clientHeight > 80;
        setVisible(needsScroll && scrollTop > 120);
      }

      btn.addEventListener("click", function () {
        window.scrollTo({ top: 0, behavior: "smooth" });
      });

      window.addEventListener("scroll", updateVisibility, { passive: true });
      window.addEventListener("resize", updateVisibility);
      updateVisibility();
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", function () {
        init();
        wireJumpToTop();
      });
    } else {
      init();
      wireJumpToTop();
    }
  })();
</script>
