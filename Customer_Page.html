<style>
  #hub *,
  #hub *::before,
  #hub *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  #hub {
    font-family:
      -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    max-width: 900px;
    margin: 0 auto;
    padding: 24px;
    color: #1b1b1b;
    line-height: 1.5;
    position: relative;
  }

  #hub .hub-skip-link {
    position: absolute;
    left: -9999px;
    top: 0;
    width: 1px;
    height: 1px;
    overflow: hidden;
    z-index: -999;
    background: #003f72;
    color: #ffffff;
    padding: 10px 20px;
    text-decoration: underline;
    font-weight: 600;
    font-size: 0.9375rem;
    border-radius: 0 0 4px 0;
    white-space: nowrap;
  }

  #hub .hub-skip-link:focus {
    position: absolute;
    left: 0;
    top: 0;
    width: auto;
    height: auto;
    overflow: visible;
    z-index: 9999;
    outline: 3px solid #ffffff;
    outline-offset: 2px;
  }

  #hub .hub-sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  #hub .hub-loading {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 64px 24px;
    gap: 16px;
    color: #3d4551;
    font-size: 1rem;
  }

  #hub .hub-spinner {
    width: 44px;
    height: 44px;
    border: 4px solid #d6d7d9;
    border-top-color: #0071bb;
    border-radius: 50%;
    animation: hub-spin 0.75s linear infinite;
  }

  @keyframes hub-spin {
    to {
      transform: rotate(360deg);
    }
  }

  #hub .hub-error {
    background: #fff3f3;
    border: 1px solid #b51d1d;
    border-left: 5px solid #b51d1d;
    border-radius: 4px;
    padding: 20px 24px;
    color: #4a0101;
    font-size: 1rem;
    font-weight: 500;
    line-height: 1.5;
  }

  #hub .hub-header {
    margin-bottom: 36px;
    padding-bottom: 24px;
    border-bottom: 2px solid #dfe1e2;
  }

  #hub .hub-project-name {
    font-size: 2rem;
    font-weight: 700;
    color: #003f72;
    margin-bottom: 6px;
    line-height: 1.2;
  }

  #hub .hub-project-type {
    font-size: 1rem;
    color: #3d4551;
    margin-bottom: 6px;
  }

  #hub .hub-project-poc {
    font-size: 1rem;
    color: #3d4551;
    margin-bottom: 12px;
  }

  #hub .hub-project-label {
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  #hub .hub-progress-section {
    margin-bottom: 40px;
  }

  #hub .hub-progress-heading {
    font-size: 1.25rem;
    font-weight: 700;
    color: #003f72;
    margin-bottom: 28px;
  }

  #hub .hub-progress-nav {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }

  #hub .hub-progress-track {
    position: relative;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    list-style: none;
    min-width: 320px;
    padding-bottom: 4px;
  }

  #hub .hub-progress-track::before {
    content: "";
    position: absolute;
    top: 20px;
    left: 10%;
    right: 10%;
    height: 3px;
    background: #a9aeb1;
    z-index: 0;
  }

  #hub .hub-step {
    display: flex;
    flex-direction: column;
    align-items: center;
    flex: 1;
    position: relative;
    z-index: 1;
    gap: 6px;
  }

  #hub .hub-step-circle {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 3px solid #a9aeb1;
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    font-weight: 700;
    color: #3d4551;
    flex-shrink: 0;
  }

  #hub .hub-step-label {
    font-size: 0.75rem;
    font-weight: 500;
    color: #3d4551;
    text-align: center;
    max-width: 80px;
    line-height: 1.3;
  }

  #hub .hub-step--complete .hub-step-circle {
    background: #1a7a4a;
    border-color: #1a7a4a;
    color: #ffffff !important;
  }

  #hub .hub-step--complete .hub-step-circle span,
  #hub .hub-step--complete .hub-step-circle * {
    color: #ffffff !important;
  }

  #hub .hub-step--complete .hub-step-label {
    color: #1b1b1b;
  }

  #hub .hub-step--active .hub-step-circle {
    background: #003f72 !important;
    border-color: #003f72 !important;
    color: #ffffff !important;
    box-shadow: 0 0 0 4px #cce0f5;
  }

  #hub .hub-step--active .hub-step-circle span,
  #hub .hub-step--active .hub-step-circle * {
    color: #ffffff !important;
  }

  #hub .hub-step--active .hub-step-label {
    font-weight: 700;
    color: #003f72;
  }

  #hub .hub-step--upcoming .hub-step-circle {
    background: #f0f0f0;
    border-color: #a9aeb1;
    color: #3d4551;
  }

  #hub .hub-step--upcoming .hub-step-label {
    color: #71767a;
  }

  #hub .hub-phases-section {
    margin-top: 8px;
  }

  #hub .hub-phases-heading {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;

  #hub .hub-phases {
    display: flex;
    flex-direction: column;

  #hub .hub-phase {
    background: #ffffff;

    border-radius: 6px;
    padding: 20px 24px;
  }

  #hub .hub-phase--complete {
    border-color: #d6d7d9;
    background: #fafafa;
  }

  #hub .hub-phase--active {
    border-left: 5px solid #0071bb;
    background: #f0f7ff;
    border-color: #b5d0eb;
    padding-left: 20px;
  }

  #hub .hub-phase--upcoming {
    background: #fafafa;
    border-color: #e6e6e6;
  }

  #hub .hub-phase-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
  }

  #hub .hub-phase-number {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    font-size: 0.875rem;
    font-weight: 700;
    flex-shrink: 0;
  }

  #hub .hub-phase--complete .hub-phase-number {
    background: #1a7a4a;
    color: #ffffff !important;
  }

  #hub .hub-phase--complete .hub-phase-number span,
  #hub .hub-phase--complete .hub-phase-number * {
    color: #ffffff !important;
  }

  #hub .hub-phase--active .hub-phase-number {
    background: #003f72;
    color: #ffffff !important;
  }

  #hub .hub-phase--active .hub-phase-number span,
  #hub .hub-phase--active .hub-phase-number * {
    color: #ffffff !important;
  }

  #hub .hub-phase--upcoming .hub-phase-number {
    background: #71767a;
    color: #ffffff !important;
  }

  #hub .hub-phase--upcoming .hub-phase-number span,
  #hub .hub-phase--upcoming .hub-phase-number * {
    color: #ffffff !important;
  }

  #hub .hub-phase-title {
    font-size: 1.075rem;
    font-weight: 600;
    color: #1b1b1b;
    flex: 1;
  }

  #hub .hub-phase--upcoming .hub-phase-title {
    color: #3d4551;
  }

  #hub .hub-phase-badge {
    font-size: 0.725rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 3px 10px;
    border-radius: 20px;
    flex-shrink: 0;
  }

  #hub .hub-phase--complete .hub-phase-badge {
    background: #e5f5ed;
    color: #1a7a4a;
    border: 1px solid #1a7a4a;
  }

  #hub .hub-phase--active .hub-phase-badge {
    background: #ddeeff;
    color: #003f72;
    border: 1px solid #0071bb;
  }

  #hub .hub-phase-content {
    font-size: 0.9375rem;
    color: #1b1b1b;
    line-height: 1.65;
    white-space: pre-wrap;
    word-break: break-word;
  }

  #hub .hub-phase--complete .hub-phase-content {
    color: #3d4551;
  }

  #hub .hub-phase--upcoming .hub-phase-content {
    color: #3d4551;
  }

  #hub .hub-phase-placeholder {
    font-style: italic;
    color: #71767a;
    font-size: 0.9375rem;
  }

  #hub a:focus-visible {
    outline: 3px solid #0071bb;
    outline-offset: 3px;
    border-radius: 2px;
  }

  @media (max-width: 640px) {
    #hub {
      padding: 16px;
    }

    #hub .hub-project-name {
      font-size: 1.5rem;
    }

    #hub .hub-step-circle {
      width: 34px;
      height: 34px;
      font-size: 0.875rem;
    }

    #hub .hub-progress-track::before {
      top: 17px;
    }

    #hub .hub-step-label {
      font-size: 0.65rem;
      max-width: 60px;
    }

    #hub .hub-phase {
      padding: 14px 16px;
    }

    #hub .hub-phase--active {
      padding-left: 14px;
    }

    #hub .hub-phase-title {
      font-size: 1rem;
    }

    #hub .hub-phase-badge {
      display: none;
    }
  }
</style>

<div id="hub" lang="en">
  <a class="hub-skip-link" href="#hub-phase-details">Skip to phase details</a>

  <div
    id="hub-live-polite"
    class="hub-sr-only"
    aria-live="polite"
    aria-atomic="true"
  ></div>
  <div
    id="hub-live-assertive"
    class="hub-sr-only"
    aria-live="assertive"
    aria-atomic="true"
  ></div>

  <div
    id="hub-loading"
    class="hub-loading"
    role="status"
    aria-label="Loading project data"
  >
    <div class="hub-spinner" aria-hidden="true"></div>
    <p id="hub-loading-message">Loading project data…</p>
  </div>

  <div
    id="hub-error"
    class="hub-error"
    role="alert"
    style="display: none"
  ></div>

  <div id="hub-content" style="display: none">
    <header class="hub-header">
      <h1 id="hub-project-name" class="hub-project-name"></h1>
      <p id="hub-project-type" class="hub-project-type"></p>
      <p id="hub-project-poc" class="hub-project-poc"></p>
    </header>

    <section
      class="hub-progress-section"
      aria-labelledby="hub-progress-heading"
    >
      <h2 id="hub-progress-heading" class="hub-progress-heading">
        Project Phases
      </h2>
      <nav class="hub-progress-nav" aria-label="Project phases">
        <ol id="hub-progress-track" class="hub-progress-track"></ol>
      </nav>
    </section>

    <section class="hub-phases-section" aria-labelledby="hub-phases-heading">
      <h2 id="hub-phases-heading" class="hub-phases-heading">Phase Details</h2>
      <div id="hub-phase-details" class="hub-phases"></div>
    </section>
  </div>
</div>

<script>
  (function () {
    "use strict";

    const CONFIG = {
      debug: false,

      categoryID: "55445",

      indicators: {
        projectName: 59, // Project Name
        projectType: 60, // Project Type
        poc: 67, // LEAF POC
        currentPhase: 61, // Current Phase (dropdown)
        phase1: 62, // Phase 1: Discovery
        phase2: 63, // Phase 2: Planning
        phase3: 64, // Phase 3: Execution
        phase4: 65, // Phase 4: Launch
        phase5: 66, // Phase 5: Monitoring
      },

      phases: [
        { step: 1, label: "Discovery", key: "phase1" },
        { step: 2, label: "Planning", key: "phase2" },
        { step: 3, label: "Execution", key: "phase3" },
        { step: 4, label: "Launch", key: "phase4" },
        { step: 5, label: "Monitoring", key: "phase5" },
      ],

      // Maps raw LEAF dropdown values for currentPhase to step numbers 1–5.
      // Set debug: true and check the console to verify these match your field values.
      phaseValueMap: {
        discovery: 1,
        planning: 2,
        execution: 3,
        launch: 4,
        monitoring: 5,
      },
    };

    const byId = (id) => document.getElementById(id);

    function esc(str) {
      if (str == null) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function announce(message, assertive) {
      const node = byId(assertive ? "hub-live-assertive" : "hub-live-polite");
      if (!node) return;
      node.textContent = "";
      setTimeout(() => {
        node.textContent = message;
      }, 60);
    }

    function decodeEntities(str) {
      if (!str || typeof str !== "string") return str;
      return str
        .replace(/&amp;/g, "&")
        .replace(/&lt;/g, "<")
        .replace(/&gt;/g, ">")
        .replace(/&quot;/g, '"')
        .replace(/&#039;/g, "'")
        .replace(/&#39;/g, "'")
        .replace(/&#x27;/g, "'")
        .replace(/&apos;/g, "'");
    }

    // Reads the record ID from the URL hash: /projects/report.php?a=hub#590
    // LEAF uses ?a= to load this template; the hash carries the record ID.
    function getRecordIDFromHash() {
      const hash = window.location.hash.replace("#", "").trim();
      return /^\d+$/.test(hash) ? hash : "";
    }

    function showEl(id) {
      const el = byId(id);
      if (el) el.style.display = "";
    }

    function hideEl(id) {
      const el = byId(id);
      if (el) el.style.display = "none";
    }

    function showLoading(message = "Loading project data…") {
      const msgEl = byId("hub-loading-message");
      if (msgEl) msgEl.textContent = message;
      showEl("hub-loading");
      hideEl("hub-error");
      hideEl("hub-content");
    }

    function showError(message) {
      hideEl("hub-loading");
      hideEl("hub-content");
      const errEl = byId("hub-error");
      errEl.textContent = message;
      showEl("hub-error");
      announce(message, true);
    }

    function showContent() {
      hideEl("hub-loading");
      hideEl("hub-error");
      showEl("hub-content");
      announce("Project data loaded.", false);
    }

    // LEAF stores s1 values keyed as 'id' + indicatorID
    function getField(s1, indicatorID) {
      if (!s1) return "";
      const key = `id${indicatorID}`;
      const v = s1[key];
      if (v == null) return "";
      return decodeEntities(String(v).trim());
    }

    function stepState(stepNumber, activeStep) {
      if (stepNumber < activeStep) return "complete";
      if (stepNumber === activeStep) return "active";
      return "upcoming";
    }

    function resolveActiveStep(raw) {
      if (!raw) return 1;
      const norm = String(raw).toLowerCase().trim();

      if (Object.prototype.hasOwnProperty.call(CONFIG.phaseValueMap, norm)) {
        return CONFIG.phaseValueMap[norm];
      }

      // Partial match — handles values like "Phase 2 - Planning"
      const keys = Object.keys(CONFIG.phaseValueMap);
      for (const key of keys) {
        if (norm.includes(key) || key.includes(norm)) {
          return CONFIG.phaseValueMap[key];
        }
      }

      if (CONFIG.debug) {
        console.warn("[Hub] Unrecognized phase value:", JSON.stringify(raw));
        console.warn("[Hub] Expected one of:", keys);
      }
      return 1;
    }

    function renderProgressBar(activeStep) {
      const track = byId("hub-progress-track");
      track.innerHTML = "";

      for (const phase of CONFIG.phases) {
        const state = stepState(phase.step, activeStep);
        const stateWord = {
          complete: "Completed",
          active: "Current phase",
          upcoming: "Upcoming",
        }[state];

        const li = document.createElement("li");
        li.className = `hub-step hub-step--${state}`;
        li.setAttribute("aria-label", `${phase.label} — ${stateWord}`);
        if (state === "active") li.setAttribute("aria-current", "step");

        const circleInner =
          state === "complete"
            ? `<span aria-hidden="true">&#10003;</span>`
            : `<span aria-hidden="true">${phase.step}</span>`;

        li.innerHTML = `
          <div class="hub-step-circle" aria-hidden="true">${circleInner}</div>
          <span class="hub-step-label" aria-hidden="true">${esc(phase.label)}</span>
        `;

        track.appendChild(li);
      }
    }

    function renderPhaseDetails(activeStep, contents) {
      const container = byId("hub-phase-details");
      container.innerHTML = "";

      for (const phase of CONFIG.phases) {
        const state = stepState(phase.step, activeStep);
        const content = contents[phase.key] || "";

        const article = document.createElement("article");
        article.className = `hub-phase hub-phase--${state}`;

        const numberInner =
          state === "complete"
            ? `<span aria-hidden="true">&#10003;</span>`
            : `<span aria-hidden="true">${phase.step}</span>`;

        const badgeHtml =
          state === "complete"
            ? `<span class="hub-phase-badge" aria-hidden="true">Complete</span>`
            : "";

        const contentHtml = content.trim()
          ? `<p class="hub-phase-content"></p>`
          : `<p class="hub-phase-content hub-phase-placeholder"
               aria-label="${esc(phase.label)} phase: Details coming soon">
               <span aria-hidden="true">Details coming soon</span>
             </p>`;

        article.innerHTML = `
          <div class="hub-phase-header">
            <div class="hub-phase-number" aria-hidden="true">${numberInner}</div>
            <h3 class="hub-phase-title">Phase ${phase.step} — ${esc(phase.label)}</h3>
            ${badgeHtml}
          </div>
          ${contentHtml}
        `;

        // Set phase text via textContent AFTER building innerHTML to prevent
        // LEAF's pre-encoded entities (&#039; &amp; etc.) from double-encoding.
        if (content.trim()) {
          const contentEl = article.querySelector(".hub-phase-content");
          if (contentEl) contentEl.textContent = decodeEntities(content);
        }

        container.appendChild(article);
      }
    }

    // Uses LeafFormQuery (globally available on LEAF sites) to fetch all
    // indicator values for a single record. Resolves to the raw s1 object.
    // onProgress is best-effort UI feedback — may not fire on single-record queries.
    async function fetchProjectData(recordID) {
      const inds = CONFIG.indicators;
      const query = new LeafFormQuery();

      query.addTerm("recordIDs", "=", String(recordID));
      query.getData([
        inds.projectName,
        inds.projectType,
        inds.poc,
        inds.currentPhase,
        inds.phase1,
        inds.phase2,
        inds.phase3,
        inds.phase4,
        inds.phase5,
      ]);
      query.setExtraParams("&x-filterData=recordID");
      query.onProgress((progress) => {
        const msgEl = byId("hub-loading-message");
        if (msgEl)
          msgEl.textContent = `Loading project data… (${progress}+ records scanned)`;
      });

      const data = await query.execute();

      if (CONFIG.debug) {
        console.log("[Hub] Full API response:", JSON.stringify(data));
        const s1debug = data?.[String(recordID)]?.s1 || {};
        console.log("[Hub] s1 keys:", Object.keys(s1debug));
        console.log(
          `[Hub] projectName  (id${inds.projectName}):`,
          s1debug[`id${inds.projectName}`],
        );
        console.log(
          `[Hub] projectType  (id${inds.projectType}):`,
          s1debug[`id${inds.projectType}`],
        );
        console.log(
          `[Hub] poc          (id${inds.poc}):`,
          s1debug[`id${inds.poc}`],
        );
        console.log(
          `[Hub] currentPhase (id${inds.currentPhase}):`,
          s1debug[`id${inds.currentPhase}`],
        );
        console.log(
          `[Hub] phase1       (id${inds.phase1}):`,
          s1debug[`id${inds.phase1}`],
        );
        console.log(
          `[Hub] phase2       (id${inds.phase2}):`,
          s1debug[`id${inds.phase2}`],
        );
        console.log(
          `[Hub] phase3       (id${inds.phase3}):`,
          s1debug[`id${inds.phase3}`],
        );
        console.log(
          `[Hub] phase4       (id${inds.phase4}):`,
          s1debug[`id${inds.phase4}`],
        );
        console.log(
          `[Hub] phase5       (id${inds.phase5}):`,
          s1debug[`id${inds.phase5}`],
        );
      }

      const rec = data && data[String(recordID)];
      if (!rec) throw new Error(`No record found for ID ${recordID}`);

      return rec.s1 || rec;
    }

    async function init() {
      const recordID = getRecordIDFromHash();

      if (CONFIG.debug) {
        console.log("[Hub] recordID from hash:", recordID);
      }

      if (!recordID) {
        showError(
          "No project ID specified in the URL — please contact your LEAF POC to get your project URL.",
        );
        return;
      }

      showLoading();

      try {
        const s1 = await fetchProjectData(recordID);
        const inds = CONFIG.indicators;

        const projectName = getField(s1, inds.projectName);
        const projectType = getField(s1, inds.projectType);
        const poc = getField(s1, inds.poc);
        const currentPhase = getField(s1, inds.currentPhase);

        const phaseContents = {
          phase1: getField(s1, inds.phase1),
          phase2: getField(s1, inds.phase2),
          phase3: getField(s1, inds.phase3),
          phase4: getField(s1, inds.phase4),
          phase5: getField(s1, inds.phase5),
        };

        const activeStep = resolveActiveStep(currentPhase);

        byId("hub-project-name").textContent = projectName || "Project Details";

        const typeEl = byId("hub-project-type");
        if (projectType) {
          typeEl.innerHTML = `<strong class="hub-project-label">Type:</strong> ${esc(projectType)}`;
          typeEl.style.display = "";
        } else {
          typeEl.style.display = "none";
        }

        const pocEl = byId("hub-project-poc");
        if (poc) {
          pocEl.innerHTML = `<strong class="hub-project-label">LEAF POC:</strong> ${esc(poc)}`;
          pocEl.style.display = "";
        } else {
          pocEl.style.display = "none";
        }

        renderProgressBar(activeStep);
        renderPhaseDetails(activeStep, phaseContents);

        showContent();
      } catch (err) {
        console.error("[Hub] Error loading project data:", err);
        showError(
          "Unable to load project data. Please try again later or contact support.",
        );
      }
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", init);
    } else {
      init();
    }

    window.addEventListener("hashchange", init);
  })();
</script>
