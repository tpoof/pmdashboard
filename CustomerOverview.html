<style>
  /* ============================================================
   CustomerOverview — LEAF Programmer Page
   All styles scoped to #customerOverview to avoid conflicts
   with LEAF's own stylesheet.
   ============================================================ */

  #customerOverview *,
  #customerOverview *::before,
  #customerOverview *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  #customerOverview {
    font-family:
      -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    max-width: 900px;
    margin: 0 auto;
    padding: 24px;
    color: #1b1b1b;
    line-height: 1.5;
    position: relative;
  }

  /* ---- Skip link ---- */
  #customerOverview .co-skip-link {
    position: absolute;
    left: -9999px;
    top: 0;
    width: 1px;
    height: 1px;
    overflow: hidden;
    z-index: -999;
    background: #003f72;
    color: #ffffff;
    padding: 10px 20px;
    text-decoration: underline;
    font-weight: 600;
    font-size: 0.9375rem;
    border-radius: 0 0 4px 0;
    white-space: nowrap;
  }

  #customerOverview .co-skip-link:focus {
    position: absolute;
    left: 0;
    top: 0;
    width: auto;
    height: auto;
    overflow: visible;
    z-index: 9999;
    outline: 3px solid #ffffff;
    outline-offset: 2px;
  }

  /* ---- Visually hidden utility (screen-reader only) ---- */
  #customerOverview .co-sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  /* ============================================================
   Loading state
   ============================================================ */
  #customerOverview .co-loading {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 64px 24px;
    gap: 16px;
    color: #3d4551;
    font-size: 1rem;
  }

  #customerOverview .co-spinner {
    width: 44px;
    height: 44px;
    border: 4px solid #d6d7d9;
    border-top-color: #0071bb;
    border-radius: 50%;
    animation: co-spin 0.75s linear infinite;
  }

  @keyframes co-spin {
    to {
      transform: rotate(360deg);
    }
  }

  /* ============================================================
   Error state
   ============================================================ */
  #customerOverview .co-error {
    background: #fff3f3;
    border: 1px solid #b51d1d;
    border-left: 5px solid #b51d1d;
    border-radius: 4px;
    padding: 20px 24px;
    color: #4a0101;
    font-size: 1rem;
    font-weight: 500;
    line-height: 1.5;
  }

  /* ============================================================
   Page header
   ============================================================ */
  #customerOverview .co-header {
    margin-bottom: 36px;
    padding-bottom: 24px;
    border-bottom: 2px solid #dfe1e2;
  }

  #customerOverview .co-project-name {
    font-size: 2rem;
    font-weight: 700;
    color: #003f72;
    margin-bottom: 6px;
    line-height: 1.2;
  }

  #customerOverview .co-project-type {
    font-size: 1rem;
    color: #3d4551;
    margin-bottom: 6px;
  }

  #customerOverview .co-project-poc {
    font-size: 1rem;
    color: #3d4551;
    margin-bottom: 12px;
  }

  #customerOverview .co-project-label {
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  /* ============================================================
   Progress bar section
   ============================================================ */
  #customerOverview .co-progress-section {
    margin-bottom: 40px;
  }

  #customerOverview .co-progress-heading {
    font-size: 1.25rem;
    font-weight: 700;
    color: #003f72;
    margin-bottom: 28px;
  }

  #customerOverview .co-progress-nav {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }

  #customerOverview .co-progress-track {
    position: relative;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    list-style: none;
    min-width: 320px;
    padding-bottom: 4px;
  }

  /* Horizontal connector line */
  #customerOverview .co-progress-track::before {
    content: "";
    position: absolute;
    top: 20px;
    left: 10%;
    right: 10%;
    height: 3px;
    background: #a9aeb1;
    z-index: 0;
  }

  /* ---- Individual step ---- */
  #customerOverview .co-step {
    display: flex;
    flex-direction: column;
    align-items: center;
    flex: 1;
    position: relative;
    z-index: 1;
    gap: 6px;
  }

  #customerOverview .co-step-circle {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 3px solid #a9aeb1;
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    font-weight: 700;
    color: #3d4551;
    flex-shrink: 0;
  }

  #customerOverview .co-step-label {
    font-size: 0.75rem;
    font-weight: 500;
    color: #3d4551;
    text-align: center;
    max-width: 80px;
    line-height: 1.3;
  }

  /* ---- Complete step ---- */
  #customerOverview .co-step--complete .co-step-circle {
    background: #1a7a4a;
    border-color: #1a7a4a;
    color: #ffffff !important;
  }

  #customerOverview .co-step--complete .co-step-circle span,
  #customerOverview .co-step--complete .co-step-circle * {
    color: #ffffff !important;
  }

  #customerOverview .co-step--complete .co-step-label {
    color: #1b1b1b;
  }

  /* ---- Active step ---- */
  #customerOverview .co-step--active .co-step-circle {
    background: #003f72 !important;
    border-color: #003f72 !important;
    color: #ffffff !important;
    box-shadow: 0 0 0 4px #cce0f5;
  }
  #customerOverview .co-step--active .co-step-circle span,
  #customerOverview .co-step--active .co-step-circle * {
    color: #ffffff !important;
  }

  #customerOverview .co-step--active .co-step-label {
    font-weight: 700;
    color: #003f72;
  }

  /* ---- Upcoming step ---- */
  #customerOverview .co-step--upcoming .co-step-circle {
    background: #f0f0f0;
    border-color: #a9aeb1;
    color: #3d4551;
  }

  #customerOverview .co-step--upcoming .co-step-label {
    color: #71767a;
  }

  /* ============================================================
   Phase detail cards
   ============================================================ */
  #customerOverview .co-phases-section {
    margin-top: 8px;
  }

  #customerOverview .co-phases-heading {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  #customerOverview .co-phases {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  #customerOverview .co-phase {
    background: #ffffff;
    border: 1px solid #dfe1e2;
    border-radius: 6px;
    padding: 20px 24px;
  }

  #customerOverview .co-phase--complete {
    border-color: #d6d7d9;
    background: #fafafa;
  }

  #customerOverview .co-phase--active {
    border-left: 5px solid #0071bb;
    background: #f0f7ff;
    border-color: #b5d0eb;
    padding-left: 20px;
  }

  #customerOverview .co-phase--upcoming {
    background: #fafafa;
    border-color: #e6e6e6;
  }

  #customerOverview .co-phase-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
  }

  #customerOverview .co-phase-number {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    font-size: 0.875rem;
    font-weight: 700;
    flex-shrink: 0;
  }

  #customerOverview .co-phase--complete .co-phase-number {
    background: #1a7a4a;
    color: #ffffff !important;
  }

  #customerOverview .co-phase--complete .co-phase-number span,
  #customerOverview .co-phase--complete .co-phase-number * {
    color: #ffffff !important;
  }

  #customerOverview .co-phase--active .co-phase-number {
    background: #003f72;
    color: #ffffff !important;
  }

  #customerOverview .co-phase--active .co-phase-number span,
  #customerOverview .co-phase--active .co-phase-number * {
    color: #ffffff !important;
  }

  #customerOverview .co-phase--upcoming .co-phase-number {
    background: #71767a;
    color: #ffffff !important;
  }

  #customerOverview .co-phase--upcoming .co-phase-number span,
  #customerOverview .co-phase--upcoming .co-phase-number * {
    color: #ffffff !important;
  }

  #customerOverview .co-phase-title {
    font-size: 1.075rem;
    font-weight: 600;
    color: #1b1b1b;
    flex: 1;
  }

  #customerOverview .co-phase--upcoming .co-phase-title {
    color: #3d4551;
  }

  #customerOverview .co-phase-badge {
    font-size: 0.725rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 3px 10px;
    border-radius: 20px;
    flex-shrink: 0;
  }

  #customerOverview .co-phase--complete .co-phase-badge {
    background: #e5f5ed;
    color: #1a7a4a;
    border: 1px solid #1a7a4a;
  }

  #customerOverview .co-phase--active .co-phase-badge {
    background: #ddeeff;
    color: #003f72;
    border: 1px solid #0071bb;
  }

  #customerOverview .co-phase-content {
    font-size: 0.9375rem;
    color: #1b1b1b;
    line-height: 1.65;
    white-space: pre-wrap;
    word-break: break-word;
  }

  #customerOverview .co-phase--complete .co-phase-content {
    color: #3d4551;
  }

  #customerOverview .co-phase--upcoming .co-phase-content {
    color: #3d4551;
  }

  #customerOverview .co-phase-placeholder {
    font-style: italic;
    color: #71767a;
    font-size: 0.9375rem;
  }

  /* ============================================================
   Focus styles
   ============================================================ */
  #customerOverview a:focus-visible {
    outline: 3px solid #0071bb;
    outline-offset: 3px;
    border-radius: 2px;
  }

  /* ============================================================
   Responsive
   ============================================================ */
  @media (max-width: 640px) {
    #customerOverview {
      padding: 16px;
    }

    #customerOverview .co-project-name {
      font-size: 1.5rem;
    }

    #customerOverview .co-step-circle {
      width: 34px;
      height: 34px;
      font-size: 0.875rem;
    }

    #customerOverview .co-progress-track::before {
      top: 17px;
    }

    #customerOverview .co-step-label {
      font-size: 0.65rem;
      max-width: 60px;
    }

    #customerOverview .co-phase {
      padding: 14px 16px;
    }

    #customerOverview .co-phase--active {
      padding-left: 14px;
    }

    #customerOverview .co-phase-title {
      font-size: 1rem;
    }

    #customerOverview .co-phase-badge {
      display: none;
    }
  }
</style>

<!-- ============================================================
     CustomerOverview — LEAF Programmer page markup
     ============================================================ -->
<div id="customerOverview" lang="en">
  <a class="co-skip-link" href="#co-phase-details">Skip to phase details</a>

  <div
    id="co-live-polite"
    class="co-sr-only"
    aria-live="polite"
    aria-atomic="true"
  ></div>

  <div
    id="co-live-assertive"
    class="co-sr-only"
    aria-live="assertive"
    aria-atomic="true"
  ></div>

  <div
    id="co-loading"
    class="co-loading"
    role="status"
    aria-label="Loading project data"
  >
    <div class="co-spinner" aria-hidden="true"></div>
    <p>Loading project data…</p>
  </div>

  <div id="co-error" class="co-error" role="alert" style="display: none"></div>

  <div id="co-content" style="display: none">
    <header class="co-header">
      <h1 id="co-project-name" class="co-project-name"></h1>
      <p id="co-project-type" class="co-project-type"></p>
      <p id="co-project-poc" class="co-project-poc"></p>
    </header>

    <section class="co-progress-section" aria-labelledby="co-progress-heading">
      <h2 id="co-progress-heading" class="co-progress-heading">
        Project Phases
      </h2>
      <nav class="co-progress-nav" aria-label="Project phases">
        <ol id="co-progress-track" class="co-progress-track"></ol>
      </nav>
    </section>

    <section class="co-phases-section" aria-labelledby="co-phases-heading">
      <h2 id="co-phases-heading" class="co-phases-heading">Phase Details</h2>
      <div id="co-phase-details" class="co-phases"></div>
    </section>
  </div>
</div>

<script>
  (function () {
    "use strict";

    /* ============================================================
     CONFIG
     ============================================================ */
    var CONFIG = {
      debug: true,

      categoryID: "55445",

      indicators: {
        projectName: 59, // Project Name
        projectType: 60, // Project Type
        poc: 67, // LEAF POC
        currentPhase: 61, // Current Phase (dropdown)
        phase1: 62, // Phase 1: Discovery
        phase2: 63, // Phase 2: Planning
        phase3: 64, // Phase 3: Execution
        phase4: 65, // Phase 4: Launch
        phase5: 66, // Phase 5: Monitoring
      },

      phases: [
        { step: 1, label: "Discovery", key: "phase1" },
        { step: 2, label: "Planning", key: "phase2" },
        { step: 3, label: "Execution", key: "phase3" },
        { step: 4, label: "Launch", key: "phase4" },
        { step: 5, label: "Monitoring", key: "phase5" },
      ],

      /*
       * Map the raw dropdown value stored by LEAF for IND_CURRENT_PHASE
       * to a step number 1–5.
       * TODO: verify these match the exact values LEAF stores for that field.
       * Enable CONFIG.debug = true and check the console dump to confirm.
       */
      phaseValueMap: {
        discovery: 1,
        planning: 2,
        execution: 3,
        launch: 4,
        monitoring: 5,
      },
    };

    /* ============================================================
     DOM helpers
     ============================================================ */
    function byId(id) {
      return document.getElementById(id);
    }

    function esc(str) {
      if (str == null) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function announce(message, assertive) {
      var node = byId(assertive ? "co-live-assertive" : "co-live-polite");
      if (!node) return;
      node.textContent = "";
      setTimeout(function () {
        node.textContent = message;
      }, 60);
    }

    /* ============================================================
     Decode HTML entities that LEAF may encode (e.g. &amp; → &)
     Mirrors decodeEntities from project_v16.js
     ============================================================ */
    function decodeEntities(str) {
      if (!str || typeof str !== "string") return str;
      return str
        .replace(/&amp;/g, "&")
        .replace(/&lt;/g, "<")
        .replace(/&gt;/g, ">")
        .replace(/&quot;/g, '"')
        .replace(/&#039;/g, "'")
        .replace(/&#39;/g, "'")
        .replace(/&#x27;/g, "'")
        .replace(/&apos;/g, "'");
    }

    /* ============================================================
     URL helper — reads ?a= for the record ID
     ============================================================ */
    function getRecordIDFromURL() {
      try {
        return new URLSearchParams(window.location.search).get("a") || "";
      } catch (e) {
        var match = window.location.search.match(/[?&]a=([^&]+)/);
        return match ? decodeURIComponent(match[1]) : "";
      }
    }

    /* ============================================================
     State helpers
     ============================================================ */
    function showEl(id) {
      var el = byId(id);
      if (el) el.style.display = "";
    }
    function hideEl(id) {
      var el = byId(id);
      if (el) el.style.display = "none";
    }

    function showLoading() {
      showEl("co-loading");
      hideEl("co-error");
      hideEl("co-content");
    }

    function showError(message) {
      hideEl("co-loading");
      hideEl("co-content");
      var errEl = byId("co-error");
      errEl.textContent = message;
      showEl("co-error");
      announce(message, true);
    }

    function showContent() {
      hideEl("co-loading");
      hideEl("co-error");
      showEl("co-content");
      announce("Project data loaded.", false);
    }

    /* ============================================================
     Extract a field value from s1 using LEAF's keying convention.
     LEAF stores values in s1 as:  s1['id' + indicatorID] = 'raw string'
     This mirrors extractFromS1 in project_v16.js exactly.
     ============================================================ */
    function getField(s1, indicatorID) {
      if (!s1) return "";
      var key = "id" + String(indicatorID);
      var v = s1[key];
      if (v == null) return "";
      return decodeEntities(String(v).trim());
    }

    /* ============================================================
     Phase / step helpers
     ============================================================ */
    function stepState(stepNumber, activeStep) {
      if (stepNumber < activeStep) return "complete";
      if (stepNumber === activeStep) return "active";
      return "upcoming";
    }

    function resolveActiveStep(raw) {
      if (!raw) return 1;
      var norm = String(raw).toLowerCase().trim();

      if (Object.prototype.hasOwnProperty.call(CONFIG.phaseValueMap, norm)) {
        return CONFIG.phaseValueMap[norm];
      }

      // Partial match — handles values like "Phase 2 - Planning"
      var keys = Object.keys(CONFIG.phaseValueMap);
      for (var i = 0; i < keys.length; i++) {
        if (norm.indexOf(keys[i]) !== -1 || keys[i].indexOf(norm) !== -1) {
          return CONFIG.phaseValueMap[keys[i]];
        }
      }

      if (CONFIG.debug) {
        console.warn(
          "[CustomerOverview] Unrecognized phase value:",
          JSON.stringify(raw),
        );
        console.warn(
          "[CustomerOverview] Expected one of:",
          Object.keys(CONFIG.phaseValueMap),
        );
      }
      return 1;
    }

    /* ============================================================
     Date formatting
     ============================================================ */
    function formatDate(dateStr) {
      if (!dateStr) return { iso: "", display: "Unknown" };
      var d = new Date(dateStr);
      if (isNaN(d.getTime())) return { iso: "", display: String(dateStr) };
      return {
        iso: d.toISOString(),
        display: d.toLocaleDateString("en-US", {
          year: "numeric",
          month: "long",
          day: "numeric",
        }),
      };
    }

    /* ============================================================
     Progress bar renderer
     ============================================================ */
    function renderProgressBar(activeStep) {
      var track = byId("co-progress-track");
      track.innerHTML = "";

      CONFIG.phases.forEach(function (phase) {
        var state = stepState(phase.step, activeStep);
        var stateWord = {
          complete: "Completed",
          active: "Current phase",
          upcoming: "Upcoming",
        }[state];

        var li = document.createElement("li");
        li.className = "co-step co-step--" + state;
        li.setAttribute("aria-label", phase.label + " — " + stateWord);
        if (state === "active") li.setAttribute("aria-current", "step");

        // Checkmark for complete, number for active/upcoming
        var circleInner =
          state === "complete"
            ? '<span aria-hidden="true">&#10003;</span>'
            : '<span aria-hidden="true">' + phase.step + "</span>";

        li.innerHTML =
          '<div class="co-step-circle" aria-hidden="true">' +
          circleInner +
          "</div>" +
          '<span class="co-step-label" aria-hidden="true">' +
          esc(phase.label) +
          "</span>";

        track.appendChild(li);
      });
    }

    /* ============================================================
     Phase cards renderer
     ============================================================ */
    function renderPhaseDetails(activeStep, contents) {
      var container = byId("co-phase-details");
      container.innerHTML = "";

      CONFIG.phases.forEach(function (phase) {
        var state = stepState(phase.step, activeStep);
        var content = contents[phase.key] || "";

        var article = document.createElement("article");
        article.className = "co-phase co-phase--" + state;

        // Number badge: checkmark for complete, step number otherwise
        var numberInner =
          state === "complete"
            ? '<span aria-hidden="true">&#10003;</span>'
            : '<span aria-hidden="true">' + phase.step + "</span>";

        // Only show "Complete" badge on completed phases
        var badgeHtml =
          state === "complete"
            ? '<span class="co-phase-badge" aria-hidden="true">Complete</span>'
            : "";

        var contentHtml;
        if (content.trim()) {
          contentHtml = '<p class="co-phase-content"></p>';
        } else {
          contentHtml =
            '<p class="co-phase-content co-phase-placeholder"' +
            ' aria-label="' +
            esc(phase.label) +
            ' phase: Details coming soon">' +
            '<span aria-hidden="true">Details coming soon</span>' +
            "</p>";
        }

        article.innerHTML =
          '<div class="co-phase-header">' +
          '<div class="co-phase-number" aria-hidden="true">' +
          numberInner +
          "</div>" +
          '<h3 class="co-phase-title">Phase ' +
          phase.step +
          " — " +
          esc(phase.label) +
          "</h3>" +
          badgeHtml +
          "</div>" +
          contentHtml;

        // Set phase text via textContent AFTER building innerHTML so LEAF's
        // pre-encoded entities (&#039; &amp; etc.) are never double-encoded.
        // decodeEntities() unwraps whatever LEAF stored; textContent then sets
        // it as a plain string so the browser renders the literal characters.
        if (content.trim()) {
          var contentEl = article.querySelector(".co-phase-content");
          if (contentEl) contentEl.textContent = decodeEntities(content);
        }

        container.appendChild(article);
      });
    }

    /* ============================================================
     fetchProjectData
     Queries api/form/query for all indicator values for one record.
     Resolves to the raw s1 object: { id59: 'value', id60: 'value', … }
     ============================================================ */
    function fetchProjectData(recordID) {
      var inds = CONFIG.indicators;
      var q = JSON.stringify({
        terms: [
          {
            id: "recordIDs",
            operator: "=",
            match: String(recordID),
            gate: "AND",
          },
        ],
        joins: [],
        sort: {},
        getData: [
          String(inds.projectName),
          String(inds.projectType),
          String(inds.poc),
          String(inds.currentPhase),
          String(inds.phase1),
          String(inds.phase2),
          String(inds.phase3),
          String(inds.phase4),
          String(inds.phase5),
        ],
      });

      return fetch(
        "api/form/query?q=" + encodeURIComponent(q) + "&x-filterData=recordID",
        {
          credentials: "include",
          headers: {
            Accept: "application/json",
            "x-requested-with": "XMLHttpRequest",
          },
        },
      )
        .then(function (r) {
          if (!r.ok) throw new Error("Query failed HTTP " + r.status);
          return r.json();
        })
        .then(function (data) {
          if (CONFIG.debug)
            console.log(
              "[CustomerOverview] Full API response:",
              JSON.stringify(data),
            );

          var rec = data && data[String(recordID)];
          if (!rec) throw new Error("No record found for ID " + recordID);

          // LEAF returns indicator data under rec.s1, keyed as 'id' + indicatorID
          var s1 = rec.s1 || rec;

          if (CONFIG.debug) {
            console.log("[CustomerOverview] s1 keys:", Object.keys(s1));
            var inds = CONFIG.indicators;
            console.log(
              "[CustomerOverview] projectName  (id" + inds.projectName + "):",
              s1["id" + inds.projectName],
            );
            console.log(
              "[CustomerOverview] projectType  (id" + inds.projectType + "):",
              s1["id" + inds.projectType],
            );
            console.log(
              "[CustomerOverview] poc          (id" + inds.poc + "):",
              s1["id" + inds.poc],
            );
            console.log(
              "[CustomerOverview] currentPhase (id" + inds.currentPhase + "):",
              s1["id" + inds.currentPhase],
            );
            console.log(
              "[CustomerOverview] phase1       (id" + inds.phase1 + "):",
              s1["id" + inds.phase1],
            );
            console.log(
              "[CustomerOverview] phase2       (id" + inds.phase2 + "):",
              s1["id" + inds.phase2],
            );
            console.log(
              "[CustomerOverview] phase3       (id" + inds.phase3 + "):",
              s1["id" + inds.phase3],

            console.log(

              s1["id" + inds.phase4],

          }

          return s1;
        });
    }

    /* ============================================================
     fetchLastUpdated
     ============================================================ */
    function fetchLastUpdated(recordID) {
      var q = JSON.stringify({
        terms: [
          {
            id: "recordIDs",
            operator: "=",
            match: String(recordID),
            gate: "AND",
          },
        ],
        joins: [],
        sort: {},
        getData: [],
      });

      return fetch(
        "api/form/query?q=" +
          encodeURIComponent(q) +
          "&x-filterData=recordID,lastUpdated",
        {
          credentials: "include",
          headers: {
            Accept: "application/json",
            "x-requested-with": "XMLHttpRequest",
          },
        },
      )
        .then(function (r) {
          return r.json();
        })
        .then(function (data) {
          var rec = data && data[String(recordID)];
          return rec && rec.lastUpdated ? rec.lastUpdated : null;
        })
        .catch(function () {
          return null;
        });
    }

    /* ============================================================
     Main
     ============================================================ */
    function init() {
      var recordID = getRecordIDFromURL();

      if (CONFIG.debug) {
        console.log("--- CustomerOverview Debug ---");
        console.log("recordID from ?a=:", recordID);
      }

      if (!recordID) {
        showError(
          "No project specified. " +
            "Please check the link — it should include a record ID (e.g., ?a=1234).",
        );
        return;
      }

      showLoading();

      Promise.all([fetchProjectData(recordID), fetchLastUpdated(recordID)])
        .then(function (results) {
          var s1 = results[0]; // raw s1 object: { id59: '...', id60: '...', … }
          var lastUpdated = results[1];
          var inds = CONFIG.indicators;

          /* ---- Extract values directly from s1 ---- */
          var projectName = getField(s1, inds.projectName);
          var projectType = getField(s1, inds.projectType);
          var poc = getField(s1, inds.poc);
          var currentPhase = getField(s1, inds.currentPhase);
          var phaseContents = {
            phase1: getField(s1, inds.phase1),
            phase2: getField(s1, inds.phase2),
            phase3: getField(s1, inds.phase3),
            phase4: getField(s1, inds.phase4),
            phase5: getField(s1, inds.phase5),
          };

          var activeStep = resolveActiveStep(currentPhase);
          var dateParts = formatDate(lastUpdated);

          /* ---- Populate header ---- */
          byId("co-project-name").textContent =
            projectName || "Project Details";

          var typeEl = byId("co-project-type");
          if (projectType) {
            typeEl.innerHTML =
              '<strong class="co-project-label">Type:</strong> ' +
              esc(projectType);
            typeEl.style.display = "";
          } else {
            typeEl.style.display = "none";
          }

          var pocEl = byId("co-project-poc");
          if (poc) {
            pocEl.innerHTML =
              '<strong class="co-project-label">LEAF POC:</strong> ' + esc(poc);
            pocEl.style.display = "";
          } else {
            pocEl.style.display = "none";
          }

          /* ---- Render progress bar and phase cards ---- */
          renderProgressBar(activeStep);
          renderPhaseDetails(activeStep, phaseContents);

          showContent();
        })
        .catch(function (err) {
          console.error("[CustomerOverview] Error loading project data:", err);
          showError(
            "Unable to load project data. Please try again later or contact support.",
          );
        });
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", init);
    } else {
      init();
    }
  })();
</script>
