  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

/\n@font-face {\n  font-family: 'Material Symbols Outlined';\n  font-style: normal;\n  font-weight: 400;\n  src: url(\"03f4cd59-4fa0-477f-9649-4f53fde99f54\") format('woff2');\n}\n\n.material-symbols-outlined {\n  font-family: 'Material Symbols Outlined';\n  font-weight: normal;\n  font-style: normal;\n  font-size: 24px;\n  line-height: 1;\n  letter-spacing: normal;\n  text-transform: none;\n  display: inline-block;\n  white-space: nowrap;\n  word-wrap: normal;\n  direction: ltr;\n  -webkit-font-feature-settings: 'liga';\n  -webkit-font-smoothing: antialiased;\n}\n<\u002Fstyle>\n  \n  <style>\n    :root{--navy:#1a4480;--blue:#005ea2;--blue-lt:#eff6fb;--blue-10:#d9e8f6;--blue-20:#aacdec;--green:#2e8540;--amber:#b57f0a;--red:#d54309;--gray5:#f0f0f0;--gray20:#c9c9c9;--text:#1b1b1b;--muted:#3d4551;--r:5px;--r-lg:8px;--max:1200px}\n    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}\n    html{scroll-behavior:smooth}\n    body{background:#eef2f6;font-family:'Source Sans 3',sans-serif;font-size:1rem;color:var(--text);line-height:1.6}\n    .ms{font-family:'Material Symbols Outlined';font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;line-height:1;display:inline-block;user-select:none;font-style:normal;vertical-align:middle;font-size:1.2em}\n\n    /* NAV */\n    .lp-nav{position:sticky;top:0;z-index:300;background:rgba(255,255,255,.97);border-bottom:1px solid transparent;backdrop-filter:blur(8px);transition:border-color .25s,box-shadow .25s}\n    .lp-nav.scrolled{border-color:var(--blue-20);box-shadow:0 2px 16px rgba(0,10,60,.1)}\n    .lp-nav-in{max-width:var(--max);margin:0 auto;padding:0 24px;height:52px;display:flex;align-items:center;gap:8px}\n    .lp-brand{display:flex;align-items:center;gap:8px;text-decoration:none;margin-right:16px}\n    .lp-brand-text{font-family:'Public Sans',sans-serif;font-weight:800;font-size:1.05rem;color:var(--navy);letter-spacing:.04em}\n    .lp-nav-links{display:flex;list-style:none;gap:2px;flex:1}\n    .dd-trigger{display:inline-flex;align-items:center;gap:5px;padding:7px 13px;font-family:'Public Sans',sans-serif;font-size:.9rem;font-weight:600;color:var(--muted);background:transparent;border:none;cursor:pointer;border-radius:var(--r);transition:color .15s,background .15s}\n    .dd-trigger:hover,.dd-item.open .dd-trigger{color:var(--blue);background:var(--blue-lt)}\n    .dd-chevron{font-size:.65rem;transition:transform .2s}\n    .dd-item.open .dd-chevron{transform:rotate(180deg)}\n    .dd-item{position:relative}\n    .dd-panel{position:absolute;top:calc(100% + 6px);left:0;background:#fff;border:1px solid var(--blue-10);border-radius:var(--r-lg);box-shadow:0 8px 32px rgba(0,10,60,.14);min-width:270px;padding:8px;z-index:400}\n    .dd-panel[hidden]{display:none}\n    .dd-list{list-style:none;display:grid;gap:2px}\n    .dd-link{display:flex;align-items:flex-start;gap:12px;padding:10px 12px;border-radius:var(--r);text-decoration:none;color:var(--text);transition:background .15s}\n    .dd-link:hover,.dd-link.is-active{background:var(--blue-lt)}\n    .dd-link-ico{width:34px;height:34px;border-radius:var(--r);flex-shrink:0;background:var(--blue-lt);color:var(--blue);display:flex;align-items:center;justify-content:center}\n    .dd-link-ico .ms{font-size:1.1rem}\n    .dd-link-text strong{display:block;font-family:'Public Sans',sans-serif;font-size:.875rem;font-weight:700;color:var(--navy);margin-bottom:2px}\n    .dd-link-text span{display:block;font-size:.8125rem;color:var(--muted);line-height:1.4}\n    .dd-divider{border:none;border-top:1px solid var(--blue-10);margin:6px 0}\n\n    /* BREADCRUMB */\n    .breadcrumb-bar{background:var(--navy)}\n    .breadcrumb-bar nav{max-width:var(--max);margin:0 auto;padding:10px 24px}\n    .breadcrumb{display:flex;align-items:center;gap:6px;list-style:none;font-family:'Public Sans',sans-serif;font-size:.82rem}\n    .breadcrumb li{display:flex;align-items:center;gap:6px;color:rgba(255,255,255,.65)}\n    .breadcrumb li:last-child{color:#fff;font-weight:600}\n    .breadcrumb a{color:rgba(255,255,255,.75);text-decoration:none}\n    .breadcrumb a:hover{color:#fff;text-decoration:underline}\n\n    /* PAGE HEADER */\n    .page-header{background:#fff;border-bottom:1px solid var(--blue-10)}\n    .page-header-in{max-width:var(--max);margin:0 auto;padding:24px;display:flex;align-items:flex-start;justify-content:space-between;gap:24px}\n    .page-header h1{font-family:'Public Sans',sans-serif;font-size:1.6rem;font-weight:800;color:var(--navy);letter-spacing:-.02em;margin-bottom:4px;display:flex;align-items:center;gap:8px}\n    .page-header h1 .ms{color:var(--blue);font-size:1.5rem}\n    .page-header p{color:var(--muted);font-size:.95rem;max-width:540px}\n\n    /* STATS STRIP */\n    .stats-strip{background:var(--blue-lt);border-bottom:1px solid var(--blue-10)}\n    .stats-strip-in{max-width:var(--max);margin:0 auto;padding:14px 24px;display:flex;gap:0;align-items:stretch}\n    .stat{display:flex;flex-direction:column;padding:0 32px 0 0;border-right:1px solid var(--blue-20)}\n    .stat:first-child{padding-left:0}\n    .stat:last-child{border-right:none}\n    .stat+.stat{padding-left:32px}\n    .stat-val{font-family:'Public Sans',sans-serif;font-size:1.6rem;font-weight:800;color:var(--navy);line-height:1}\n    .stat-lbl{font-size:.78rem;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:.04em}\n\n    /* MAIN LAYOUT */\n    .main-wrap{max-width:var(--max);margin:0 auto;padding:24px;display:grid;grid-template-columns:220px 1fr;gap:24px;align-items:start}\n\n    /* SIDEBAR */\n    .sidebar{display:grid;gap:16px;position:sticky;top:68px}\n    .sidebar-card{background:#fff;border:1px solid var(--blue-10);border-radius:var(--r-lg);overflow:hidden}\n    .sidebar-card-hd{padding:11px 14px;border-bottom:1px solid var(--blue-10);font-family:'Public Sans',sans-serif;font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}\n    .cat-list{list-style:none;padding:7px;display:grid;gap:2px}\n    .cat-item{display:flex;align-items:center;justify-content:space-between;padding:7px 10px;border-radius:var(--r);cursor:pointer;transition:background .15s;font-size:.875rem;color:var(--muted)}\n    .cat-item:hover{background:var(--blue-lt);color:var(--blue)}\n    .cat-item.is-active{background:var(--blue-lt);color:var(--blue);font-weight:600}\n    .cat-item .count{font-size:.72rem;background:var(--blue-10);color:var(--navy);padding:1px 7px;border-radius:999px;font-weight:700;font-family:'Public Sans',sans-serif}\n    .cat-item.is-active .count{background:var(--blue);color:#fff}\n    .my-activity{padding:12px 14px;display:grid;gap:10px}\n    .act-row{display:flex;align-items:center;justify-content:space-between;font-size:.875rem}\n    .act-row .al{color:var(--muted)}\n    .act-row .av{font-family:'Public Sans',sans-serif;font-weight:700;color:var(--navy)}\n\n    /* TAB BAR */\n    .tab-bar{background:#fff;border:1px solid var(--blue-10);border-radius:var(--r-lg);overflow:hidden}\n    .tab-row{display:flex;border-bottom:1px solid var(--blue-10)}\n    .tab-btn{padding:12px 20px;font-family:'Public Sans',sans-serif;font-size:.9rem;font-weight:600;color:var(--muted);background:transparent;border:none;border-bottom:2px solid transparent;cursor:pointer;transition:color .15s,border-color .15s;margin-bottom:-1px}\n    .tab-btn.is-active{color:var(--blue);border-bottom-color:var(--blue)}\n    .tab-btn:hover:not(.is-active){color:var(--navy);background:var(--blue-lt)}\n    .tab-panel{display:none}\n    .tab-panel.is-active{display:block}\n\n    /* RECENTLY ADDED */\n    .recently-bar{padding:10px 16px;background:#fffbeb;border-bottom:1px solid #fde68a;display:flex;align-items:center;gap:8px;font-size:.875rem;flex-wrap:wrap}\n    .recently-bar .ms{color:var(--amber)}\n    .recently-bar strong{color:#92400e}\n    .recent-chips{display:flex;gap:6px;flex-wrap:wrap}\n    .recent-chip{padding:2px 10px;background:#fef3c7;border:1px solid #fde68a;border-radius:999px;font-size:.78rem;color:#92400e;cursor:pointer;transition:background .15s}\n    .recent-chip:hover{background:#fde68a}\n\n    /* SEARCH */\n    .search-row{padding:12px 16px;border-bottom:1px solid var(--blue-10);display:flex;gap:8px}\n    .search-wrap{display:flex;flex:1;border:1.5px solid var(--blue-20);border-radius:var(--r);overflow:hidden;background:#fff;transition:border-color .15s}\n    .search-wrap:focus-within{border-color:var(--blue)}\n    .search-input{flex:1;border:none;padding:8px 12px;font-size:.9rem;font-family:'Source Sans 3',sans-serif;outline:none;background:transparent;color:var(--text)}\n    .search-btn{background:var(--blue);color:#fff;border:none;padding:0 14px;cursor:pointer;display:flex;align-items:center}\n    .search-btn .ms{font-size:1.1rem}\n\n    /* TABLE */\n    .ip-table-wrap{overflow-x:auto}\n    .ip-table{width:100%;border-collapse:collapse}\n    .ip-table th{padding:10px 12px;text-align:left;font-family:'Public Sans',sans-serif;font-size:.78rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);background:var(--blue-lt);border-bottom:2px solid var(--blue-10);white-space:nowrap;cursor:pointer;user-select:none;transition:color .15s}\n    .ip-table th:hover{color:var(--blue)}\n    .ip-table th.sa::after{content:' ↑';color:var(--blue)}\n    .ip-table th.sd::after{content:' ↓';color:var(--blue)}\n    .ip-table th:not([data-sort]){cursor:default}\n    .ip-table td{padding:11px 12px;border-bottom:1px solid var(--gray5);font-size:.9rem;vertical-align:middle}\n    .ip-table tr:last-child td{border-bottom:none}\n    .ip-table tbody tr:hover td{background:var(--blue-lt)}\n    .col-id{font-family:'Public Sans',sans-serif;font-weight:700;color:var(--blue);font-size:.85rem;white-space:nowrap}\n    .col-title a{color:var(--navy);text-decoration:none;font-weight:600}\n    .col-title a:hover{color:var(--blue);text-decoration:underline}\n    .col-cat{font-size:.85rem;color:var(--muted);white-space:nowrap}\n    .col-vot aria-label=\"Search\"><span class=\"ms\">search<\u002Fspan><\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"ip-table-wrap\">\n          <table class=\"ip-table\">\n            <thead>\n              <tr>\n                <th data-sort=\"id\" class=\"sd\">ID<\u002Fth>\n                <th data-sort=\"title\">Title<\u002Fth>\n                <th data-sort=\"category\">Category<\u002Fth>\n                <th data-sort=\"status\">Status<\u002Fth>\n                <th data-sort=\"votes\" style=\"text-align:center\">Votes<\u002Fth>\n                <th style=\"text-align:center;cursor:default\">Vote<\u002Fth>\n              <\u002Ftr>\n            <\u002Fthead>\n            <tbody id=\"allResults\"><\u002Ftbody>\n          <\u002Ftable>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- TOP 10 -->\n      <div class=\"tab-panel\" id=\"panel-top\">\n        <div class=\"ip-table-wrap\">\n          <table class=\"ip-table\">\n            <thead>\n              <tr>\n                <th style=\"cursor:default;width:44px\">#<\u002Fth>\n                <th>Title<\u002Fth>\n                <th>Category<\u002Fth>\n                <th>Status<\u002Fth>\n                <th style=\"text-align:center\">Votes<\u002Fth>\n                <th style=\"text-align:center;cursor:default\">Vote<\u002Fth>\n              <\u002Ftr>\n            <\u002Fthead>\n            <tbody id=\"topResults\"><\u002Ftbody>\n          <\u002Ftable>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- MY IDEAS -->\n      <div class=\"tab-panel\" id=\"panel-my\">\n        <div class=\"ip-table-wrap\">\n          <table class=\"ip-table\">\n            <thead>\n              <tr>\n                <th>ID<\u002Fth>\n                <th>Title<\u002Fth>\n                <th>Category<\u002Fth>\n                <th>Status<\u002Fth>\n                <th style=\"text-align:center\">Votes<\u002Fth>\n              <\u002Ftr>\n            <\u002Fthead>\n            <tbody id=\"myResults\"><\u002Ftbody>\n          <\u002Ftable>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- SUBMIT MODAL -->\n<div class=\"modal-overlay\" id=\"modalOverlay\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"modalTitle\">\n  <div class=\"modal-box\">\n    <div class=\"modal-hd\">\n      <h2 id=\"modalTitle\"><span class=\"ms\">lightbulb<\u002Fspan>Submit an Idea<\u002Fh2>\n      <button class=\"modal-close\" id=\"closeModal\" aria-label=\"Close\">×<\u002Fbutton>\n    <\u002Fdiv>\n    <div class=\"modal-body\">\n      <div class=\"form-field\">\n        <label class=\"form-label\" for=\"inpTitle\">Idea Title <span class=\"req\">*<\u002Fspan><\u002Flabel>\n        <input type=\"text\" id=\"inpTitle\" class=\"form-input\" placeholder=\"A clear, concise title — 10 words or fewer\">\n      <\u002Fdiv>\n      <div class=\"form-field\">\n        <label class=\"form-label\" for=\"inpDesc\">Description <span class=\"req\">*<\u002Fspan><\u002Flabel>\n        <textarea id=\"inpDesc\" class=\"form-textarea\" placeholder=\"What would this feature do? How would it work?\"><\u002Ftextarea>\n      <\u002Fdiv>\n      <div class=\"form-field\">\n        <label class=\"form-label\" for=\"inpBenefit\">Benefit <span class=\"req\">*<\u002Fspan><\u002Flabel>\n        <textarea id=\"inpBenefit\" class=\"form-textarea\" rows=\"2\" placeholder=\"What problem does this solve for VA teams?\"><\u002Ftextarea>\n      <\u002Fdiv>\n      <div class=\"form-row\">\n        <div class=\"form-field\">\n          <label class=\"form-label\" for=\"inpCat\">Category <span class=\"req\">*<\u002Fspan><\u002Flabel>\n          <select id=\"inpCat\" class=\"form-select\"><option value=\"\" disabled=\"\" selected=\"\">Select category<\u002Foption><option>Email Template<\u002Foption><option>Forms<\u002Foption><option>Inbox<\u002Foption><option>Nexus<\u002Foption><option>Print to PDF<\u002Foption><option>Report Builder<\u002Foption><option>Support<\u002Foption><option>Training<\u002Foption><option>User Access Groups<\u002Foption><option>User Interface<\u002Foption><option>Workflow<\u002Foption><option>Other<\u002Foption><\u002Fselect>\n        <\u002Fdiv>\n        <div class=\"form-field\">\n          <label class=\"form-label\" for=\"inpImpact\">Impact Level <span class=\"req\">*<\u002Fspan><\u002Flabel>\n          <select id=\"inpImpact\" class=\"form-select\"><option value=\"\" disabled=\"\" selected=\"\">Select impact<\u002Foption><option>Impacts National<\u002Foption><option>Impacts Regional<\u002Foption><option>Impacts Local Facility<\u002Foption><option>Impacts subset of users<\u002Foption><\u002Fselect>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"modal-footer\">\n      <button class=\"btn btn-ghost\" id=\"saveDraft\">Save as Draft<\u002Fbutton>\n      <button class=\"btn btn-pri\" id=\"submitIdea\"><span class=\"ms\">send<\u002Fspan>Submit Idea<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"toast\" id=\"toast\" role=\"alert\"><\u002Fdiv>\n\n<script>\nconst IDEAS=[\n  {id:247,title:\"Add bulk export to Report Builder\",category:\"Report Builder\",status:\"In Progress\",votes:142,mine:true,voted:true,recent:false},\n  {id:246,title:\"Dark mode for the LEAF interface\",category:\"User Interface\",status:\"Under Review\",votes:89,mine:false,voted:false,recent:false},\n  {id:245,title:\"Email notifications for workflow approvals\",category:\"Workflow\",status:\"New Submission\",votes:67,mine:false,voted:false,recent:true},\n  {id:244,title:\"Drag-and-drop form field reordering\",category:\"Forms\",status:\"Completed\",votes:201,mine:true,voted:true,recent:false},\n  {id:243,title:\"Add keyboard shortcuts to inbox\",category:\"Inbox\",status:\"Under Review\",votes:54,mine:false,voted:true,recent:false},\n  {id:242,title:\"PDF download for all submitted forms\",category:\"Print to PDF\",status:\"In Progress\",votes:78,mine:false,voted:false,recent:false},\n  {id:241,title:\"Custom email signature in templates\",category:\"Email Template\",status:\"New Submission\",votes:23,mine:false,voted:false,recent:true},\n  {id:240,title:\"User access group bulk import via CSV\",category:\"User Access Groups\",status:\"Completed\",votes:96,mine:false,voted:true,recent:false},\n  {id:239,title:\"Real-time collaboration on form editing\",category:\"Forms\",status:\"Under Review\",votes:115,mine:false,voted:false,recent:false},\n  {id:238,title:\"Training video captions and subtitles\",category:\"Training\",status:\"In Progress\",votes:41,mine:true,voted:true,recent:false},\n  {id:237,title:\"Nexus integration with external HR systems\",category:\"Nexus\",status:\"New Submission\",votes:19,mine:false,voted:false,recent:true},\n  {id:236,title:\"Report Builder date range picker improvements\",category:\"Report Builder\",status:\"New Submission\",votes:33,mine:false,voted:false,recent:true},\n  {id:235,title:\"Support ticket auto-routing by category\",category:\"Support\",status:\"Under Review\",votes:47,mine:false,voted:false,recent:false},\n  {id:234,title:\"Conditional logic in email templates\",category:\"Email Template\",status:\"Completed\",votes:88,mine:false,voted:true,recent:false},\n  {id:233,title:\"Workflow step time tracking dashboard\",category:\"Workflow\",status:\"In Progress\",votes:61,mine:false,voted:false,recent:false}\n];\n\nconst BADGES={\n  'New Submission':'<span class=\"ip-badge ip-badge--new\"><span class=\"ms\">fiber_new<\u002Fspan>New Submission<\u002Fspan>',\n  'Under Review':'<span class=\"ip-badge ip-badge--review\"><span class=\"ms\">visibility<\u002Fspan>Under Review<\u002Fspan>',\n  'In Progress':'<span class=\"ip-badge ip-badge--progress\"><span class=\"ms\">pending<\u002Fspan>In Progress<\u002Fspan>',\n  'Completed':'<span class=\"ip-badge ip-badge--done\"><span class=\"ms\">check_circle<\u002Fspan>Completed<\u002Fspan>',\n  'Discarded':'<span class=\"ip-badge ip-badge--discarded\"><span class=\"ms\">cancel<\u002Fspan>Discarded<\u002Fspan>'\n};\n\nlet currentCat='all',currentSearch='',sortKey='id',sortDir='desc';\n\nfunction filtered(){\n  return IDEAS.filter(i=>{\n    const mc=currentCat==='all'||i.category===currentCat;\n    const q=currentSearch.toLowerCase();\n    const ms=!q||i.title.toLowerCase().includes(q)||i.category.toLowerCase().includes(q)||String(i.id).includes(q);\n    return mc&&ms;\n  });\n}\nfunction sorted(list){\n  return[...list].sort((a,b)=>{\n    let av=a[sortKey],bv=b[sortKey];\n    if(typeof av==='string'){av=av.toLowerCase();bv=bv.toLowerCase();}\n    const d=sortDir==='asc'?1:-1;\n    return av<bv?-d:av>bv?d:0;\n  });\n}\nfunction voteBtn(idea){\n  if(idea.voted)return`<button class=\"vote-btn voted\" disabled><span class=\"ms\">thumb_up<\u002Fspan>${idea.votes}<\u002Fbutton>`;\n  return`<button class=\"vote-btn\" data-id=\"${idea.id}\" aria-label=\"Vote\"><span class=\"ms\">thumb_up<\u002Fspan>${idea.votes}<\u002Fbutton>`;\n}\nfunction buildRow(idea,rank){\n  const rankCell=rank!==undefined\n    ?`<td style=\"text-align:center;font-family:'Public Sans',sans-serif;font-weight:700;color:var(--muted)\">${rank}<\u002Ftd>`\n    :`<td class=\"col-id\">#${idea.id}<\u002Ftd>`;\n  return`<tr>${rankCell}<td class=\"col-title\"><a href=\"#\" onclick=\"return false\">${idea.title}<\u002Fa><\u002Ftd><td class=\"col-cat\">${idea.category}<\u002Ftd><td>${BADGES[idea.status]||idea.status}<\u002Ftd><td class=\"col-votes\">${idea.votes}<\u002Ftd><td class=\"col-act\">${voteBtn(idea)}<\u002Ftd><\u002Ftr>`;\n}\nfunction renderAll(){\n  const list=sorted(filtered());\n  document.getElementById('allResults').innerHTML=list.length\n    ?list.map(i=>buildRow(i)).join('')\n    :`<tr><td colspan=\"6\"><div class=\"empty-state\"><span class=\"ms\">search_off<\u002Fspan><p>No ideas match your search.<\u002Fp><\u002Fdiv><\u002Ftd><\u002Ftr>`;\n}\nfunction renderTop(){\n  const top=[...IDEAS].sort((a,b)=>b.votes-a.votes).slice(0,10);\n  document.getElementById('topResults').innerHTML=top.map((i,idx)=>buildRow(i,idx+1)).join('');\n}\nfunction renderMy(){\n  const my=IDEAS.filter(i=>i.mine);\n  document.getElementById('myResults').innerHTML=my.length\n    ?my.map(i=>`<tr><td class=\"col-id\">#${i.id}<\u002Ftd><td class=\"col-title\"><a href=\"#\" onclick=\"return false\">${i.title}<\u002Fa><\u002Ftd><td class=\"col-cat\">${i.category}<\u002Ftd><td>${BADGES[i.status]||i.status}<\u002Ftd><td class=\"col-votes\">${i.votes}<\u002Ftd><\u002Ftr>`).join('')\n    :`<tr><td colspan=\"5\"><div class=\"empty-state\"><span class=\"ms\">lightbulb<\u002Fspan><p>You haven't submitted any ideas yet.<\u002Fp><\u002Fdiv><\u002Ftd><\u002Ftr>`;\n}\nfunction renderAll_(){renderAll();renderTop();renderMy();}\nfunction renderRecentChips(){\n  document.getElementById('recentChips').innerHTML=IDEAS.filter(i=>i.recent).slice(0,4).map(i=>`<span class=\"recent-chip\">#${i.id} — ${i.title.substring(0,30)}${i.title.length>30?'…':''}<\u002Fspan>`).join('');\n}\nrenderAll_();renderRecentChips();\n\ndocument.getElementById('catList').addEventListener('click',e=>{\n  const item=e.target.closest('.cat-item');if(!item)return;\n  document.querySelectorAll('.cat-item').forEach(x=>x.classList.remove('is-active'));\n  item.classList.add('is-active');currentCat=item.dataset.cat;renderAll();\n});\n\nlet st;\ndocument.getElementById('searchInput').addEventListener('input',function(){clearTimeout(st);st=setTimeout(()=>{currentSearch=this.value;renderAll();},200);});\n\ndocument.querySelectorAll('[data-sort]').forEach(th=>{\n  th.addEventListener('click',function(){\n    const key=this.dataset.sort;\n    if(sortKey===key){sortDir=sortDir==='asc'?'desc':'asc';}else{sortKey=key;sortDir='asc';}\n    document.querySelectorAll('[data-sort]').forEach(h=>h.classList.remove('sa','sd'));\n    this.classList.add(sortDir==='asc'?'sa':'sd');renderAll();\n  });\n});\n\ndocument.querySelectorAll('.tab-btn').forEach(btn=>{\n  btn.addEventListener('click',function(){\n    document.querySelectorAll('.tab-btn').forEach(b=>{b.classList.remove('is-active');b.setAttribute('aria-selected','false');});\n    document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('is-active'));\n    this.classList.add('is-active');this.setAttribute('aria-selected','true');\n    document.getElementById('panel-'+this.dataset.tab).classList.add('is-active');\n  });\n});\n\ndocument.addEventListener('click',e=>{\n  const btn=e.target.closest('.vote-btn:not(.voted):not(:disabled)');\n  if(!btn)return;\n  const idea=IDEAS.find(i=>i.id===parseInt(btn.dataset.id));\n  if(!idea||idea.voted)return;\n  idea.voted=true;idea.votes++;\n  renderAll_();showToast('Thanks for your vote!');\n  document.getElementById('myVoteCount').textContent=IDEAS.filter(i=>i.voted).length;\n});\n\nfunction openModal(){document.getElementById('modalOverlay').classList.add('is-open');document.getElementById('inpTitle').focus();}\nfunction closeModal(){document.getElementById('modalOverlay').classList.remove('is-open');}\ndocument.getElementById('openModal').addEventListener('click',openModal);\ndocument.getElementById('closeModal').addEventListener('click',closeModal);\ndocument.getElementById('modalOverlay').addEventListener('click',e=>{if(e.target===document.getElementById('modalOverlay'))closeModal();});\ndocument.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});\ndocument.getElementById('submitIdea').addEventListener('click',()=>{closeModal();showToast('Your idea has been submitted!');});\ndocument.getElementById('saveDraft').addEventListener('click',()=>{closeModal();showToast('Idea saved as draft — find it in My Ideas.');});\n\nfunction showToast(msg){\n  const t=document.getElementById('toast');\n  t.innerHTML='<span class=\"ms\">check_circle<\u002Fspan>'+msg;\n  t.classList.add('is-visible');\n  setTimeout(()=>t.classList.remove('is-visible'),3500);\n}\n\nwindow.addEventListener('scroll',()=>document.getElementById('lpNav').classList.toggle('scrolled',window.pageYOffset>10),{passive:true});\n\nconst triggers=document.querySelectorAll('.dd-trigger');\nfunction closeAll(x){triggers.forEach(t=>{if(t===x)return;t.setAttribute('aria-expanded','false');t.closest('.dd-item').classList.remove('open');const p=document.getElementById('dd-'+t.dataset.dd);if(p)p.setAttribute('hidden','');});}\ntriggers.forEach(trigger=>{\n  trigger.addEventListener('click',function(e){\n    e.stopPropagation();const isOpen=this.getAttribute('aria-expanded')==='true';closeAll(null);\n    if(!isOpen){this.setAttribute('aria-expanded','true');this.closest('.dd-item').classList.add('open');const p=document.getElementById('dd-'+this.dataset.dd);if(p)p.removeAttribute('hidden');}\n  });\n});\ndocument.addEventListener('click',()=>closeAll(null));\ndocument.addEventListener('keydown',e=>{if(e.key==='Escape')closeAll(null);});\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
