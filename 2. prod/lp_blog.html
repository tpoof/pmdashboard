<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog — LEAF Launchpad</title>

    <!-- Confirmed against main.tpl's own header/nav include. -->
    <link rel="stylesheet" href="./files/launchpad.css" />
    <link rel="stylesheet" href="./files/leaf_header.css" />
    <link
      rel="stylesheet"
      href="https://leaf.va.gov/platform/blog/files/blog.css"
    />

    <style>
      /* Icon sizing for classes defined in launchpad.css (out of scope
         for this edit) — that file still sizes .material-symbols-outlined
         via font-size, which no longer affects the inlined <svg>. This
         restores the "Load more" button's icon to its pre-conversion
         size without touching launchpad.css; everything else (color,
         layout) still cascades correctly from the original rule there. */
      .btn .material-symbols-outlined svg {
        width: 1.15rem;
        height: 1.15rem;
      }
      .blog-spinner-icon {
        width: 32px;
        height: 32px;
      }

      /* ── Post grid ── */
      .blog-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1.25rem;
      }
      @media (max-width: 900px) {
        .blog-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      @media (max-width: 500px) {
        .blog-grid {
          grid-template-columns: 1fr;
        }
      }

      .blog-card {
        background: var(--surface, #fff);
        border-radius: var(--radius, 8px);
        box-shadow: var(--shadow-card, 0 2px 12px rgba(0, 0, 0, 0.08));
        padding: 1.75rem 1.5rem;
        display: flex;
        flex-direction: column;
        gap: 0.6rem;
        /* Brand accent rule, top edge only — same treatment established
           for the reader page's article card (BlogPost.html), not
           voc-channel-card's solid var(--color-primary) top border. */
        border-top: 4px solid transparent;
        border-image: linear-gradient(90deg, #7bc143, #0071bd) 1;
      }

      .blog-card-category {
        display: inline-flex;
        align-self: flex-start;
        align-items: center;
        font-family: "PublicSans-Bold", sans-serif;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.02rem;
        color: var(--color-primary, #005ea2);
        background: var(--color-primary-lightest, #e8f0fb);
        border-radius: 999px;
        padding: 0.2rem 0.7rem;
      }

      .blog-card-title {
        font-family: "PublicSans-Bold", sans-serif;
        font-size: 1.1rem;
        line-height: 1.35;
        margin: 0;
      }
      .blog-card-title a {
        color: var(--color-text, #1b1b1b);
        text-decoration: none;
      }
      .blog-card-title a:hover {
        color: var(--color-primary, #005ea2);
        text-decoration: underline;
      }
      .blog-card-title a:focus-visible {
        outline: 3px solid var(--color-primary, #005ea2);
        outline-offset: 3px;
      }

      .blog-card-date {
        font-family: "Source Sans Pro Web", sans-serif;
        font-size: 0.85rem;
        color: var(--color-text-muted, #5c6670);
        margin: 0;
      }

      .blog-card-excerpt {
        font-family: "Source Sans Pro Web", sans-serif;
        font-size: 0.95rem;
        color: var(--color-text-muted, #5c6670);
        line-height: 1.55;
        margin: 0;
        flex: 1;
      }

      /* ── Grid states (loading / error / empty) ── */
      .blog-status {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
        padding: 3rem 1.5rem;
        color: var(--color-text-muted, #5c6670);
        font-family: "Source Sans Pro Web", sans-serif;
      }
      .blog-spinner {
        width: 32px;
        height: 32px;
        border: 4px solid var(--c-blue10, #d9e8f6);
        border-top-color: var(--color-primary, #005ea2);
        border-radius: 50%;
        animation: blog-spin 0.75s linear infinite;
      }
      @keyframes blog-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .blog-spinner {
          animation-duration: 1.6s;
        }
      }

      .blog-error {
        max-width: 640px;
        margin: 0 auto;
        background: #f4e3db;
        border-left: 4px solid #d54309;
        border-radius: var(--radius, 8px);
        padding: 1rem 1.5rem;
        color: #8b0a03;
        font-family: "Source Sans Pro Web", sans-serif;
      }

      .blog-empty {
        text-align: center;
        padding: 3rem 1.5rem;
        color: var(--color-text-muted, #5c6670);
        font-family: "Source Sans Pro Web", sans-serif;
        font-size: 1.05rem;
      }

      .blog-load-more-wrap {
        display: flex;
        justify-content: center;
        margin-top: 2.5rem;
      }

      /* .blog-status and .blog-load-more-wrap both set display:flex,
         which — being an author rule — always wins over the browser's
         own [hidden]{display:none} default, regardless of selector
         order or specificity (user-agent styles are the lowest-priority
         cascade origin). Setting the hidden attribute via JS alone
         doesn't actually hide either element without this. */
      .blog-status[hidden],
      .blog-load-more-wrap[hidden] {
        display: none;
      }

      .lp-jump .material-symbols-outlined svg {
        width: 1.25rem;
        height: 1.25rem;
      }

      /* Defensive — same [hidden]-vs-display trap as .blog-status above.
         blog.css (external, not owned by this edit) may give .bp-image an
         explicit display; this guarantees figureEl.hidden actually hides
         it regardless of what that rule turns out to be. */
      .bp-image[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="lp" id="lp-root">
      <a class="lp-skip" href="#lp-main">Skip to main content</a>
      <div id="lp-header-host"></div>

      <main id="lp-main" tabindex="-1">
        <div
          id="blog-live-polite"
          class="sr-only"
          aria-live="polite"
          aria-atomic="true"
        ></div>
        <div
          id="blog-live-assertive"
          class="sr-only"
          aria-live="assertive"
          aria-atomic="true"
        ></div>

        <div id="blog-index-view">
          <!-- ── PAGE TITLE ── -->
          <section class="section" aria-labelledby="blog-page-h1">
            <div class="wrap">
              <div class="sec-hd ctr">
                <span class="eyebrow">From the LEAF team</span>
                <h1 class="sec-h2" id="blog-page-h1" tabindex="-1">Blog</h1>
                <p class="sec-sub">
                  Updates, stories, and news from the LEAF team.
                </p>
              </div>
            </div>
          </section>

          <!-- ── POST GRID ── -->
          <section class="section section-alt" aria-labelledby="blog-grid-h2">
            <div class="wrap">
              <div class="sec-hd ctr">
                <span class="eyebrow">Latest posts</span>
                <h2 class="sec-h2" id="blog-grid-h2" tabindex="-1">
                  All Posts
                </h2>
                <p class="sec-sub">Browse recent posts from the LEAF team.</p>
              </div>

              <div id="blog-status" class="blog-status" role="status">
                <div class="blog-spinner" aria-hidden="true"></div>
                <p>Loading posts&hellip;</p>
              </div>

              <div id="blog-error" class="blog-error" role="alert" hidden></div>

              <div id="blog-empty" class="blog-empty" hidden>
                There are no blog posts yet.
              </div>

              <div class="blog-grid" role="list" id="blog-grid"></div>

              <div class="blog-load-more-wrap" id="blog-load-more-wrap" hidden>
                <button class="btn btn-sec" id="blog-load-more" type="button">
                  Load more
                  <span class="material-symbols-outlined" aria-hidden="true"
                    ><svg viewBox="0 -960 960 960" fill="currentColor">
                      <path
                        d="M480-345 240-585l56-56 184 184 184-184 56 56-240 240Z"
                      /></svg
                  ></span>
                </button>
              </div>
            </div>
          </section>
        </div>

        <!-- ── POST READER (shown via #<recordID> hash — see route() below) ── -->
        <div id="blog-post-view" style="display: none">
          <div id="blogPost" lang="en">
            <a class="bp-skip-link" href="#bp-article">Skip to article</a>
            <div
              id="bp-loading"
              class="bp-loading"
              role="status"
              aria-label="Loading post"
            >
              <div class="bp-spinner" aria-hidden="true"></div>
              <p>Loading post&hellip;</p>
            </div>
            <div
              id="bp-error"
              class="bp-error"
              role="alert"
              style="display: none"
            ></div>
            <div id="bp-content" style="display: none">
              <a class="bp-back-link" href="#">&larr; Back to blog</a>
              <div>
                <header class="bp-header">
                  <span
                    id="bp-category"
                    class="bp-category"
                    style="display: none"
                  ></span>
                  <div class="bp-header-row">
                    <div class="bp-header-icon" aria-hidden="true">
                      <svg
                        xmlns="http://www.w3.org/2000/svg"
                        viewBox="0 -960 960 960"
                        fill="currentColor"
                      >
                        <path
                          d="M480-40 360-160H200q-33 0-56.5-23.5T120-240v-560q0-33 23.5-56.5T200-880h560q33 0 56.5 23.5T840-800v560q0 33-23.5 56.5T760-160H600L480-40Zm0-280q86 0 143-60t57-140v-200H480q-81 0-140.5 57T280-520q0 30 8.5 57t23.5 50l-16 16q-12 12-12 28t12 28q12 12 27.5 11.5T352-341l15-14q24 17 52.5 26t60.5 9Zm62-226.5q0 16.5-12 28.5l-75 75q-12 12-28.5 12T398-443q-11-12-11-28.5t11-27.5l76-76q12-12 28-12t28 12q12 12 12 28.5Z"
                        />
                      </svg>
                    </div>
                    <div class="bp-header-text">
                      <h1 id="bp-title" class="bp-title" tabindex="-1"></h1>
                      <div class="bp-byline">
                        <span id="bp-date"></span>
                        <span aria-hidden="true">&middot;</span>
                        <span id="bp-readtime"></span>
                      </div>
                    </div>
                  </div>
                </header>
                <article id="bp-article" class="bp-article">
                  <div id="bp-body" class="bp-body">
                    <figure id="bp-image-figure" class="bp-image" hidden>
                      <img id="bp-image" src="" alt="" />
                    </figure>
                    <div id="bp-body-content"></div>
                  </div>
                </article>
                <footer class="bp-footer">
                  <a class="bp-back-link" href="#">&larr; Back to blog</a>
                </footer>
              </div>
            </div>
          </div>
        </div>
      </main>

      <button
        class="lp-jump"
        id="lpJump"
        type="button"
        aria-label="Back to top"
        aria-hidden="true"
        tabindex="-1"
      >
        <span class="material-symbols-outlined" aria-hidden="true"
          ><svg viewBox="0 -960 960 960" fill="currentColor">
            <path
              d="M440-160v-487L216-423l-56-57 320-320 320 320-56 57-224-224v487h-80Z"
            /></svg
        ></span>
      </button>
    </div>
    <!-- /.lp -->

    <!-- Confirmed against main.tpl's own header/nav include. -->
    <script
      src="./files/leaf_header.js"
      data-is-admin="<!--{$is_admin}-->"
    ></script>

    <script>
      (() => {
        "use strict";

        // Mirrors BlogPost.js's CONFIG.indicators pattern: name every
        // indicatorID by purpose instead of scattering raw numbers through
        // the code. Verify these against the "Blog Post" form in LEAF Form
        // Editor before changing them — kept in sync with blog/files/blog.js.
        const CONFIG = {
          // Site root — this page is served from /launchpad/, a different
          // directory than the Blog Post form's own site, so the query
          // below builds an absolute path from this rather than a relative
          // one. "files/" (where blog.js itself lives) is just the assets
          // subfolder, same pattern as /launchpad/files/leaf_header.js —
          // the API hangs off the site root, not files/.
          apiBase: "/platform/blog/",
          // No categoryID/formID filter — confirmed against a real record
          // that /platform/blog/api/form/query is already scoped to this
          // one form; categoryID isn't a real filterable field (blog.js's
          // own working query doesn't use one either). Publish status is
          // the string field lastStatus, not a numeric stepID — confirmed
          // against a live "Published" record's actual response.
          publishedStatus: "Published",
          // Full field set — the grid only fetches title/category/
          // publishDate/excerpt (see loadBatch's getData call below); the
          // reader fetches all of these for a single post.
          indicators: {
            title: 2,
            category: 3,
            publishDate: 4,
            excerpt: 5, // Lead paragraph, truncated as the card summary
            body: 6, // Trumbowyg-authored HTML, sanitized before rendering
            featuredImage: 7,
            featuredImageAlt: 8,
          },
          batchSize: 12,
        };

        // Same self-hosted build leaf_header.js already uses to sanitize
        // its announcement banner — reusing it here rather than adding a
        // second copy of the same dependency.
        const DOMPURIFY_SRC =
          "https://leaf.va.gov/app/libs/js/dompurify/dompurify.min.js";

        const byId = (id) => document.getElementById(id);

        let currentOffset = 0;

        // ── Duplicated from blog/files/blog.js rather than shared, since
        // this page and the reader page live in separate deployed
        // directories with no common relative path between them. Keep
        // these two copies in sync if the form's fields ever change. ──
        function decodeEntities(str) {
          if (!str || typeof str !== "string") return str;
          return str
            .replace(/&amp;/g, "&")
            .replace(/&lt;/g, "<")
            .replace(/&gt;/g, ">")
            .replace(/&quot;/g, '"')
            .replace(/&#039;/g, "'")
            .replace(/&#39;/g, "'")
            .replace(/&#x27;/g, "'")
            .replace(/&apos;/g, "'");
        }

        function getField(s1, indicatorID) {
          if (!s1) return "";
          const v = s1[`id${indicatorID}`];
          if (v == null) return "";
          return decodeEntities(String(v).trim());
        }

        function formatDate(raw) {
          if (!raw) return "";
          const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(raw);
          const d = m
            ? new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]))
            : new Date(raw);
          if (isNaN(d.getTime())) return raw;
          return d.toLocaleDateString("en-US", {
            year: "numeric",
            month: "long",
            day: "numeric",
          });
        }

        function parsePublishDate(raw) {
          if (!raw) return 0;
          const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(raw);
          const d = m
            ? new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]))
            : new Date(raw);
          return isNaN(d.getTime()) ? 0 : d.getTime();
        }

        function truncateExcerpt(text, maxLen = 160) {
          if (!text) return "";
          if (text.length <= maxLen) return text;
          const slice = text.slice(0, maxLen + 1);
          const lastSpace = slice.lastIndexOf(" ");
          const cut =
            lastSpace > 0 ? slice.slice(0, lastSpace) : slice.slice(0, maxLen);
          return cut.trim() + "…";
        }

        function announce(message, assertive) {
          const node = byId(
            assertive ? "blog-live-assertive" : "blog-live-polite",
          );
          if (!node) return;
          node.textContent = "";
          setTimeout(() => {
            node.textContent = message;
          }, 60);
        }

        // Returns { card, heading } so the caller can move focus to the
        // heading of the first newly-appended card after "Load more",
        // same accessible-focus pattern as BlogPost.js's byId("bp-title").
        function createCard(recordID, s1) {
          const title =
            getField(s1, CONFIG.indicators.title) || "Untitled post";
          const category = getField(s1, CONFIG.indicators.category);
          const publishDateRaw = getField(s1, CONFIG.indicators.publishDate);
          const excerpt = truncateExcerpt(
            getField(s1, CONFIG.indicators.excerpt),
          );

          const card = document.createElement("article");
          card.className = "blog-card";
          card.setAttribute("role", "listitem");

          if (category) {
            const chip = document.createElement("span");
            chip.className = "blog-card-category";
            chip.textContent = category;
            card.appendChild(chip);
          }

          const heading = document.createElement("h3");
          heading.className = "blog-card-title";
          heading.tabIndex = -1;
          const link = document.createElement("a");
          link.href = `#${encodeURIComponent(recordID)}`;
          link.textContent = title;
          heading.appendChild(link);
          card.appendChild(heading);

          if (publishDateRaw) {
            const date = document.createElement("p");
            date.className = "blog-card-date";
            date.textContent = formatDate(publishDateRaw);
            card.appendChild(date);
          }

          if (excerpt) {
            const p = document.createElement("p");
            p.className = "blog-card-excerpt";
            p.textContent = excerpt;
            card.appendChild(p);
          }

          return { card, heading };
        }

        async function loadBatch(offset, isLoadMore) {
          const grid = byId("blog-grid");
          const status = byId("blog-status");
          const error = byId("blog-error");
          const empty = byId("blog-empty");
          const loadMoreWrap = byId("blog-load-more-wrap");
          const loadMoreBtn = byId("blog-load-more");

          if (loadMoreBtn) loadMoreBtn.disabled = true;
          error.hidden = true;
          if (!isLoadMore) {
            empty.hidden = true;
            status.hidden = false;
          }

          try {
            // Bypasses LeafFormQuery/formQuery.js entirely — confirmed its
            // execute() builds request URLs via a lossy custom encoder
            // (encodeReadableURI, which doesn't properly escape {}/[]/etc.)
            // that this API silently mishandles, always returning []. A
            // manually-built fetch with encodeURIComponent — the same
            // approach blog/files/blog.js already uses successfully for
            // the single-post query — returns real data. recordID > 0
            // rather than an empty terms array, since this API treats an
            // empty array as unmatchable rather than "no filter."
            const q = {
              terms: [{ id: "recordID", operator: ">", match: 0, gate: "AND" }],
              joins: [],
              // No server-side sort — confirmed it breaks this endpoint:
              // {column: <indicatorID>, direction} silently returns [],
              // even though {} alone works. Sorting entirely client-side
              // below instead (by the real publishDate field values).
              sort: {},
              getData: [
                CONFIG.indicators.title,
                CONFIG.indicators.category,
                CONFIG.indicators.publishDate,
                CONFIG.indicators.excerpt,
              ],
              limit: CONFIG.batchSize,
              limitOffset: offset,
            };
            const r = await fetch(
              `${CONFIG.apiBase}api/form/query?q=${encodeURIComponent(JSON.stringify(q))}`,
              { credentials: "include" },
            );
            if (!r.ok) throw new Error("Query failed HTTP " + r.status);
            const results = await r.json();
            const rawEntries = Object.entries(results || {});
            const entries = rawEntries.filter(
              ([, rec]) => rec.lastStatus === CONFIG.publishedStatus,
            );

            entries.sort((a, b) => {
              const s1a = a[1].s1 || a[1];
              const s1b = b[1].s1 || b[1];
              return (
                parsePublishDate(getField(s1b, CONFIG.indicators.publishDate)) -
                parsePublishDate(getField(s1a, CONFIG.indicators.publishDate))
              );
            });

            if (!isLoadMore) grid.innerHTML = "";

            let firstNewHeading = null;
            entries.forEach(([recordID, rec]) => {
              const s1 = rec.s1 || rec;
              const { card, heading } = createCard(recordID, s1);
              grid.appendChild(card);
              if (!firstNewHeading) firstNewHeading = heading;
            });

            status.hidden = true;

            // Based on the raw (pre-filter) count, not entries.length —
            // a full raw batch means the server may have more records to
            // page through even if few/none of this batch were published.
            const gotFullBatch = rawEntries.length === CONFIG.batchSize;
            loadMoreWrap.hidden = !gotFullBatch;
            if (loadMoreBtn) loadMoreBtn.disabled = false;

            empty.hidden = grid.children.length !== 0;

            currentOffset = offset + rawEntries.length;

            if (isLoadMore) {
              if (firstNewHeading) firstNewHeading.focus();
              announce(
                `${entries.length} more post${entries.length === 1 ? "" : "s"} loaded.`,
                false,
              );
            }
          } catch (err) {
            console.error("[BlogIndex]", err);
            status.hidden = true;
            error.textContent =
              "Something went wrong loading blog posts. Try refreshing the page.";
            error.hidden = false;
            announce(error.textContent, true);
            if (loadMoreBtn) loadMoreBtn.disabled = false;
          }
        }

        function initGrid() {
          const loadMoreBtn = byId("blog-load-more");
          loadMoreBtn?.addEventListener("click", () =>
            loadBatch(currentOffset, true),
          );
          loadBatch(0, false);
        }

        // ── Post reader — merged in from blog/files/blog.js so posts open
        // inline via #<recordID> instead of navigating to the standalone
        // reader page (leaf.va.gov/platform/blog/...), which would expose
        // that internal URL to the user. Keep in sync with blog.js if the
        // form's fields change; that page is still the source of truth
        // for anyone opening a shared post link directly. ──

        function ensureDompurify() {
          if (window.DOMPurify) return Promise.resolve();
          const existing = document.querySelector(
            `script[src="${DOMPURIFY_SRC}"]`,
          );
          if (existing) {
            return new Promise((resolve) => {
              if (window.DOMPurify) return resolve();
              existing.addEventListener("load", () => resolve());
              existing.addEventListener("error", () => {
                console.warn(
                  "[BlogPost] DOMPurify failed to load — body will not render.",
                );
                resolve();
              });
            });
          }
          return new Promise((resolve) => {
            const s = document.createElement("script");
            s.src = DOMPURIFY_SRC;
            s.async = true;
            s.onload = () => resolve();
            s.onerror = () => {
              console.warn(
                "[BlogPost] DOMPurify failed to load — body will not render.",
              );
              resolve();
            };
            document.head.appendChild(s);
          });
        }

        function getRecordIDFromHash() {
          const hash = window.location.hash.replace("#", "").trim();
          return /^\d+$/.test(hash) ? hash : "";
        }

        async function fetchPostData(recordID) {
          const q = {
            terms: [
              { id: "recordIDs", operator: "=", match: recordID, gate: "AND" },
            ],
            joins: [],
            sort: {},
            getData: Object.values(CONFIG.indicators),
          };
          const r = await fetch(
            `${CONFIG.apiBase}api/form/query?q=${encodeURIComponent(JSON.stringify(q))}`,
            { credentials: "include" },
          );
          if (!r.ok) throw new Error("Query failed HTTP " + r.status);
          const data = await r.json();
          const rec = data && data[recordID];
          return rec || null;
        }

        // Featured image is a File Upload indicator — api/form/query
        // doesn't return a plain URL for those, so this reads the <img>
        // LEAF's own print-view HTML already contains for it instead.
        async function fetchIndicatorHTML(recordID, indicatorID) {
          return fetch(
            `${CONFIG.apiBase}ajaxIndex.php?a=getprintindicator&recordID=${encodeURIComponent(recordID)}&indicatorID=${encodeURIComponent(indicatorID)}&series=1`,
            {
              credentials: "include",
              headers: { "x-requested-with": "XMLHttpRequest" },
            },
          )
            .then((r) => r.text())
            .catch(() => "");
        }

        function parseImageSrcFromHTML(html) {
          const tmp = document.createElement("div");
          tmp.innerHTML = html;
          const img = tmp.querySelector('img[src*="image.php"]');
          return img ? img.getAttribute("src") || "" : "";
        }

        function calcReadTime(wordCount) {
          return Math.max(1, Math.round(wordCount / 200));
        }

        function renderBody(bodyHTML) {
          const container = byId("bp-body-content");
          if (!window.DOMPurify) {
            container.textContent = "";
            console.warn(
              "[BlogPost] Rendering body as empty — DOMPurify unavailable.",
            );
            return 0;
          }
          // FORBID_ATTR strips inline style so pasted content (from Word,
          // Google Docs, etc.) can't override this page's typography.
          container.innerHTML = window.DOMPurify.sanitize(bodyHTML, {
            FORBID_ATTR: ["style"],
          });
          return (container.textContent || "")
            .trim()
            .split(/\s+/)
            .filter(Boolean).length;
        }

        function showPostLoading() {
          byId("bp-loading").style.display = "";
          byId("bp-error").style.display = "none";
          byId("bp-content").style.display = "none";
        }

        function showPostError(message) {
          byId("bp-loading").style.display = "none";
          byId("bp-content").style.display = "none";
          const errEl = byId("bp-error");
          errEl.textContent = message;
          errEl.style.display = "";
          announce(message, true);
        }

        function showPostContent() {
          byId("bp-loading").style.display = "none";
          byId("bp-error").style.display = "none";
          byId("bp-content").style.display = "";
          announce("Post loaded.", false);
        }

        async function loadPost(recordID) {
          showPostLoading();
          try {
            const [rec] = await Promise.all([
              fetchPostData(recordID),
              ensureDompurify(),
            ]);
            if (!rec || rec.lastStatus !== CONFIG.publishedStatus) {
              showPostError("That post could not be found.");
              return;
            }
            const s1 = rec.s1 || rec;

            const title = getField(s1, CONFIG.indicators.title);
            const category = getField(s1, CONFIG.indicators.category);
            const publishDate = getField(s1, CONFIG.indicators.publishDate);
            const bodyHTML = getField(s1, CONFIG.indicators.body);
            const imageAlt = getField(s1, CONFIG.indicators.featuredImageAlt);

            byId("bp-title").textContent = title || "Untitled post";
            document.title = (title || "Blog post") + " — LEAF Launchpad";

            const categoryEl = byId("bp-category");
            if (category) {
              categoryEl.textContent = category;
              categoryEl.style.display = "";
            } else {
              categoryEl.style.display = "none";
            }

            byId("bp-date").textContent = formatDate(publishDate);

            const wordCount = renderBody(bodyHTML);
            byId("bp-readtime").textContent =
              `${calcReadTime(wordCount)} min read`;

            const imageHTML = await fetchIndicatorHTML(
              recordID,
              CONFIG.indicators.featuredImage,
            );
            const imageSrc = parseImageSrcFromHTML(imageHTML);
            const figureEl = byId("bp-image-figure");
            const imgEl = byId("bp-image");
            if (imageSrc) {
              imgEl.src = imageSrc;
              imgEl.alt = imageAlt || "";
              figureEl.hidden = false;
            } else {
              figureEl.hidden = true;
              if (imageHTML.trim()) {
                console.warn(
                  "[BlogPost] featured image indicator returned HTML but no img[src*='image.php'] was found.",
                  imageHTML,
                );
              }
            }

            showPostContent();
            byId("bp-title").focus();
          } catch (err) {
            console.error("[BlogPost]", err);
            showPostError(
              "Something went wrong loading this post. Try refreshing the page.",
            );
          }
        }

        function showIndexView() {
          byId("blog-post-view").style.display = "none";
          byId("blog-index-view").style.display = "";
          document.title = "Blog — LEAF Launchpad";
          byId("blog-grid-h2").focus();
          announce("Returned to blog post list.", false);
        }

        function showPostView() {
          byId("blog-index-view").style.display = "none";
          byId("blog-post-view").style.display = "";
        }

        function route() {
          const recordID = getRecordIDFromHash();
          if (recordID) {
            showPostView();
            loadPost(recordID);
          } else {
            showIndexView();
          }
        }

        function wireBackLinks() {
          document.querySelectorAll(".bp-back-link").forEach((a) => {
            a.addEventListener("click", (e) => {
              e.preventDefault();
              if (window.location.hash) {
                window.location.hash = "";
              } else {
                showIndexView();
              }
            });
          });
        }

        // ── Jump to top — copied verbatim from the other Launchpad pages ──
        const initJumpBtn = () => {
          const btn = document.getElementById("lpJump");
          if (!btn) return;

          const update = () => {
            const vis =
              (window.pageYOffset || document.documentElement.scrollTop) > 120;
            btn.classList.toggle("vis", vis);
            btn.setAttribute("aria-hidden", String(!vis));
            btn.tabIndex = vis ? 0 : -1;
          };

          btn.addEventListener("click", () =>
            window.scrollTo({ top: 0, behavior: "smooth" }),
          );
          window.addEventListener("scroll", update, { passive: true });
          window.addEventListener("resize", update);
          update();
        };

        document.addEventListener("DOMContentLoaded", () => {
          initGrid();
          initJumpBtn();
          wireBackLinks();
          route();
        });
        window.addEventListener("hashchange", route);
      })();
    </script>
  </body>
</html>
